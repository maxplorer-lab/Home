<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting-ETA lab — on the real map</title>
<!--
  The same question the schematic lab answers, drawn where the pill would
  actually live: on Leaflet tiles, with the app's own basemap module.

  Why a second view exists at all. meet-lab.html can prove the maths — it has
  the ablation, the raw steps, the truth columns. What it cannot show is the
  thing the decision is about: two tracks on a real map, a real fence drawn at
  its real radius, and a pill sitting on top of that. The geometry that looks
  like a meeting in a schematic is the geometry you have to be able to judge on
  the map, and the reverse.

  The maths is NOT reimplemented here: meet-maths.js holds the projector, the
  CPA/TCA evaluation, the gates and the pill's phrasing, and both pages call it.
  If the two views ever disagree, that is a bug in one of them, not a wet-lab
  result.

  Serve it with the repo's own /shared/basemaps.js reachable (see 00-README.md)
  -- the basemap module is shared by both real maps precisely so that no page
  carries its own tile URL. This page refuses to guess one.
-->
<style>
  :root { --ink:#111827; --dim:#6b7280; --rule:#e5e7eb; --paper:#fff; --bg:#f6f7f9;
          --ok:#047857; --no:#b91c1c; --a:#1d4ed8; --b:#b45309; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #shell { display:flex; flex-direction:column; height:100%; }
  header { padding:10px 14px; background:var(--paper); border-bottom:1px solid var(--rule); z-index:2000; }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:12px; }
  #stage { position:relative; flex:1; min-height:0; }
  #map { position:absolute; inset:0; background:#0a0a0c; }

  /* The threshold and gate panel, deliberately the same knobs as the schematic
     lab: an argument about the pill's wording is worthless if the demo is
     running a different rule than the table. */
  #panel { position:absolute; top:10px; left:10px; z-index:1000; width:270px; max-height:calc(100% - 20px);
           overflow:auto; background:rgba(255,255,255,.97); border:1px solid var(--rule);
           border-radius:8px; padding:9px 11px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  #panel h2 { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin:0 0 6px; }
  .gates { display:grid; gap:3px; margin-top:6px; }
  label.f { display:flex; gap:6px; align-items:center; font-size:11.5px; }
  label.f input[type=number] { width:56px; font-family:ui-monospace,monospace; font-size:11px; padding:1px 4px;
          border:1px solid var(--rule); border-radius:4px; }
  select { font:inherit; padding:3px 6px; border:1px solid var(--rule); border-radius:6px; background:#fff; width:100%; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--dim); font-size:11px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; margin-top:6px; }
  .grid label.f { white-space:nowrap; }

  /* The pill, styled like the map HUD's, centred where the HUD sits it. */
  #pillwrap { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1000; text-align:center; pointer-events:none; }
  #pill { display:inline-block; padding:5px 12px; border-radius:999px; font-weight:700; font-size:13px;
          background:rgba(17,24,39,.92); color:#fff; white-space:nowrap; opacity:0; transition:opacity .18s; }
  #pill.on { opacity:1; }
  #pill.gone { background:rgba(107,114,128,.92); }
  #why { margin-top:5px; font-size:11px; color:#fff; background:rgba(17,24,39,.72);
         border-radius:6px; padding:3px 8px; display:inline-block; font-family:ui-monospace,monospace; }

  /* Transport: the window is 120 s, so it plays in ~24 s at 5x.
     The strip is the whole point of the view: it shows WHEN the pill would be
     up, with the true closest approach marked, so the flicker in the middle of
     Niri x MaxX is visible without watching for it. */
  footer { background:var(--paper); border-top:1px solid var(--rule); padding:8px 14px 10px; z-index:2000; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-size:12px; padding:3px 10px; border:1px solid var(--rule); border-radius:6px;
           background:#f9fafb; cursor:pointer; }
  button:hover { background:#f3f4f6; }
  input[type=range] { flex:1; min-width:160px; }
  .num { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; }
  #strip { position:relative; height:22px; margin-top:7px; background:#f3f4f6; border:1px solid var(--rule);
           border-radius:5px; overflow:hidden; cursor:pointer; }
  #strip .seg { position:absolute; top:0; bottom:0; }
  #strip .meet { background:#a7f3d0; }
  #strip .together { background:#e5e7eb; }
  #strip .tick { position:absolute; top:0; bottom:0; width:2px; background:var(--no); }
  #strip .play { position:absolute; top:0; bottom:0; width:2px; background:#111827; }
  .legend { color:var(--dim); font-size:11px; }
  .swatch { display:inline-block; width:9px; height:9px; border-radius:2px; margin:0 4px 0 10px; vertical-align:middle; }
  #missing { margin:20px; padding:14px 16px; border-left:3px solid var(--no); background:#fff; border-radius:0 8px 8px 0; max-width:80ch; }
  #missing pre { background:#f3f4f6; padding:8px 10px; border-radius:6px; overflow-x:auto; }
</style>
</head>
<body>
<div id="shell">
  <header>
    <h1>Meeting-ETA lab — the pill, on the real map</h1>
    <div class="sub" id="src">loading…</div>
  </header>

  <div id="stage">
    <div id="map"></div>

    <div id="panel">
      <h2>Pair</h2>
      <select id="pairSel"></select>

      <h2 style="margin-top:9px">Gates</h2>
      <div class="gates">
        <label class="f"><input type="checkbox" id="g.outside" checked> the fence gate is on</label>
        <label class="f">&nbsp;&nbsp;&#8627; whose fence counts
          <select id="t.fenceMode" style="width:auto">
            <option value="strict">either peer's, any fence</option>
            <option value="stationary">only a parked peer's</option>
          </select>
        </label>
        <label class="f"><input type="checkbox" id="g.fresh" checked> both fixes fresh</label>
        <label class="f"><input type="checkbox" id="g.closing" checked> range closing</label>
        <label class="f"><input type="checkbox" id="g.dcpa" checked> miss under the cap</label>
        <label class="f"><input type="checkbox" id="g.settled" checked> close enough to trust</label>
        <label class="f"><input type="checkbox" id="g.relative" checked> a real relative speed</label>
        <label class="f"><input type="checkbox" id="g.heading" checked> pointed at each other</label>
        <label class="f"><input type="checkbox" id="g.speed" checked> someone is moving</label>
        <label class="f"><input type="checkbox" id="g.notTogether" checked> not together already</label>
      </div>

      <details>
        <summary>thresholds (same set as the lab)</summary>
        <div class="grid">
          <label class="f">past <input type="number" id="t.tcaMaxMin" value="15"> min</label>
          <label class="f">miss <input type="number" id="t.dcpaMax" value="250"> m</label>
          <label class="f">closing <input type="number" id="t.closingMin" value="3"> km/h</label>
          <label class="f">within <input type="number" id="t.maxDeg" value="55">&deg;</label>
          <label class="f">together <input type="number" id="t.together" value="150"> m</label>
          <label class="f">stale <input type="number" id="t.freshS" value="180"> s</label>
          <label class="f">settled <input type="number" id="t.settledM" value="1200"> m</label>
          <label class="f">rel &gt; <input type="number" id="t.relMin" value="10"> km/h</label>
          <label class="f">moving &gt; <input type="number" id="t.movingKmh" value="15"> km/h</label>
          <label class="f">teleport <input type="number" id="t.teleport" value="250"> km/h</label>
        </div>
      </details>
    </div>

    <div id="pillwrap">
      <div id="pill"></div>
      <div id="why" style="display:none"></div>
    </div>
  </div>

  <footer>
    <div class="row">
      <button id="play">&#9654; play</button>
      <span class="num" id="clock">--:--:--</span>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1">
      <label class="f">speed
        <select id="speed" style="width:auto">
          <option value="1">1&times;</option>
          <option value="2">2&times;</option>
          <option value="5" selected>5&times;</option>
          <option value="10">10&times;</option>
        </select>
      </label>
      <span class="legend"><span class="swatch" style="background:#a7f3d0"></span>pill up
        <span class="swatch" style="background:#e5e7eb"></span>with them now
        <span class="swatch" style="background:#b91c1c"></span>true closest approach</span>
    </div>
    <div id="strip"></div>
    <div class="sub num" id="summary" style="margin-top:5px"></div>
  </footer>
</div>
<div id="missing" style="display:none"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // The basemap module is the app's, not a copy: /shared/basemaps.js is served
  // by the app's public directory, so this page has to be able to reach it.
  // `?basemaps=` overrides the location (a different dev port, say).
  (function () {
    const q = new URLSearchParams(location.search);
    const src = q.get("basemaps") || "http://127.0.0.1:8794/shared/basemaps.js";
    window.MEET_MAP_BASEMAP_SRC = src;
    const s = document.createElement("script");
    s.src = src;
    s.onerror = () => { window.MEET_MAP_BASEMAP_ERROR = src; };
    document.head.appendChild(s);
  })();
</script>
<!-- Both are cache-busted for the same reason tracks.js is in meet-lab.html:
     this server sends no no-cache headers, and a stale meet-maths.js presents
     as `thresholds is not a function` rather than as a cache problem. -->
<script>document.write('<script src="meet-maths.js?t=' + Date.now() + '"><\/script>');</script>
<script>document.write('<script src="tracks.js?t=' + Date.now() + '"><\/script>');</script>
<script>
"use strict";

const { evaluatePair, decide, pill } = window.MeetMaths;
const DATA = window.MEET_LAB_TRACKS;
const missing = (html) => {
  const el = document.getElementById("missing");
  el.style.display = "block";
  document.getElementById("shell").style.display = "none";
  el.innerHTML = html;
};

/** The basemap module is added with a <script> tag from another origin, and a
 *  dynamically inserted script may finish AFTER this parser-inserted block. So
 *  wait for it rather than reading a variable that is simply not there yet. */
function whenBasemaps(cb) {
  let n = 0;
  (function poll() {
    if (typeof HomeBasemaps !== "undefined") return cb(null);
    if (window.MEET_MAP_BASEMAP_ERROR) return cb(window.MEET_MAP_BASEMAP_ERROR);
    if (++n > 100) return cb(window.MEET_MAP_BASEMAP_SRC || "timed out");
    setTimeout(poll, 50);
  })();
}

if (!DATA) {
  missing("<strong>No tracks.js next to this page.</strong><p>Build it first:</p>" +
    "<pre>node scripts/one-off/2026-09-24-meet-eta-lab/build-data.mjs --demo --minutes 2</pre>");
} else if (typeof L === "undefined") {
  missing("<strong>Leaflet did not load.</strong><p>This page takes it from unpkg, the same way " +
    "<code>public/way/index.html</code> does. Offline, the schematic lab still works: " +
    "<a href=\"meet-lab.html\">meet-lab.html</a> draws the same geometry as SVG.</p>");
} else {
  whenBasemaps((err) => {
    if (!err) return run();
    // Deliberately fatal rather than falling back to a tile URL written here.
    // A hardcoded tile URL in a page is how this app ended up on OSM's donated
    // servers and got blocked (see /shared/basemaps.js); the module is the only
    // sanctioned source, so this page refuses to invent one.
    missing("<strong>Could not load the app's basemap module.</strong><p>Tried <code>" + err + "</code>.</p>" +
      "<p>Serve the repo's <code>public/</code> folder (a second port is fine — a script tag is not " +
      "cross-origin restricted) and reload:</p>" +
      "<pre>python -m http.server 8794 --bind 127.0.0.1 --directory public</pre>" +
      "<p>or point the page at wherever it is:</p>" +
      "<pre>meet-map.html?basemaps=http://127.0.0.1:8794/shared/basemaps.js</pre>");
  });
}

function run() {
  const gatesOn = () => ({
    outside: document.getElementById("g.outside").checked,
    fresh: document.getElementById("g.fresh").checked,
    closing: document.getElementById("g.closing").checked,
    dcpa: document.getElementById("g.dcpa").checked,
    settled: document.getElementById("g.settled").checked,
    relative: document.getElementById("g.relative").checked,
    heading: document.getElementById("g.heading").checked,
    speed: document.getElementById("g.speed").checked,
    notTogether: document.getElementById("g.notTogether").checked,
  });
  // Same reader and same mapping as the schematic lab's, from the same file: the
  // two views can differ in what they DRAW, not in what they judge.
  const cfg = () => MeetMaths.readThresholds("t.");
  const fmtT = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const M = (v) => (v === null || v === undefined ? "—" : Math.round(v));

  // ── the map, on the app's own basemap keys ──────────────────────────────
  const all = DATA.devices.flatMap((d) => d.pings);
  const center = [all.reduce((n, p) => n + p.lat, 0) / all.length, all.reduce((n, p) => n + p.lon, 0) / all.length];
  const map = L.map("map", { center, zoom: 15, zoomControl: true });
  let tileLayer = null;
  function setBase(key) {
    const base = HomeBasemaps[key] || HomeBasemaps[Object.keys(HomeBasemaps)[0]];
    if (tileLayer) map.removeLayer(tileLayer);
    // The module carries the attribution string, because an uncredited raster
    // is a policy problem, not a cosmetic one.
    tileLayer = L.tileLayer(base.url, { maxZoom: 19, maxNativeZoom: base.maxNativeZoom, attribution: base.attribution }).addTo(map);
  }
  setBase("lite");
  map.fitBounds(L.latLngBounds(all.map((p) => [p.lat, p.lon])), { padding: [30, 30] });

  // Fences at their REAL radius, which is the point of drawing them on a map:
  // in the schematic they are a dashed sketch, here they are the 80 m that made
  // the gate fire.
  const fenceLayers = (DATA.fences || []).map((f) => L.circle([f.lat, f.lon], {
    radius: f.radiusM, color: "#6b7280", weight: 1, dashArray: "3,3", fillColor: "#9ca3af", fillOpacity: .08,
  }).bindTooltip(`${f.display || f.name} — ${f.radiusM} m`).addTo(map));

  const COLOURS = ["#1d4ed8", "#b45309", "#047857", "#7c3aed", "#be123c"];
  const colourOf = (id) => COLOURS[DATA.devices.findIndex((d) => d.id === id) % COLOURS.length];

  // One marker per device, moved by the scrubber: a meet is a thing you watch
  // happen, and a pill that appears while both dots crawl along their lines is
  // the whole argument.
  const markers = {};
  DATA.devices.forEach((d) => {
    const c = colourOf(d.id);
    const icon = L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
      html: `<div style="width:22px;height:22px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);color:#fff;font:700 11px/18px ui-sans-serif,system-ui;text-align:center">${esc(d.id[0])}</div>` });
    markers[d.id] = L.marker([d.pings[0].lat, d.pings[0].lon], { icon }).addTo(map).bindTooltip(esc(d.id), { direction: "top" });
  });

  const pairSel = document.getElementById("pairSel");
  const pairs = [];
  for (let i = 0; i < DATA.devices.length; i++)
    for (let j = i + 1; j < DATA.devices.length; j++) pairs.push([DATA.devices[i], DATA.devices[j]]);
  pairSel.innerHTML = pairs.map(([a, b], i) => `<option value="${i}">${esc(a.id)} × ${esc(b.id)}</option>`).join("");
  // Default to the pair whose meet is the case the concept exists for, rather
  // than to whatever pair happens to be first in the file.
  const headOn = pairs.findIndex(([a, b]) => [a.id, b.id].sort().join() === ["MaxX", "Niri"].join());
  if (headOn >= 0) pairSel.value = String(headOn);    document.getElementById("src").innerHTML =
    `${esc(DATA.source)} · ${DATA.devices.length} devices · ${all.length} fixes · ${fmtT(all[0].t)} to ${fmtT(all[all.length - 1].t)}` +
    `<br>basemap: ${esc(Object.keys(HomeBasemaps).join(" / "))} — the app's own /shared/basemaps.js`;

  let trackLayers = [], rows = [], clock_t = [], pos = 0, playing = false, raf = null, last = 0;

  function currentPair() { return pairs[Number(pairSel.value) || 0] || pairs[0]; }

  function rebuild() {
    const C = cfg();
    const [A, B] = currentPair();
    rows = evaluatePair(A, B, C);
    rows.forEach((s) => { s.subject = A.id; });
    clock_t = rows.map((s) => s.t);

    trackLayers.forEach((l) => map.removeLayer(l));
    trackLayers = [A, B].map((d) => L.polyline(d.pings.map((p) => [p.lat, p.lon]),
      { color: colourOf(d.id), weight: 3, opacity: .75 }).addTo(map));

    const scrub = document.getElementById("scrub");
    scrub.max = String(Math.max(0, rows.length - 1));
    drawStrip();
    // Keep the moment you were looking at: flipping a gate mid-playback should
    // change the pill, not the clock.
    step(Math.min(pos, rows.length - 1));
  }

  /** The pill's up/down history for this pair, as a strip you can read at a
   *  glance — including the 15 s hole the `bothOutside` gate puts in the middle
   *  of a true meet, which is invisible if you are watching a dot move. */
  function drawStrip() {
    const gates = gatesOn(), strip = document.getElementById("strip");
    const t0 = clock_t[0], span = clock_t[clock_t.length - 1] - t0 || 1;
    const segs = [];
    let cur = null, i0 = 0;
    rows.forEach((s, i) => {
      const v = decide(s, gates);
      const kind = v === "meet" ? "meet" : (v === "together" ? "together" : null);
      if (kind === cur) return;
      if (cur) segs.push({ kind: cur, from: i0, to: i });
      cur = kind; i0 = i;
    });
    if (cur && i0 < rows.length) segs.push({ kind: cur, from: i0, to: rows.length - 1 });
    const closest = rows.reduce((best, s, i) => (s.checks && (!best || s.range < best.range) ? { i, ...s } : best), null);
    strip.innerHTML = segs.map((sg) => {
      const l = ((clock_t[sg.from] - t0) / span) * 100, r = ((clock_t[sg.to] - t0) / span) * 100;
      return `<div class="seg ${sg.kind}" style="left:${l.toFixed(2)}%;width:${Math.max(0.4, r - l).toFixed(2)}%"></div>`;
    }).join("") +
      (closest ? `<div class="tick" style="left:${(((closest.t - t0) / span) * 100).toFixed(2)}%" title="closest observed range"></div>` : "") +
      `<div class="play" id="playhead" style="left:0%"></div>`;

    // textContent, so the pill's HTML entities have to be decoded by hand.
    const decode = (s) => String(s).replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&mdash;/g, "—").replace(/&amp;/g, "&");
    const evs = window.MeetMaths.events(rows, gates);
    document.getElementById("summary").textContent = evs.length
      ? evs.map((e) => `pill up ${fmtT(e.first.t)} → ${fmtT(e.lastT)} (${e.steps.length} of ${rows.length} steps), first said "` +
          `${decode(pill(e.first, cfg()))}" at ${M(e.first.range)} m apart, missing by ${M(e.first.dcpa)} m`).join("   ·   ")
      : "no meeting under the current gates for this pair";
  }

  /** Advance to row index i and redraw everything that moves. */
  function step(i) {
    if (!rows.length) return;
    pos = Math.max(0, Math.min(rows.length - 1, i));
    const s = rows[Math.floor(pos)];
    const gates = gatesOn(), C = cfg();
    const [A, B] = currentPair();

    [A, B].forEach((d) => {
      // The marker shows the fix the row was judged with, so the dot and the
      // numbers can never be describing different moments.
      const p = d.pings.reduce((best, q) => (q.t <= s.t && (best === null || q.t > best.t) ? q : best), null) || d.pings[0];
      markers[d.id].setLatLng([p.lat, p.lon]);
    });

    const verdict = decide(s, gates);
    const el = document.getElementById("pill");
    if (verdict === "meet") {
      el.className = "on";
      el.innerHTML = pill(s, C);
    } else if (verdict === "together") {
      el.className = "on gone";
      el.innerHTML = pill(s, C);
    } else {
      el.className = "";
      el.innerHTML = "";
    }
    const why = document.getElementById("why");
    why.style.display = "inline-block";
    // A peer inside a fence is a fact; whether it silences the pill depends on
    // the rule AND on whether that peer is moving, so the line says which, per
    // peer. Getting this wrong the other way -- labelling a parked peer
    // "driving" -- is how a correct gate starts to look like a broken one.
    const inFence = [[A.id, s.outsideA, s.parkedInFenceA], [B.id, s.outsideB, s.parkedInFenceB]]
      .filter((row) => !row[1])
      .map((row) => row[2] === false ? `${row[0]} (driving, not silenced)` : `${row[0]} (parked — this is what silences it)`);
    why.textContent = s.checks
      ? `${M(s.range)} m apart · closing ${M(s.closing)} km/h · TCA ${M(s.tcaS)} s · miss ${M(s.dcpa)} m` +
        (inFence.length ? ` · in a fence: ${inFence.join(", ")}` : "") +
        (Object.keys(s.checks).filter((k) => !s.checks[k]).length ? ` · [${Object.keys(s.checks).filter((k) => !s.checks[k]).join(", ")}]` : "")
      : `unjudged: ${s.unusable}`;

    document.getElementById("clock").textContent = fmtT(s.t);
    document.getElementById("scrub").value = String(Math.floor(pos));
    const head = document.getElementById("playhead");
    if (head) head.style.left = `${((pos / Math.max(1, rows.length - 1)) * 100).toFixed(2)}%`;
  }

  // ── transport ───────────────────────────────────────────────────────────
  // Seconds of data per row, read from the rows themselves: the demo is 5 s,
  // real pings are not, and a hardcoded cadence would silently mis-time them.
  const stepSeconds = () => (rows.length > 1 ? (rows[1].t - rows[0].t) / 1000 : 5) || 5;
  function tick(now) {
    if (!playing) return;
    const dt = last ? (now - last) / 1000 : 0;
    last = now;
    const speed = Number(document.getElementById("speed").value);
    pos += (dt / stepSeconds()) * speed;
    if (pos >= rows.length - 1) pos = 0; // loop: the window is short on purpose
    step(pos);
    raf = requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on;
    document.getElementById("play").innerHTML = on ? "&#10074;&#10074; pause" : "&#9654; play";
    if (on) { last = 0; raf = requestAnimationFrame(tick); }
    else if (raf) cancelAnimationFrame(raf);
  }
  document.getElementById("play").onclick = () => setPlaying(!playing);
  document.getElementById("speed").onchange = () => { last = 0; };
  document.getElementById("scrub").oninput = (e) => { setPlaying(false); step(Number(e.target.value)); };
  document.getElementById("strip").onclick = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const frac = (e.clientX - r.left) / r.width;
    setPlaying(false);
    step(Math.round(frac * (rows.length - 1)));
  };
  pairSel.onchange = () => { pos = 0; rebuild(); };
  // A threshold or gate change re-evaluates the geometry, which is cached per
  // pair only for the duration of the call: on a 120 s dataset that is cheap,
  // and on a real one the schematic lab is the tool to reach for.
  document.getElementById("panel").addEventListener("change", () => { rebuild(); });

  rebuild();
  setPlaying(true);
}
</script>
</body>
</html>
