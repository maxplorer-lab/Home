function clearDeviceTrack(deviceId) {
    if (!map) return;
    (trackLayersByDevice[deviceId] || []).forEach(function(l) { map.removeLayer(l); });
    trackLayersByDevice[deviceId] = [];
}
function clearTracks() { Object.keys(trackLayersByDevice).forEach(clearDeviceTrack); }

function clearStationaryDots(deviceId) {
    if (!map) return;
    (stationaryDotLayersByDevice[deviceId] || []).forEach(function(d) { map.removeLayer(d.layer); });
    stationaryDotLayersByDevice[deviceId] = [];
}
function clearAllStationaryDots() { Object.keys(stationaryDotLayersByDevice).forEach(clearStationaryDots); }

function maybeAddStationaryDot(devId, ping) {
    if (!map || !ping.is_stationary || ping.is_inside_geofence) return;
    if (!stationaryDotLayersByDevice[devId]) stationaryDotLayersByDevice[devId] = [];
    const dots = stationaryDotLayersByDevice[devId];
    const tooClose = dots.some(function(d) { return distanceMeters(d.lat, d.lng, ping.latitude, ping.longitude) <= CONFIG.STATIONARY_DOT_CLUSTER_RADIUS_M; });
    if (tooClose) return;
    const marker = L.circleMarker([ping.latitude, ping.longitude], {
        radius: CONFIG.STATIONARY_DOT_RADIUS_PX, color: CONFIG.STATIONARY_DOT_COLOR, fillColor: CONFIG.STATIONARY_DOT_COLOR,
        fillOpacity: CONFIG.STATIONARY_DOT_OPACITY, opacity: CONFIG.STATIONARY_DOT_OPACITY, weight: 1, interactive: false
    }).addTo(map);
    dots.push({ layer: marker, lat: ping.latitude, lng: ping.longitude });
}

// ── The trail engine (append-only) ───────────────────────────────
// The old path re-drew EVERY track from scratch on every ping: clear all
// polylines, rebuild them from the whole point list, destroy and re-add every
// marker. That is what made the motion judder -- each arrival threw the
// geometry away and the camera could only snap. The same drawing now happens
// incrementally, driven by the playback cursor: a segment, once committed, is
// never touched again, and the piece between the last committed point and the
// cursor is a live "tail" that grows with it. The RULES are untouched -- same
// TRACK_GAP_SECONDS break, same mode-change break, same walking dash, same
// speed ramp, same colours -- only WHEN they reach the screen changed.

function walkingLineStyle(color) {
    // Verbatim the options the old flushWalking() used.
    return { color: color, weight: CONFIG.TRACK_WEIGHT_WALKING, opacity: CONFIG.TRACK_OPACITY_WALKING, smoothFactor: 1.5, dashArray: CONFIG.WALK_TRACK_DASH_ARRAY };
}
function drivingLineStyle(kmh) {
    // Verbatim the options the old driving-pair push used.
    return { color: speedColor(kmh), weight: CONFIG.TRACK_WEIGHT_DRIVING, opacity: CONFIG.TRACK_OPACITY_DRIVING, smoothFactor: 1.5 };
}

function trailFor(devId) {
    if (!trailState[devId]) {
        trailState[devId] = { drawnIdx: 0, runDriving: null, walkPts: null, walkLayer: null, tail: null, tailColor: null, tailAt: null, lastTs: null, lastPoint: null };
    }
    return trailState[devId];
}

function addTrackLayer(devId, layer) {
    if (!trackLayersByDevice[devId]) trackLayersByDevice[devId] = [];
    layer.__devId = devId;
    trackLayersByDevice[devId].push(layer);
    return layer.addTo(map);
}

function dropTrackLayer(layer) {
    if (!layer) return;
    map.removeLayer(layer);
    const list = trackLayersByDevice[layer.__devId];
    if (list) { const i = list.indexOf(layer); if (i !== -1) list.splice(i, 1); }
}

function hideTail(st) {
    if (!st.tail) return;
    dropTrackLayer(st.tail);
    st.tail = null; st.tailColor = null; st.tailAt = null;
}

/** Has the cursor moved far enough to be worth redrawing the tail? A walking
 * run grows its polyline for the whole walk, and at 60fps that is a path of
 * every point in the run rebuilt 60 times a second for motion nobody can see. */
function tailNeedsDraw(st, lat, lng) {
    if (!st.tailAt) return true;
    if (distanceMeters(st.tailAt.lat, st.tailAt.lng, lat, lng) < CONFIG.MARKER_TAIL_MIN_METERS) return false;
    return true;
}
function tailDrawn(st, lat, lng) { st.tailAt = { lat: lat, lng: lng }; }

/** Commit every point the playback cursor has reached. This mirrors the old
 * drawSegments() loop decision for decision, but resumable: an already-drawn
 * segment is never revisited, so nothing flickers and nothing is redrawn. */
function commitTrail(devId, pts, cursorIdx, fallbackColor) {
    const st = trailFor(devId);
    while (st.drawnIdx <= cursorIdx && st.drawnIdx < pts.length) {
        const p = pts[st.drawnIdx];
        const ts = new Date(p.timestamp).getTime();
        const isDriving = !!p.is_driving;
        const pt = [p.latitude, p.longitude];

        if (st.runDriving === null) {
            st.runDriving = isDriving;
            st.lastTs = ts; st.lastPoint = pt;
            if (!isDriving) { st.walkPts = [pt]; st.walkLayer = addTrackLayer(devId, L.polyline(st.walkPts, walkingLineStyle(fallbackColor))); }
            st.drawnIdx++;
            continue;
        }

        const gapSec = (ts - st.lastTs) / 1000;
        if (gapSec > CONFIG.TRACK_GAP_SECONDS || isDriving !== st.runDriving) {
            // The open run ends here. A walking run keeps this point -- the old
            // code pushed it before flushing, closing the dashed line up to the
            // boundary -- while a driving run stops at the previous point.
            if (!st.runDriving && st.walkLayer) {
                st.walkPts.push(pt);
                st.walkLayer.setLatLngs(st.walkPts);
                st.walkLayer = null; st.walkPts = null;
            }
            hideTail(st);
            st.runDriving = isDriving;
            st.lastTs = ts; st.lastPoint = pt;
            if (!isDriving) { st.walkPts = [pt]; st.walkLayer = addTrackLayer(devId, L.polyline(st.walkPts, walkingLineStyle(fallbackColor))); }
            st.drawnIdx++;
            continue;
        }

        if (isDriving) {
            const kmh = (p.speed !== null && p.speed !== undefined) ? p.speed : 0;
            addTrackLayer(devId, L.polyline([st.lastPoint, pt], drivingLineStyle(kmh)));
        } else if (st.walkLayer) {
            st.walkPts.push(pt);
            st.walkLayer.setLatLngs(st.walkPts);
        }
        st.lastTs = ts; st.lastPoint = pt;
        st.drawnIdx++;
    }
}

/** The piece of trail between the last committed point and the cursor. It grows
 * as the cursor moves, so nothing has to be thrown away when the pair it is
 * drawing completes and gets committed. */
function drawTail(devId, pos) {
    const st = trailFor(devId);
    if (st.runDriving === null || !pos.next || !pos.prev) { hideTail(st); return; }
    const cursorPt = [pos.lat, pos.lng];

    if (!st.runDriving && st.walkLayer) {
        // A walking run only used to be flushed when it ENDED, so drawing it
        // live to the cursor is what it always looked like -- just smooth now.
        hideTail(st);
        if (tailNeedsDraw(st, pos.lat, pos.lng)) {
            st.walkLayer.setLatLngs(st.walkPts.concat([cursorPt]));
            tailDrawn(st, pos.lat, pos.lng);
        }
        return;
    }

    // A driving pair is drawn only when the old loop would have drawn it: not
    // across a TRACK_GAP_SECONDS break, and not across a mode change.
    const gapSec = (new Date(pos.next.timestamp).getTime() - new Date(pos.prev.timestamp).getTime()) / 1000;
    if (!st.runDriving || gapSec > CONFIG.TRACK_GAP_SECONDS || !pos.next.is_driving) { hideTail(st); return; }
    // A driving pair is two points, so it is redrawn whenever the cursor moves:
    // the tail has to meet the committed pair, and this one cannot cut a corner
    // the way a growing walk line can.

    const kmh = (pos.next.speed !== null && pos.next.speed !== undefined) ? pos.next.speed : 0;
    const style = drivingLineStyle(kmh);
    const ptPair = [[pos.prev.latitude, pos.prev.longitude], cursorPt];
    if (!st.tail) {
        st.tail = addTrackLayer(devId, L.polyline(ptPair, style));
        st.tailColor = style.color;
    } else {
        if (st.tailColor !== style.color) { st.tail.setStyle(style); st.tailColor = style.color; }
        st.tail.setLatLngs(ptPair);
    }
    tailDrawn(st, pos.lat, pos.lng);
}

// ── The playback cursor (visual clock) ───────────────────────────

/** How far behind real time the cursor draws. This one number is the whole
 * difference between the two paces: PLAYBACK_LAG_SECONDS for the fluid default,
 * 0 for "the newest ping, as soon as it lands" (setMapPace). */
function playbackLagSeconds() { return mapPace === 'live' ? 0 : CONFIG.PLAYBACK_LAG_SECONDS; }

function playbackClock() { return Date.now() - playbackLagSeconds() * 1000; }

/** Where the marker belongs on the delayed clock, and which pair it is
 * crossing.
 *
 * The interpolation itself lives in HomePlayback (shared with the public live
 * share, which draws the SAME fluid cursor), including the two rules it would
 * be easy to get subtly different here: never pass a point that has not
 * arrived yet (the exit guard holds pings back and delivers them later as
 * `track` messages, so the cursor waits), and never crawl across a trail break.
 * This page's own part is only the clock, because THIS page has a pace switch
 * and the share does not. */
function playbackPosition(pts) {
    return HomePlayback.cursorPosition(pts, playbackClock());
}

// ── Markers and tips (moved, never rebuilt) ──────────────────────

function tipClass(ping) {
    if (!ping || ping.is_inside_geofence) return null;
    if (ping.is_driving) return 'tip-red';
    if (ping.is_stationary) return 'tip-green';
    return 'tip-yellow';
}

/** Build (or rebuild) a device's marker -- its emoji comes from Settings, so
 * this is the one thing that legitimately has to be recreated. Its position is
 * the playback loop's, so recreating it does not interrupt the motion. */
function buildMarker(devId) {
    if (!map) return null;
    const emoji = EMOJI_MAP[devId] || CONFIG.DEFAULT_DEVICE_EMOJI;
    const icon = L.divIcon({
        // iconAnchor already puts the icon's BOTTOM at the point; the extra
        // translate(-50%,-100%) used to shift it a second time, which drew the
        // pin ~30px above where it actually was -- obvious now that the marker
        // glides along its own trail instead of jumping to it.
        html: '<div style="font-size:28px; text-shadow:0 0 12px rgba(0,0,0,0.9); line-height:1;">' + emoji + '</div>',
        iconSize: [30, 30], iconAnchor: [15, 30], className: ''
    });
    const at = markerPositions[devId] || { lat: CONFIG.MAP_DEFAULT_CENTER[0], lng: CONFIG.MAP_DEFAULT_CENTER[1] };
    if (markerLayers[devId]) map.removeLayer(markerLayers[devId]);
    const marker = L.marker([at.lat, at.lng], { icon: icon }).addTo(map);
    marker.bindTooltip(devId, { permanent: false, direction: 'top' });
    marker.on('click', function() { followDevice(devId); });
    markerLayers[devId] = marker;
    return marker;
}

function placeTip(devId, lat, lng, cls) {
    if (!map) return;
    if (tipClassByDevice[devId] === cls && tipLayers[devId]) { tipLayers[devId].setLatLng([lat, lng]); return; }
    if (tipLayers[devId]) { map.removeLayer(tipLayers[devId]); delete tipLayers[devId]; }
    tipClassByDevice[devId] = cls;
    if (!cls) return;
    const tipIcon = L.divIcon({ html: '<div class="tip-dot ' + cls + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7], className: '' });
    tipLayers[devId] = L.marker([lat, lng], { icon: tipIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);
}

/** Frame-rate independent exponential ease: a slow phone lands in the same
 * place at the same time as a fast one. The rate is the pace's: on the live
 * clock the marker is chasing a position nobody has delayed for it. */
function easeNumber(cur, target, dtSec) {
    if (cur === null || cur === undefined) return target;
    const rate = mapPace === 'live' ? CONFIG.MARKER_EASE_PER_SECOND_LIVE : CONFIG.MARKER_EASE_PER_SECOND;
    const k = HomePlayback.easeFactor(rate, dtSec);
    return cur + (target - cur) * k;
}

// ── The playback loop ────────────────────────────────────────────
// One animation frame owns everything that moves continuously. Ping handling
// keeps doing exactly what it did -- classify, store, notify, and feed the HUD
// from the newest ping -- and the loop only decides when that already-decided
// state reaches the screen.

function renderDeviceFrame(devId, dtSec) {
    const pts = devicePings[devId] || [];
    const live = latestPing[devId];
    let targetLat = null, targetLng = null, ping = null, inPlayback = false;

    if (pts.length) {
        const pos = playbackPosition(pts);
        // The eye hides a TRACK, never a device: the marker keeps moving either
        // way, which is how it behaved before the trails became incremental.
        if (trackVisible[devId] !== false) {
            commitTrail(devId, pts, pos.idx, DEVICE_COLORS[devId] || CONFIG.DEFAULT_DEVICE_COLOR);
            drawTail(devId, pos);
        }
        // Case A -- still inside recorded movement: the cursor is the truth, and
        // it is already smooth, so the marker sits on it exactly.
        // Case B -- the newest drawable point is behind the cursor and the live
        // ping says the device is parked or fenced (its moves are metres, and no
        // point is drawn for them): the live position is the truth there, eased
        // from where the marker already is, so those wiggles glide.
        inPlayback = new Date(pts[pts.length - 1].timestamp).getTime() > playbackClock();
        if (inPlayback || !live) { targetLat = pos.lat; targetLng = pos.lng; ping = pos.ping; }
        else { targetLat = live.latitude; targetLng = live.longitude; ping = live; }
    } else if (live) {
        // Nothing drawable (parked inside a fence, say) -- the live position is
        // all there is, and it is what this device's marker has always shown.
        targetLat = live.latitude; targetLng = live.longitude; ping = live;
    } else {
        return;
    }

    const cur = markerPositions[devId];
    if (inPlayback || !cur) markerPositions[devId] = { lat: targetLat, lng: targetLng };
    else markerPositions[devId] = { lat: easeNumber(cur.lat, targetLat, dtSec), lng: easeNumber(cur.lng, targetLng, dtSec) };

    const placed = markerPositions[devId];
    const marker = markerLayers[devId] || buildMarker(devId);
    if (marker) marker.setLatLng([placed.lat, placed.lng]);
    placeTip(devId, placed.lat, placed.lng, tipClass(ping));
}

/** The pace's one line, and the only place it is said: Settings -> Map, under
 * the pills. Smooth draws from a cursor 25s behind live, and someone who
 * forgets that reads the lag as a fault -- so while Smooth is on, the line is
 * there to name it. On Live it is REMOVED rather than re-worded: a live map is
 * not behind anything, and "~0s behind" would read as a bug. It used to be a
 * HUD badge; the HUD is the device's readout, and it was overcrowded. */
function updatePaceNote() {
    const el = document.getElementById('pace-note');
    if (!el) return;
    el.style.display = mapPace === 'live' ? 'none' : 'block';
}

// ── Live share: the ONE public door, reached from the map itself ────────────
// The console at /admin owns the household-wide card (every open code, what
// ended, revoke-all). This block is the same grant asked from the device you
// are looking at, because that is where "can I show someone this trip?"
// actually comes up. Both doors decide WHO may mint from one place
// (src/way/routes/dashboard-api.ts, shareMinter), so the answer cannot differ.
let shareState = null;   // { device, canShare, open: [], lastPin: null }
let shareBusy = false;

/** The device the block acts on: the SELECTED one, so switching the map
 *  switches the offer rather than sharing whichever device is first. */
function shareDevice() {
    return selectedDevice || (DEVICES.length === 1 ? DEVICES[0] : null);
}

function renderShareBlock() {
    const dev = shareDevice();
    if (!dev) return '<div class="settings-hint">Pick a device on the map first \u2014 a code shares exactly one.</div>';
    // A stale answer for a DIFFERENT device would offer the wrong person: show
    // \"checking\" until the reply for this device is in hand.
    if (!shareState || shareState.device !== dev) return '<div class="settings-hint">Checking\u2026</div>';
    if (!shareState.canShare) return '<div class="settings-hint">Only an admin can hand out a code.</div>';

    let html = '';
    if (shareState.lastPin) {
        // The ONE place the code is ever readable: the database keeps only its
        // hash, so this box is not a \"show it again\", it is the only time it
        // is shown. The link carries it in the fragment, so it never reaches a
        // request line or an access log.
        const link = location.origin + '/live#' + shareState.lastPin.pin;
        html += '<div class="settings-card" style="gap:6px;">' +
            '<div style="font-size:10px;color:#9ca3af;">For whoever is watching <b>' + escapeHtml(dev) + '</b> \u2014 shown once:</div>' +
            '<div class="share-pin">' + escapeHtml(shareState.lastPin.pin) + '</div>' +
            '<div style="font-size:10px;color:#6b7280;word-break:break-all;">' + escapeHtml(link) + '</div>' +
            '<button class="export-btn" onclick="copyShareLink()">Copy link</button>' +
            '<div id="share-msg" style="font-size:10px;color:#9ca3af;"></div>' +
        '</div>';
    }
    const open = shareState.open || [];
    if (open.length) {
        const o = open[0];
        html += '<div class="settings-row"><span>' + escapeHtml(dev) + ' is shared' +
            (o.last_used_at ? ' \u00b7 last watched ' + escapeHtml(formatTime(o.last_used_at)) : ' \u00b7 not opened yet') +
            '</span></div>' +
            '<div class="settings-hint">Ends ' + escapeHtml(String(o.expires_at).replace('T', ' ').slice(0, 16)) +
            ' UTC (' + escapeHtml(o.expiresIn) + '), code made by ' + escapeHtml(o.created_by) + '.</div>' +
            '<button class="export-btn" onclick="stopSharing()">Stop sharing</button>' +
            (open.length > 1 ? '<div class="settings-hint">' + open.length + ' codes are open for this device; this stops all of them.</div>' : '');
    } else {
        html += '<div class="settings-row"><span>' + escapeHtml(dev) + ' \u00b7 not shared</span>' +
            '<button class="export-btn" id="share-mint" onclick="mintShare()">Generate a code</button></div>' +
            '<div id="share-msg" style="font-size:10px;color:#9ca3af;"></div>';
    }
    return html;
}

function updateShareBlock() {
    const el = document.getElementById('share-block');
    if (el) el.innerHTML = renderShareBlock();
}

async function loadShareState() {
    const dev = shareDevice();
    if (!dev) { shareState = null; updateShareBlock(); return; }
    const r = await apiJson('GET', '/way/api/share?device=' + encodeURIComponent(dev));
    // Keep the just-minted code on screen across this refresh for the SAME
    // device; a refresh must not eat the one moment it is readable.
    const keepPin = shareState && shareState.device === dev ? shareState.lastPin : null;
    shareState = r.ok
        ? Object.assign({ lastPin: keepPin }, r.data)
        : { device: dev, canShare: false, open: [], lastPin: keepPin };
    updateShareBlock();
}

async function mintShare() {
    if (shareBusy) return;
    const dev = shareDevice();
    if (!dev) return;
    shareBusy = true;
    setMsg('share-msg', 'Generating\u2026');
    const r = await apiJson('POST', '/way/api/share', { device: dev, label: dev });
    shareBusy = false;
    if (!r.ok) {
        updateShareBlock();
        setMsg('share-msg', (r.data && r.data.message) ? r.data.message : 'Could not generate a code.');
        return;
    }
    shareState = { device: dev, canShare: true, open: [], lastPin: {
        pin: r.data.pin, expiresAt: r.data.expiresAt, expiresIn: r.data.expiresIn,
    } };
    updateShareBlock();
    loadShareState();   // picks up the open grant that was just created
}

async function stopSharing() {
    if (shareBusy) return;
    const dev = shareDevice();
    if (!dev) return;
    shareBusy = true;
    setMsg('share-msg', 'Stopping\u2026');
    const r = await apiJson('POST', '/way/api/share/revoke', { device: dev });
    shareBusy = false;
    if (shareState) shareState.lastPin = null;   // a stopped code is not a copyable link
    await loadShareState();
    setMsg('share-msg', r.ok ? 'Stopped.' : 'Could not stop that code.');
}

function copyShareLink() {
    if (!shareState || !shareState.lastPin) return;
    const link = location.origin + '/live#' + shareState.lastPin.pin;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(
            function () { setMsg('share-msg', 'Link copied.'); },
            // Clipboard refused (not a secure context, permission denied): the
            // link is on screen above, which is the honest fallback.
            function () { setMsg('share-msg', 'Copy the link shown above.'); }
        );
    } else {
        setMsg('share-msg', 'Copy the link shown above.');
    }
}

// ── The map pace (VISUAL ONLY) ───────────────────────────────────
// Smooth is the default and the reason the motion reads as motion: 25s of
// buffer means a ping is always already in hand, so the marker is interpolated
// rather than snapped. That same 25s is wrong the moment the question changes
// from "how did the trip look" to "where is he right now", so the pace is a
// switch the user flips (Settings -> Map) -- and flipping it changes ONLY when
// already-decided state reaches the screen. It is not a setting on the server,
// nothing is re-fetched, and no ping is handled any differently. Deliberately
// NOT a control floating over the map, and no longer mentioned in the HUD:
// the map's chrome is about the device, and the pace says its one line in the
// settings row that owns it (see updatePaceNote).

function setMapPace(pace) {
    const next = (pace === 'live') ? 'live' : 'smooth';
    // Tapping the pill that is already active must not rebuild every trail:
    // redrawAllTracks() empties and redraws the same geometry, which reads as a
    // one-frame flicker of every track on screen.
    if (next === mapPace) return;
    mapPace = next;
    localStorage.setItem('map_pace', mapPace);
    applyMapPace();
}

/** Paint every pace control (the Settings -> Map pills), then let the trails be
 * redrawn from scratch: the cursor just moved 25 seconds, so what is already drawn is either too much
 * (switching to smooth) or too little (switching to live). resetTrail is the
 * one correct answer for both -- the same path a fresh snapshot takes -- and
 * the next frame draws exactly what the new clock has reached. */
function applyMapPace() {
    document.querySelectorAll('.pace-pill').forEach(function(p) {
        p.classList.toggle('active', p.getAttribute('data-pace') === mapPace);
    });
    redrawAllTracks();
    updatePaceNote();
}

function renderPlaybackFrame(dtSec) {
    if (!map) return;
    for (const devId of DEVICES) renderDeviceFrame(devId, dtSec);
    updateFollowCamera();
}

function playbackTick(ts) {
    if (!playbackRunning) return;
    const now = (typeof ts === 'number') ? ts : performance.now();
    const dtSec = playbackLastFrame ? Math.min((now - playbackLastFrame) / 1000, 0.5) : 0;
    playbackLastFrame = now;
    renderPlaybackFrame(dtSec);
    requestAnimationFrame(playbackTick);
}

function startPlaybackLoop() {
    if (playbackRunning) return;
    playbackRunning = true;
    playbackLastFrame = 0;
    requestAnimationFrame(playbackTick);
}

// ── The follow camera (the roaming circle + the sweep) ───────────

/** The radius of the circle the device may roam before the camera reacts:
 * FOLLOW_ZONE_DIAMETER_FRACTION of the SHORTER side of the map, so the circle
 * always fits inside it. On a portrait phone the shorter side is the width, so
 * this is exactly a diameter of 70% of the screen width; on a wide desktop map
 * it is the height, which is the side that would otherwise push the device off
 * the screen. */
/**
 * The camera, as a cycle rather than a chase. It never TRAILS the device:
 *
 *   DRIFT  the map is still. The device walks away from the middle of the
 *          screen, in any direction, until it leaves the roaming circle.
 *   PUSH   it keeps going for one push beat while the map still holds, so the
 *          edge registers as something it shoves through instead of a place it
 *          gets pinned to.
 *   PULL   the camera carries it from the edge it crossed to the OPPOSITE edge
 *          of the circle, overshooting its landing by a few percent.
 *
 * The cycle itself -- the phases, the circle it roams, WHERE a sweep lands
 * (opposite the crossing, a hair inside, never the mirrored exit offset), how
 * LONG it takes (a ratio off the drift just watched, not a fixed number of
 * seconds, floored for a device that was PLACED out there rather than drifting)
 * and the per-frame `panBy` that drives it -- lives in HomePlayback, SHARED
 * with the public live share, whose camera must behave identically. This page
 * keeps only what is its own: the follow-zoom preference and the flight that
 * enforces it, which the share has no equivalent of.
 */
function updateFollowCamera() {
    if (!map) return;
    if (!followDeviceId) return;
    const pos = markerPositions[followDeviceId];
    if (!pos) return;

    const nowMs = Date.now();
    if (map.getZoom() < userPrefs.followZoom && nowMs - followCam.lastZoomFix > CONFIG.FOLLOW_ZOOM_FIX_INTERVAL_MS) {
        followCam.lastZoomFix = nowMs;
        followDriver.holdUntil(nowMs + CONFIG.FOLLOW_FLY_DURATION * 1000);
        followDriver.notifyPlaced(nowMs);   // the flight re-centres on its own
        ignoreMapEvents();
        map.flyTo([pos.lat, pos.lng], userPrefs.followZoom, { duration: CONFIG.FOLLOW_FLY_DURATION });
        return;
    }
    if (followDriver.isHeld(nowMs)) return;

    followDriver.update(nowMs, pos);
}


/** Rebuild every device's drawn trail from its first point. This is the old
 * redrawAllTracks() behaviour -- and it used to run on EVERY ping, which is
 * precisely why the map could only ever jump. Now it is the rare path: a fresh
 * snapshot, the track eye switched back on, or a late `track` point that slots
 * in BEFORE the cursor, where a commit index stops meaning anything. The next
 * frame draws the identical geometry, plus whatever arrived. */
function resetTrail(devId) {
    clearDeviceTrack(devId);
    const st = trailFor(devId);
    st.drawnIdx = 0; st.runDriving = null; st.walkPts = null; st.walkLayer = null;
    st.tail = null; st.tailColor = null; st.tailAt = null; st.lastTs = null; st.lastPoint = null;
    delete markerPositions[devId];
}

function redrawAllTracks() {
    if (!map) return;
    for (const devId of DEVICES) resetTrail(devId);
    startPlaybackLoop();   // "redraw" now means "let the next frame draw it"
}

/** (Re)build a device's marker + tip dot. Placement itself belongs to the
 * playback loop, so this only has to run when the ICON changes (a profile save)
 * or when a device needs a marker for the first time. */
function updateMarker(devId, ping) {
    if (!map) return;
    if (!markerPositions[devId] && ping) markerPositions[devId] = { lat: ping.latitude, lng: ping.longitude };
    if (!buildMarker(devId)) return;
    const placed = markerPositions[devId];
    placeTip(devId, placed.lat, placed.lng, tipClass(ping || latestPing[devId]));
}

function updateTip(devId, ping) {
    const placed = markerPositions[devId];
    if (!map || !placed) return;
    placeTip(devId, placed.lat, placed.lng, tipClass(ping));
}

function selectSpeedoDevice(devId) {
    selectedDevice = devId;
    updateSpeedoHUD();
}

function followDevice(devId) {
    selectSpeedoDevice(devId);
    followDeviceId = devId;
    localStorage.setItem('follow_device', devId);
    renderBadges();
    // Fly to where the marker is DRAWN, not to the newest ping: the map is on
    // the playback clock, so centring on the live position would leave the
    // marker half a screen behind and make the camera chase it straight away.
    const drawn = markerPositions[devId];
    const p = latestPing[devId];
    const target = drawn || (p ? { lat: p.latitude, lng: p.longitude } : null);
    startPlaybackLoop();
    if (target && map) {
        // Following STARTS on the centre of the screen: that is the position
        // the cycle assumes at its start, and it is where you want the device
        // when you ask to follow it. The circle is measured from the middle of
        // the screen every time, so centring the view IS the target; the flight
        // just has to finish before the cycle may touch the camera.
        followDriver.holdUntil(Date.now() + CONFIG.FOLLOW_FLY_DURATION * 1000);
        followDriver.notifyPlaced(Date.now());   // the first drift is timed from here
        ignoreMapEvents();
        map.flyTo([target.lat, target.lng], userPrefs.followZoom, { duration: CONFIG.FOLLOW_FLY_DURATION });
    }
    renderBadges();
}

function updateSpeedoHUD() {
    const p = selectedDevice ? latestPing[selectedDevice] : null;
    const core = document.getElementById('hud-core');
    const meta = document.getElementById('hud-meta');
    const cad = document.getElementById('hud-cadence');
    const fresh = document.getElementById('hud-freshness');
    const isFollowingSelected = followDeviceId === selectedDevice && !!selectedDevice;
    const followStatusEl = document.getElementById('hud-follow-status');
    followStatusEl.style.display = isFollowingSelected ? 'inline-block' : 'none';
    if (isFollowingSelected) {
        followStatusEl.textContent = (EMOJI_MAP[followDeviceId] || CONFIG.DEFAULT_DEVICE_EMOJI) + ' Following';
    }

    const distEl = document.getElementById('hud-today-dist');
    if (selectedDevice) {
        const km = todayDist[selectedDevice] || 0;
        distEl.textContent = km.toFixed(1) + ' km today';
    } else {
        distEl.textContent = '-- km today';
    }

    if (!p) {
        core.innerHTML = '<div class="spd-num mono" style="color:#9ca3af; font-size:26px;">--</div><div class="spd-unit">Waiting</div>';
        fresh.className = 'badge-idle'; fresh.textContent = 'Waiting...';
        meta.textContent = '--';
        meta.title = '';
        cad.textContent = '-- ago';
        return;
    }

    // Health slot: battery when the tracker reports it, otherwise GPS accuracy
    // (see accuracyLabel). "n/a" was neither - it was a permanent reminder that
    // the field is empty, in a slot that could be saying something true.
    const acc = accuracyLabel(p.accuracy);
    if (p.battery !== null && p.battery !== undefined) {
        meta.textContent = p.battery + '%';
        meta.title = 'Battery';
    } else if (acc) {
        meta.textContent = acc;
        meta.title = 'GPS accuracy — µlogger does not report battery';
    } else {
        meta.textContent = '—';
        meta.title = 'No battery or accuracy reported';
    }

    // Clock skew: a phone a second ahead of the viewer yields a NEGATIVE age,
    // which printed as "-1s ago". Clamp, and call the first second "now".
    const diffSec = Math.max(0, (Date.now() - new Date(p.timestamp).getTime()) / 1000);
    if (diffSec < 120) { fresh.className = 'badge-live'; fresh.textContent = 'Live'; }
    else {
        const mins = Math.floor(diffSec / 60);
        fresh.className = 'badge-idle';
        fresh.textContent = mins > 60 ? (Math.floor(mins/60) + 'h ago') : (mins + 'm ago');
    }
    cad.textContent = diffSec < 60 ? (diffSec < 1 ? 'now' : Math.round(diffSec) + 's ago') : (Math.round(diffSec/60) + 'm ago');

    if (p.is_inside_geofence || p.is_stationary) {
        core.innerHTML = '<div class="spd-emoji">@</div><div class="spd-unit">' + (p.is_inside_geofence ? getDisplayName(p.geofence_name) : 'Stationary') + '</div>';
        return;
    }

    const spd = (p.speed === null || p.speed === undefined || p.speed < 0) ? null : Math.round(p.speed);
    if (spd === null) {
        core.innerHTML = '<div class="spd-num mono" style="color:#9ca3af; font-size:29px;">--</div><div class="spd-unit">No signal</div>';
    } else {
        const colorClass = speedColor(spd);
        core.innerHTML = '<div class="spd-num mono" style="color:' + colorClass + ';">' + spd + '</div><div class="spd-unit">km/h</div>';
    }
}

function updateTogetherAndETA() {
    const ids = Object.keys(latestPing);
    let together = false;
    for (let i = 0; i < ids.length && !together; i++) {
        for (let j = i + 1; j < ids.length; j++) {
            const a = latestPing[ids[i]], b = latestPing[ids[j]];
            if (a && b && distanceMeters(a.latitude, a.longitude, b.latitude, b.longitude) <= CONFIG.TOGETHER_DISTANCE_M) {
                together = true; break;
            }
        }
    }
    document.getElementById('peer-pill').style.display = together ? 'flex' : 'none';

    const etaEl = document.getElementById('eta-pill');
    const p = selectedDevice ? latestPing[selectedDevice] : null;
    const pts = selectedDevice ? (devicePings[selectedDevice] || []) : [];
    if (!p || p.is_inside_geofence || !p.is_driving || (p.speed || 0) < CONFIG.ETA_MIN_SPEED_KMH || pts.length < 2 || GEOFENCES.length === 0) {
        etaEl.style.display = 'none';
        return;
    }
    const prev = pts[pts.length - 2], cur = pts[pts.length - 1];
    const heading = bearingDegrees(prev.latitude, prev.longitude, cur.latitude, cur.longitude);

    let best = null, bestDist = Infinity;
    for (const f of GEOFENCES) {
        const brg = bearingDegrees(cur.latitude, cur.longitude, f.lat, f.lng);
        if (angularDiff(heading, brg) > CONFIG.ETA_MAX_BEARING_DIFF_DEG) continue;
        const d = distanceMeters(cur.latitude, cur.longitude, f.lat, f.lng);
        if (d < bestDist) { bestDist = d; best = f; }
    }
    if (!best) { etaEl.style.display = 'none'; return; }

    const speedMs = (p.speed || 0) / 3.6;
    const etaMin = speedMs > 0 ? Math.max(1, Math.round((bestDist / speedMs) / 60)) : null;
    etaEl.innerHTML = '<span>Heading toward</span><span class="eta-dest">' + getDisplayName(best.name) + ' - ~' + (etaMin !== null ? etaMin : '--') + 'm</span>';
    etaEl.style.display = 'flex';
}

// ── The approach pulse (VISUAL ONLY) ────────────────────────────
// The DO arms it from the very code path that sends the "60s / 30s from
// <place>" push, so the badge can never claim an approach the notification
// missed (or stay dark for one it sent). Everything about the SHAPE of it is
// decided here: yellow at the 60s threshold, red at 30s, gone when the window
// closes.

/** One server pulse -> this client's copy of it. `ageMs` (snapshots only) is
 * how long ago the threshold fired BY THE SERVER'S OWN CLOCK -- the two clocks
 * are never subtracted, because a phone can be minutes off and that would
 * silently eat the whole window. */
function approachPulseFrom(serverPulse) {
    if (!serverPulse || typeof serverPulse.threshold !== 'number') return null;
    const age = typeof serverPulse.ageMs === 'number' ? Math.max(0, serverPulse.ageMs) : 0;
    const left = CONFIG.APPROACH_PULSE_LINGER_MS - age;
    if (left <= 0) return null;
    return {
        level: serverPulse.threshold <= 30 ? 'red' : 'yellow',
        place: serverPulse.place || serverPulse.fence || 'Home',
        threshold: serverPulse.threshold,
        until: Date.now() + left
    };
}

/** Drops pulses whose window has closed, and returns how many went. It never
 * re-renders on its own: renderBadges() calls it, so it must not call back. */
function dropExpiredPulses() {
    const now = Date.now();
    let dropped = 0;
    for (const devId of Object.keys(approachPulses)) {
        if (approachPulses[devId].until <= now) { delete approachPulses[devId]; dropped++; }
    }
    return dropped;
}

/** An `approach` frame from the DO: a crossed threshold, or a clear (arrived,
 * turned away, too far out). */
function handleApproach(data) {
    const devId = data.deviceId;
    if (!devId || DEVICES.indexOf(devId) === -1) return;
    if (data.cleared) {
        if (approachPulses[devId]) { delete approachPulses[devId]; renderBadges(); }
        return;
    }
    const pulse = approachPulseFrom(data);
    if (!pulse) return;
    approachPulses[devId] = pulse;
    renderBadges();
    // The window closes on WALL TIME, not on the next ping: a device that stops
    // reporting mid-approach (tunnel, flat battery) has to stop pulsing exactly
    // like one that drove past, and no ping may arrive to make that happen.
    setTimeout(function() { if (dropExpiredPulses() > 0) renderBadges(); }, CONFIG.APPROACH_PULSE_LINGER_MS + 300);
}

/** One radar, anchored on the pulsing device's badge. The rings are identical
 * circles; the CSS spaces them out and scales them, so nothing here decides
 * timing — only WHICH card the sweep belongs to. */
function buildApproachRadar(level) {
    const el = document.createElement('div');
    el.className = 'approach-radar' + (level === 'red' ? ' red' : '');
    el.setAttribute('data-level', level);
    el.innerHTML = '<span class="halo"></span>' +
        '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<circle cx="50" cy="50" r="20"></circle>' +
            '<circle cx="50" cy="50" r="20"></circle>' +
            '<circle cx="50" cy="50" r="20"></circle>' +
        '</svg>';
    return el;
}

/** Put a radar on its badge's centre. Fixed positioning off the card's own
 * rect: the layer is a sibling of the map, so no offset maths and no stale
 * coordinates when the strip scrolls or the window resizes. */
function positionApproachRadar(el, devId) {
    const badge = document.querySelector('#badge-strip .user-badge[data-device="' + devId + '"]');
    if (!badge) return;
    const r = badge.getBoundingClientRect();
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top + r.height / 2) + 'px';
}

/** Sync the radar layer with approachPulses: one radar per pulsing device, on
 * that device's badge, yellow or red. Called from renderBadges() so a ping
 * landing mid-approach cannot leave the sweep anchored to a stale card, and
 * from resize/scroll for the same reason. */
function renderApproachRadar() {
    const layer = document.getElementById('approach-radar-layer');
    if (!layer) return;
    const live = Object.keys(approachPulses);
    Array.prototype.slice.call(layer.querySelectorAll('.approach-radar')).forEach(function(el) {
        const devId = el.getAttribute('data-device');
        if (live.indexOf(devId) === -1) { layer.removeChild(el); return; }
        positionApproachRadar(el, devId);
        const level = approachPulses[devId].level;
        // Only on a real change: re-assigning the same class restarts the
        // animation, and renderBadges runs on every ping.
        if (el.getAttribute('data-level') !== level) {
            el.setAttribute('data-level', level);
            el.className = 'approach-radar' + (level === 'red' ? ' red' : '');
        }
    });
    live.forEach(function(devId) {
        if (layer.querySelector('.approach-radar[data-device="' + devId + '"]')) return;
        const el = buildApproachRadar(approachPulses[devId].level);
        el.setAttribute('data-device', devId);
        layer.appendChild(el);
        positionApproachRadar(el, devId);
    });
}

function renderBadges() {
    const strip = document.getElementById('badge-strip');
    dropExpiredPulses();
    strip.innerHTML = '';

    for (const devId of DEVICES) {
        const last = latestPing[devId];
        const badge = document.createElement('div');
        badge.className = 'user-badge' + (followDeviceId === devId ? ' following' : '');
        // The radar anchors on this card, so it must be findable by device.
        badge.setAttribute('data-device', devId);
        badge.addEventListener('click', function() { followDevice(devId); });

        const control = deviceControlState[devId] || {};
        const controlPills = [];
        if (control.forcedMode) controlPills.push('<span class="badge-control-pill">Locked: ' + control.forcedMode + '</span>');
        if (control.recordingPaused) controlPills.push('<span class="badge-control-pill">Paused</span>');
        const controlHtml = controlPills.length ? ('<div class="badge-control-row">' + controlPills.join('') + '</div>') : '';
        const distHtml = '<div style="font-size:9px;color:#9ca3af;margin-top:1px;">🚗 ' + ((todayDist[devId] || 0)).toFixed(1) + ' km today</div>';
        // The pulse is re-applied on every rebuild (like the address), so a
        // ping landing mid-approach cannot wipe the thing that is telling you
        // to open the gate. It does not add a line of its own -- it REPLACES
        // the status row below (see statusRow): the card has one 9px row for
        // "how fresh / where", and a second row only for a countdown would be
        // a temporary line in a very small card.
        const pulse = approachPulses[devId] || null;

        if (!last) {
            badge.innerHTML =
                '<div class="badge-left">' +
                    '<div class="badge-device"><span class="emoji">' + (EMOJI_MAP[devId] || '📍') + '</span> ' + devId + '</div>' +
                    '<div class="badge-status-row"><span class="badge-status-offline">Offline</span></div>' +
                    '<div class="badge-activity-fallback">No data</div>' +
                    distHtml +
                    controlHtml +
                '</div>' +
                '<div class="badge-right"><span class="addr-loading">—</span></div>';
            strip.appendChild(badge);
            continue;
        }

        const now = new Date();
        const pingTime = new Date(last.timestamp);
        const diffMin = (now - pingTime) / 60000;

        let statusText, statusClass;
        if (diffMin < 2) { statusText = 'Live'; statusClass = 'badge-status-live'; }
        else if (diffMin < 60) { statusText = Math.round(diffMin) + ' Min Ago'; statusClass = 'badge-status-yellow'; }
        else { statusText = pingTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); statusClass = 'badge-status-offline'; }

        // While an approach pulse is on, the status line IS the approach line:
        // it answers the same question ("what is happening right now?") in the
        // same place, so the card gains no line and the countdown cannot be
        // missed among other readouts. Freshness comes back the moment it ends.
        const statusRow = pulse
            ? '<div class="badge-status-row"><span class="badge-approach-note">→ ' + escapeHtml(pulse.place) + ' · ~' + pulse.threshold + 's</span></div>'
            : '<div class="badge-status-row"><span class="' + statusClass + '">' + statusText + '</span></div>';

        let activityText, activityClass;
        if (last.is_inside_geofence && last.geofence_name) {
            const display = getDisplayName(last.geofence_name);
            const cat = getCategory(last.geofence_name);
            activityText = 'At ' + display;
            activityClass = cat === 'Office' ? 'badge-activity-office' : 'badge-activity-home';
        } else if (last.is_stationary) {
            activityText = 'Stationary'; activityClass = 'badge-activity-fallback';
        } else if (last.is_driving) {
            activityText = Math.round(last.speed || 0) + ' km/h'; activityClass = 'badge-activity-fallback';
        } else {
            activityText = 'Walking'; activityClass = 'badge-activity-fallback';
        }

        // Battery when the tracker reports one; otherwise GPS accuracy, which
        // every µlogger ping carries. (The battery strip had no CSS either, so
        // it was dead in both senses.)
        const batt = last.battery;
        const acc = accuracyLabel(last.accuracy);
        let metaHtml = '';
        if (batt !== null && batt !== undefined) {
            metaHtml = '<div class="badge-meta"><div class="badge-meta-bar" style="width:' + Math.min(batt, 100) + '%;background:' + getBatteryColor(batt) + '"></div><span>' + batt + '%</span></div>';
        } else if (acc) {
            metaHtml = '<div class="badge-meta">' + acc + '</div>';
        }

        // The address is RE-APPLIED from the cache on every rebuild, so it
        // survives renderBadges() being called on the next ping (see
        // cachedAddressLines). "—" means nothing is known yet, not "loading".
        const addr = cachedAddressLines(devId, last);
        const rightHtml =
            '<div class="badge-right">' +
                '<span id="primary-' + devId + '"' + (addr ? '' : ' class="addr-loading"') + '>' + (addr ? escapeHtml(addr.primary) : '—') + '</span><br>' +
                '<span id="secondary-' + devId + '">' + (addr ? escapeHtml(addr.secondary) : '') + '</span><br>' +
                '<span id="tertiary-' + devId + '">' + (addr ? escapeHtml(addr.tertiary) : '') + '</span>' +
            '</div>';

        badge.innerHTML =
            '<div class="badge-left">' +
                '<div class="badge-device">' +
                    '<span class="emoji">' + (EMOJI_MAP[devId] || '📍') + '</span> ' + devId +
                    '<span class="track-eye' + (trackVisible[devId] === false ? ' hidden' : '') + '" title="Show/hide track">👁</span>' +
                    (followDeviceId === devId ? '<span class="follow-icon">*</span>' : '') +
                '</div>' +
                statusRow +
                '<div class="' + activityClass + '">' + activityText + '</div>' +
                distHtml +
                controlHtml +
                metaHtml +
            '</div>' +
            rightHtml;
        if (pulse) badge.classList.add('approach-' + pulse.level);
        strip.appendChild(badge);

        const eyeEl = badge.querySelector('.track-eye');
        if (eyeEl) {
            eyeEl.addEventListener('click', function(e) {
                e.stopPropagation();
                const newVisible = !(trackVisible[devId] !== false);
                trackVisible[devId] = newVisible;
                localStorage.setItem('track_hidden_' + devId, newVisible ? 'false' : 'true');
                resetTrail(devId);   // hidden: layers gone; shown again: re-committed from the start
                startPlaybackLoop();
                renderBadges();
            });
        }

        if (!last.is_inside_geofence) {
            // Reverse-geocoding is THROTTLED. Nominatim asks for <=1 req/s and
            // renderBadges runs on every live ping (~5s), so re-fetch only when
            // the device actually moved >150m or the cached text is >5 min old,
            // and never more than once per 20s. Inside a fence we never ask:
            // the fence already says where the device is.
            const prevAddr = addressCache[devId];
            const nowMs = Date.now();
            const movedM = prevAddr ? distanceMeters(prevAddr.lat, prevAddr.lon, last.latitude, last.longitude) : Infinity;
            const stale = !prevAddr || (nowMs - prevAddr.at) > 5 * 60 * 1000;
            const coolEnough = !prevAddr || (nowMs - prevAddr.at) >= 20 * 1000;
            // Parked where we already resolved = nothing new to ask. The old gate
            // refused ANY fetch while stationary, so a device switched on
            // somewhere new stayed on a dash until it moved again.
            const parkedHere = !!last.is_stationary && movedM < 150;
            if (coolEnough && !parkedHere && (movedM > 150 || stale)) {
                // The point is recorded BEFORE the fetch resolves, which is what
                // throttles; the text lands here when Nominatim answers.
                addressCache[devId] = { lat: last.latitude, lon: last.longitude, at: nowMs, text: prevAddr ? prevAddr.text : null };
                saveAddressCache();
                (function(devId, last) {
                    fetch('https://nominatim.openstreetmap.org/reverse?lat=' + last.latitude + '&lon=' + last.longitude + '&format=jsonv2&zoom=18&addressdetails=1')
                    .then(function(resp) { return resp.ok ? resp.json() : null; })
                    .then(function(data) {
                        if (!data || !data.address) return;
                        const lines = describeAddress(data.address);
                        const entry = addressCache[devId];
                        if (!entry) return;
                        entry.text = lines;              // survives the next renderBadges()
                        saveAddressCache();
                        applyAddressLines(devId, lines); // no-op if the badge was rebuilt meanwhile
                    }).catch(function() {});
                })(devId, last);
            }
        }
    }

    // The sweep is drawn OUTSIDE the strip (see #approach-radar-layer): the
    // badge carries the identity, the radar carries the distance.
    renderApproachRadar();
}

async function apiJson(method, path, body) {
    const opts = { method: method, credentials: 'include' };
    if (body !== undefined) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
    }
    // A fetch that never reaches the server REJECTS instead of answering, and
    // an unhandled rejection here is a silent no-op: tapping Save appears to
    // do nothing at all (a phone whose radio was asleep, a dropped Wi-Fi
    // handover). Answer in the same shape as every other failure so the
    // callers' existing alert branch runs and the save cannot fail invisibly.
    let resp;
    try {
        resp = await fetch(path, opts);
    } catch (e) {
        return { ok: false, status: 0, data: { message: 'Could not reach the server — check your connection and try again.' } };
    }
    let data = null;
    try { data = await resp.json(); } catch (e) {}
    return { ok: resp.ok, status: resp.status, data: data };
}

    return GEOFENCES.map(function(f) {

            '<button class="toggle-pill" onclick="deleteGeofence(\'' + f.name + '\')">Delete</button>' +
        '</div>';
    }).join('');
}

function editGeofenceForm(name) {
    const f = GEOFENCES.find(function(g) { return g.name === name; });
    if (!f) return;
    editingGeofence = name;
    document.getElementById('gf-name').value = f.name;
    document.getElementById('gf-name').readOnly = true;
    document.getElementById('gf-display').value = f.displayName || '';
    document.getElementById('gf-category').value = f.category || '';
    document.getElementById('gf-lat').value = f.lat;
    document.getElementById('gf-lon').value = f.lng;
    document.getElementById('gf-radius').value = (f.radiusM != null) ? f.radiusM : 50;
    document.getElementById('gf-exit').value = (f.exitRadiusM != null) ? f.exitRadiusM : '';
    document.getElementById('gf-submit').textContent = 'Save geofence';
}

function resetGeofenceForm() {
    editingGeofence = null;
    const n = document.getElementById('gf-name'); if (n) { n.value = ''; n.readOnly = false; }
    ['gf-display', 'gf-lat', 'gf-lon', 'gf-exit'].forEach(function(id) { const el = document.getElementById(id); if (el) el.value = ''; });
    const r = document.getElementById('gf-radius'); if (r) r.value = '50';
    const c = document.getElementById('gf-category'); if (c) c.value = 'Home';
    const s = document.getElementById('gf-submit'); if (s) s.textContent = 'Add geofence';
}

async function submitGeofence() {
    const name = document.getElementById('gf-name').value.trim();
    const display = document.getElementById('gf-display').value.trim();
    const category = document.getElementById('gf-category').value || null;
    const lat = parseFloat(document.getElementById('gf-lat').value);
    const lon = parseFloat(document.getElementById('gf-lon').value);
    // Blank means "the default" (50 / entry+40), a NUMBER means what it says,
    // and anything else is refused out loud. The old parseFloat-or-fallback
    // silently turned a typo ("100m", "1,5") into the default — for the exit
    // field that meant silently CLEARING a radius the household had set.
    const radiusRaw = document.getElementById('gf-radius').value.trim();
    let radius = 50;
    if (radiusRaw) {
        const n = parseFloat(radiusRaw);
        if (!Number.isFinite(n) || n <= 0) { alert('Entry radius must be a positive number of metres.'); return; }
        radius = n;
    }
    const exitRaw = document.getElementById('gf-exit').value.trim();
    let exit = null;
    if (exitRaw) {
        const n = parseFloat(exitRaw);
        if (!Number.isFinite(n) || n <= 0) { alert('Exit radius must be a positive number of metres, or leave it blank for entry+40.'); return; }
        exit = n;
    }
    if (!name || !display || isNaN(lat) || isNaN(lon)) { alert('Name, display name, lat, and lon are required.'); return; }

    const body = { displayName: display, category: category, lat: lat, lon: lon, radiusM: radius, exitRadiusM: exit };
    const r = editingGeofence
        ? await apiJson('PUT', '/way/api/geofences/' + encodeURIComponent(editingGeofence), body)
        : await apiJson('POST', '/way/api/geofences', Object.assign({ name: name }, body));

    if (r.ok) {
        resetGeofenceForm();
        await loadDevicesAndGeofences();
        drawGeofenceCircles();
        renderSettingsMenu();
    } else {
        alert(r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function deleteGeofence(name) {
    if (!confirm('Delete geofence "' + name + '"?')) return;
    const r = await apiJson('DELETE', '/way/api/geofences/' + encodeURIComponent(name));
    if (r.ok) {
        resetGeofenceForm();
        await loadDevicesAndGeofences();
        drawGeofenceCircles();
        renderSettingsMenu();
    } else {
        alert(r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function generateInviteCode() {
    const r = await apiJson('POST', '/way/api/invite-codes');
    if (r.ok && r.data && r.data.code) {
        loadInviteCodes();
    } else {
        alert(r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function loadInviteCodes() {
    const el = document.getElementById('invite-codes-list');
    if (!el) return;
    const r = await apiJson('GET', '/way/api/invite-codes');
    if (!r.ok) { el.textContent = 'Could not load.'; return; }
    const codes = (r.data && r.data.codes) || [];
    if (codes.length === 0) { el.innerHTML = '<div style="opacity:0.5;margin-top:6px;">No codes generated yet.</div>'; return; }
    el.innerHTML = codes.map(function(c) {
        const used = c.usedAt ? 'used' : 'active';
        return '<div style="margin-top:4px;">' + escapeHtml(c.code) + ' <span style="opacity:0.5;">(' + used + ', expires ' + formatTime(c.expiresAt) + ')</span></div>';
    }).join('');
}

async function deleteHistory() {
    const months = parseInt(document.getElementById('del-months').value, 10);
    const deleteTracks = document.getElementById('del-tracks').checked;
    const deleteMessages = document.getElementById('del-messages').checked;
    if (!deleteTracks && !deleteMessages) { alert('Select at least one item to delete.'); return; }
    const label = (deleteTracks ? 'tracks' : '') + (deleteTracks && deleteMessages ? ' and ' : '') + (deleteMessages ? 'messages' : '');
    if (!confirm('Delete ' + label + ' older than ' + months + ' month(s)? This cannot be undone.')) return;
    const r = await apiJson('POST', '/way/api/history/delete', { months: months, deleteTracks: deleteTracks, deleteMessages: deleteMessages });
    if (r.ok) {
        setMsg('delete-msg', 'Deleted ' + (r.data.deletedPings || 0) + ' track points and ' + (r.data.deletedMessages || 0) + ' messages.');
    } else {
        setMsg('delete-msg', r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function saveProfile() {
    const emoji = document.getElementById('set-emoji').value.trim();
    const color = document.getElementById('set-color').value.trim();
    const r = await apiJson('PUT', '/way/api/users/me', { emoji: emoji || null, color: color || null });
    if (r.ok) {
        if (currentUser) { currentUser.emoji = emoji || null; currentUser.color = color || null; }

// ---- Push notifications (ntfy): per-user subscription grid --------------
// Each person's phone follows their OWN ntfy topic; the backend routes events
// into it based on the boxes ticked here. Nobody is notified about their own
// events, and a newly added user simply appears as a new row for everyone.
const NOTIF_LABELS = { entry: 'Entry', exit: 'Exit', chat: 'Chat', stationary: 'Stopped', moving: 'Moving', approach: 'Entry timer' };

    const r = await apiJson('GET', '/way/api/notifications');

}

function renderNotifGrid() {
    if (!notifConfig) return '<div class="settings-hint">Loading…</div>';
    const types = notifConfig.eventTypes || [];
    const users = notifConfig.users || [];
    if (users.length === 0) return '<div class="settings-hint">No other users yet.</div>';
    const subs = notifConfig.subs || [];
    // Columns follow the server's event list, so adding an event type never
    // needs a CSS change.
    const cols = 'grid-template-columns:1.3fr repeat(' + types.length + ',0.62fr);';
    let html = '<div class="notif-grid-row notif-grid-head" style="' + cols + '"><span></span>' +
        types.map(function(t) { return '<span>' + (NOTIF_LABELS[t] || t) + '</span>'; }).join('') + '</div>';
    html += users.map(function(u) {
        const cells = types.map(function(t) {
            const checked = subs.some(function(s) { return s.sourceId === u.id && s.eventType === t; });
            return '<span><input type="checkbox" data-src="' + u.id + '" data-ev="' + t + '"' + (checked ? ' checked' : '') + '></span>';
        }).join('');
        return '<div class="notif-grid-row" style="' + cols + '"><span>' + (u.emoji || '📍') + ' ' + escapeHtml(u.username) + '</span>' + cells + '</div>';
    }).join('');

/** Push-server root: admin-editable, because moving to a different ntfy
 * instance must not need a code change and a redeploy.
 *
 * Three layers can supply it, in order: this setting, the NTFY_URL var in
 * wrangler.jsonc, then a built-in default. The card always shows the
 * EFFECTIVE value and which layer produced it, so "I saved it but nothing
 * changed" is answerable at a glance. An empty box clears the override. */
function serverCard() {
    if (!serverSettings) return '';
    const effective = serverSettings.effectiveNtfyUrl || '(unknown)';
    const sourceLabel = serverSettings.source === 'setting' ? 'set here'
        : (serverSettings.source === 'env' ? 'from wrangler.jsonc (NTFY_URL)' : 'built-in default');
    return '<div class="settings-card" style="border-color:rgba(56,189,248,0.35);">' +
        '<div class="settings-title">📡 Push server</div>' +
        '<div class="settings-hint">In use: <b class="mono">' + escapeHtml(effective) + '</b> <span style="opacity:0.6;">(' + sourceLabel + ')</span></div>' +
        '<input id="ntfy-url" class="auth-input" type="text" placeholder="https://ntfy.example.com" ' +
            'value="' + escapeHtml(serverSettings.ntfyUrl || '') + '">' +
        '<div style="display:flex;gap:6px;margin-top:6px;">' +
            '<button class="export-btn" onclick="savePushServer()">Save server</button>' +
            '<button class="toggle-pill" onclick="clearPushServer()">Use default</button>' +
        '</div>' +
        '<div id="ntfy-url-msg" style="font-size:10px;color:#9ca3af;margin-top:4px;"></div>' +
        '<div class="settings-hint">Leave empty to fall back to ' +
            escapeHtml(serverSettings.defaultNtfyUrl || 'https://ntfy.sh') +
            '. Changing this does NOT move your topics -- everyone must also point their ntfy app at the new server.</div>' +
    '</div>';
}

function renderAdminUsers() {
    if (!adminUsers) return '<div class="settings-hint">Loading…</div>';
    const ln = notifDebug && notifDebug.lastNotify;
    // Prefer the DO's resolved server (it knows whether an admin setting, the
    // wrangler var, or the default is in force); fall back to the API view.
    const server = (notifDebug && notifDebug.server) ? String(notifDebug.server)
        : ((serverSettings && serverSettings.effectiveNtfyUrl) || 'https://ntfy.sh');
    const serverRoot = server.replace(/\/+$/, '');
    let status = ln
        ? ('Last push: <b>' + escapeHtml(String(ln.outcome)) + '</b> &mdash; ' +
           escapeHtml(String(ln.source)) + ' / ' + escapeHtml(String(ln.type)))
        : 'No push attempts yet.';
    status += ' <span style="opacity:0.6;">via ' + escapeHtml(serverRoot) + '</span>';
    let html = '<div class="settings-hint" style="margin-bottom:4px;">' + status + '</div>';

    // Event types nobody subscribes to can never fire. Saying so explicitly
    // is what turns "the notification didn't trigger" into a one-glance
    // answer instead of a debugging session.
    const counts = (notifDebug && notifDebug.subscribedEventTypes) || [];
    const orphaned = counts.filter(function(c) { return c.recipients === 0; });
    if (orphaned.length) {
        html += '<div class="settings-hint" style="color:#fbbf24;">' +
            '⚠️ Nobody receives: ' + orphaned.map(function(c) {
                return escapeHtml(NOTIF_LABELS[c.eventType] || c.eventType);
            }).join(', ') +
            '. Tick the boxes in <b>Notifications</b> (each person controls what THEY receive).</div>';
    }

    html += serverCard();

    html += adminUsers.map(function(u) {
        const topic = u.ntfyTopic || '';
        const link = topic ? (serverRoot + '/' + topic) : '';
        // Which database answered. The topic lives in the identity database
        // (home-db users.way_topic); way-db's own column is only a fallback for
        // a standalone deployment. Saying which one is in force is what stops
        // this screen from again advertising a topic that receives nothing.
        const source = u.topicSource === 'identity'
            ? '<span style="font-size:9px;color:#4ade80;">identity channel</span>'
            : '<span style="font-size:9px;color:#fbbf24;">way-db copy (no Home account?)</span>';
        return '<div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:8px;margin-top:6px;">' +
            '<div class="settings-row"><span style="flex:1;">' + (u.emoji || '📍') + ' ' + escapeHtml(u.username) + '</span>' +
                '<button class="toggle-pill" onclick="regenTopic(' + u.id + ')">Generate</button></div>' +
            '<div style="margin:2px 0;">' + source + '</div>' +
            '<div class="mono" style="font-size:10px;color:#38bdf8;word-break:break-all;margin:4px 0;">' + escapeHtml(topic || '(no topic)') + '</div>' +
            '<div style="display:flex;gap:6px;">' +
                '<button class="toggle-pill" onclick="copyText(\'' + escapeHtml(topic) + '\', this)">Copy topic</button>' +
                '<button class="toggle-pill" onclick="copyText(\'' + escapeHtml(link) + '\', this)">Copy link</button>' +
            '</div>' +
        '</div>';
    }).join('');
    return html;
}

function copyText(text, btn) {
    if (!text) return;
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    if (btn) {

        setTimeout(function() { btn.textContent = old; }, 1200);

}

function setForcedMode(deviceId, mode) {
    sendWs({ type: 'setForcedMode', deviceId: deviceId, mode: mode });
}

function sendWs(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function connectWebSocket() {
    // Close any previous socket first: the DO stamps the sender identity
    // from the session cookie AT CONNECT TIME, so a socket opened under an
    // old login must never survive a re-login. (Symptom when it did: the
    // dashboard showed the new user while sends still went out as the old
    // one.) Nulling the handlers stops the dying socket from firing
    // onclose's reconnect timer against the brand-new one below.
    if (ws) {
        try { ws.onclose = null; ws.onerror = null; ws.onmessage = null; ws.close(); } catch (e) {}
        ws = null;
    }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws'); // /ws is app-global (handled by the Home Worker, NOT under /way/)

    ws.onopen = function() { wsReconnectDelay = CONFIG.WS_RECONNECT_BASE_MS; };

    ws.onmessage = function(evt) {
        let data;
        try { data = JSON.parse(evt.data); } catch (e) { return; }

        // Chat frames ('chat' / 'chatReactions') also arrive on this socket;
        // the chat page (/chat/) handles them. WAY has no chat view left, so
        // they are ignored here.
        if (data.type === 'snapshot') handleSnapshot(data);
        else if (data.type === 'position') handleNewPing(data);
        else if (data.type === 'track') handleTrackPoint(data);
        else if (data.type === 'approach') handleApproach(data);
        else if (data.type === 'deviceControlState') {
            deviceControlState[data.deviceId] = { forcedMode: data.forcedMode, recordingPaused: data.recordingPaused };
            renderBadges();
            if (currentTab === 'settings') renderSettingsMenu();
        }
    };

    ws.onclose = function() {
        setTimeout(connectWebSocket, wsReconnectDelay);
        wsReconnectDelay = Math.min(wsReconnectDelay * 1.6, CONFIG.WS_RECONNECT_MAX_MS);
    };
    ws.onerror = function() { ws.close(); };
}

function handleSnapshot(data) {
    devicePings = {}; latestPing = {}; todayDist = {};
    DEVICES.forEach(function(d) { devicePings[d] = []; todayDist[d] = 0; });
    clearAllStationaryDots();

    // In-flight approach pulses ride the snapshot too (they are the DO's live
    // state), re-timed from the age the DO reports -- reloading mid-approach
    // must not hand the badge a fresh 60 seconds and let a drive-by keep
    // pulsing until it is noticed.
    approachPulses = {};
    const snapshotPulses = data.approaches || {};
    for (const devId of Object.keys(snapshotPulses)) {
        if (DEVICES.indexOf(devId) === -1) continue;
        const p = approachPulseFrom(snapshotPulses[devId]);
        if (p) approachPulses[devId] = p;
    }

    for (const devId of DEVICES) {
        const status = toPing(devId, data.devices[devId]);
        if (status) latestPing[devId] = status;

        const rawPoints = data.tracks[devId] || [];
        const points = rawPoints.map(function(row) { return toPing(devId, row); })
            .sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });
        for (const p of points) {
            if (p.is_driving && p.distance_km) todayDist[devId] += p.distance_km;
            if (shouldDrawPoint(p)) devicePings[devId].push(p);
            maybeAddStationaryDot(devId, p);
        }
    }

    redrawAllTracks();
    for (const devId of DEVICES) if (latestPing[devId]) updateMarker(devId, latestPing[devId]);
    renderBadges();
    updateTogetherAndETA();
    if (!selectedDevice && DEVICES.length) selectSpeedoDevice(DEVICES[0]);
    else updateSpeedoHUD();

}

function handleNewPing(raw) {
    const devId = raw.deviceId;
    if (DEVICES.indexOf(devId) === -1) return;
    const ping = toPing(devId, raw);

    latestPing[devId] = ping;

    // Inside a fence the countdown is over. The DO clears its own pulse and
    // says so, but the map must not keep pulsing until that frame arrives.
    if (ping.is_inside_geofence && approachPulses[devId]) delete approachPulses[devId];

    // Only driven distance is tracked -- walking is a live-status thing on
    // the dashboard, never part of history.
    if (ping.is_driving && ping.distance_km) {
        todayDist[devId] = (todayDist[devId] || 0) + ping.distance_km;
    }

    if (!devicePings[devId]) devicePings[devId] = [];
    // `guarding` pings (the 30s exit guard) are held server-side and delivered
    // later as `track` messages -- adding them here too would double them up.
    // `unwitnessed` pings (found outside a fence after a long silence) move the
    // live dot but are no track point: the server wrote no row and counted no
    // distance for them, so drawing one would invent a leg nobody earned.
    if (!raw.guarding && !raw.unwitnessed && shouldDrawPoint(ping)) devicePings[devId].push(ping);
    maybeAddStationaryDot(devId, ping);

    // Nothing is drawn here. The ping is now IN devicePings, and the playback
    // loop picks it up when its cursor reaches it -- that is the whole point of
    // the delay, and why this no longer rebuilds every track on every arrival.

    if (!selectedDevice) selectSpeedoDevice(devId);
    if (selectedDevice === devId) updateSpeedoHUD();
    updateTogetherAndETA();

    // The camera is NOT moved here any more. It used to pan to this ping on
    // every arrival -- a 0.4s slide that finished long before the next one,
    // which is exactly the judder. updateFollowCamera() now owns it, off the
    // same delayed cursor the marker uses, and only moves at all once the
    // device leaves the middle of the screen.
    renderBadges();
}

/** A track point sent after the fact: the pings held during the exit guard,
 * plus the fence-edge crossing point. Deliberately does NOT touch the live dot
 * or latestPing -- these are OLDER than the current position, so moving the
 * marker backwards would be wrong. devicePings is re-sorted because they
 * arrive after newer points have already been appended. */
function handleTrackPoint(raw) {
    const devId = raw.deviceId;
    if (DEVICES.indexOf(devId) === -1) return;
    const p = toPing(devId, raw);
    if (!p || !shouldDrawPoint(p)) return;
    if (!devicePings[devId]) devicePings[devId] = [];
    devicePings[devId].push(p);
    devicePings[devId].sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });
    // This one can land BEFORE the cursor, which shifts every commit index, so
    // the trail is rebuilt (the loop re-commits it in one frame) instead of
    // being appended to. Late points are rare -- the exit guard -- so the
    // rebuild is cheap, and it is the only correct answer.
    resetTrail(devId);
}

function shiftDay(delta) {
    const d = new Date(selectedDateStr);
    d.setDate(d.getDate() + delta);
    selectedDateStr = d.toISOString().split('T')[0];
    document.getElementById('trips-date-input').value = selectedDateStr;
    loadTripsForDate(selectedDateStr);
}
function setToday() {

function onDateChanged(val) {
