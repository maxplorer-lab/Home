            renderBadges();
        }
        setMsg('profile-msg', 'Saved.');
    } else {
        setMsg('profile-msg', r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function savePrefs() {
    const followZoom = parseInt(document.getElementById('set-follow-zoom').value, 10) || CONFIG.FOLLOW_ZOOM_LEVEL;
    const homeFence = document.getElementById('set-home-fence').value || null;
    const r = await apiJson('PUT', '/way/api/users/me', { followZoom: followZoom, homeFence: homeFence });
    if (r.ok) {
        userPrefs.followZoom = followZoom;
        userPrefs.homeFence = homeFence;
        setMsg('profile-msg', 'Map settings saved.');
    } else {
        setMsg('profile-msg', r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function changePassword() {
    const current = document.getElementById('pw-current').value;
    const nw = document.getElementById('pw-new').value;
    const confirmPw = document.getElementById('pw-confirm').value;
    if (!current || !nw) { setMsg('profile-msg', 'Enter current and new password.'); return; }
    if (nw !== confirmPw) { setMsg('profile-msg', 'New passwords do not match.'); return; }
    const r = await apiJson('POST', '/way/api/auth/password', { currentPassword: current, newPassword: nw });
    if (r.ok) {
        setMsg('profile-msg', 'Password changed.');
        document.getElementById('pw-current').value = '';
        document.getElementById('pw-new').value = '';
        document.getElementById('pw-confirm').value = '';
    } else {
        setMsg('profile-msg', r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

// ---- Push notifications (ntfy): per-user subscription grid --------------
// Each person's phone follows their OWN ntfy topic; the backend routes events
// into it based on the boxes ticked here. Nobody is notified about their own
// events, and a newly added user simply appears as a new row for everyone.
const NOTIF_LABELS = { entry: 'Entry', exit: 'Exit', chat: 'Chat', stationary: 'Stopped', moving: 'Moving', approach: 'Entry timer' };

async function loadNotifConfig() {
    const r = await apiJson('GET', '/way/api/notifications');
    if (r.ok) { notifConfig = r.data; renderSettingsMenu(); }
}

function renderNotifGrid() {
    if (!notifConfig) return '<div class="settings-hint">Loading…</div>';
    const types = notifConfig.eventTypes || [];
    const users = notifConfig.users || [];
    if (users.length === 0) return '<div class="settings-hint">No other users yet.</div>';
    const subs = notifConfig.subs || [];
    // Columns follow the server's event list, so adding an event type never
    // needs a CSS change.
    const cols = 'grid-template-columns:1.3fr repeat(' + types.length + ',0.62fr);';
    let html = '<div class="notif-grid-row notif-grid-head" style="' + cols + '"><span></span>' +
        types.map(function(t) { return '<span>' + (NOTIF_LABELS[t] || t) + '</span>'; }).join('') + '</div>';
    html += users.map(function(u) {
        const cells = types.map(function(t) {
            const checked = subs.some(function(s) { return s.sourceId === u.id && s.eventType === t; });
            return '<span><input type="checkbox" data-src="' + u.id + '" data-ev="' + t + '"' + (checked ? ' checked' : '') + '></span>';
        }).join('');
        return '<div class="notif-grid-row" style="' + cols + '"><span>' + (u.emoji || '📍') + ' ' + escapeHtml(u.username) + '</span>' + cells + '</div>';
    }).join('');
    return html;
}

async function saveNotifications() {
    const subs = [];
    document.querySelectorAll('#notif-grid input[type=checkbox]').forEach(function(cb) {
        if (cb.checked) subs.push({ sourceId: parseInt(cb.dataset.src, 10), eventType: cb.dataset.ev });
    });
    const r = await apiJson('PUT', '/way/api/notifications', {
        subs: subs,
        quietStart: parseInt(document.getElementById('quiet-start').value, 10) || 0,
        quietEnd: parseInt(document.getElementById('quiet-end').value, 10) || 0
    });
    setMsg('notif-msg', r.ok ? 'Saved.' : (r.data && r.data.message ? r.data.message : 'Failed.'));
}

// ---- Admin: users + their ntfy topics -----------------------------------
async function loadAdminUsers() {
    const r = await apiJson('GET', '/way/api/users');
    if (r.ok) adminUsers = r.data;
    // Also pull the DO's own view, so a silently-failing push shows up here
    // instead of just vanishing (that is how the ntfy quota failure hid).
    const d = await apiJson('GET', '/way/api/debug/notify');
    if (d.ok) notifDebug = d.data;
    // The push server is a settable value, not a constant -- see serverCard().
    const s = await apiJson('GET', '/way/api/settings');
    if (s.ok) serverSettings = s.data;
    renderSettingsMenu();
}

/** Push-server root: admin-editable, because moving to a different ntfy
 * instance must not need a code change and a redeploy.
 *
 * Three layers can supply it, in order: this setting, the NTFY_URL var in
 * wrangler.jsonc, then a built-in default. The card always shows the
 * EFFECTIVE value and which layer produced it, so "I saved it but nothing
 * changed" is answerable at a glance. An empty box clears the override. */
function serverCard() {
    if (!serverSettings) return '';
    const effective = serverSettings.effectiveNtfyUrl || '(unknown)';
    const sourceLabel = serverSettings.source === 'setting' ? 'set here'
        : (serverSettings.source === 'env' ? 'from wrangler.jsonc (NTFY_URL)' : 'built-in default');
    return '<div class="settings-card" style="border-color:rgba(56,189,248,0.35);">' +
        '<div class="settings-title">📡 Push server</div>' +
        '<div class="settings-hint">In use: <b class="mono">' + escapeHtml(effective) + '</b> <span style="opacity:0.6;">(' + sourceLabel + ')</span></div>' +
        '<input id="ntfy-url" class="auth-input" type="text" placeholder="https://ntfy.example.com" ' +
            'value="' + escapeHtml(serverSettings.ntfyUrl || '') + '">' +
        '<div style="display:flex;gap:6px;margin-top:6px;">' +
            '<button class="export-btn" onclick="savePushServer()">Save server</button>' +
            '<button class="toggle-pill" onclick="clearPushServer()">Use default</button>' +
        '</div>' +
        '<div id="ntfy-url-msg" style="font-size:10px;color:#9ca3af;margin-top:4px;"></div>' +
        '<div class="settings-hint">Leave empty to fall back to ' +
            escapeHtml(serverSettings.defaultNtfyUrl || 'https://ntfy.sh') +
            '. Changing this does NOT move your topics -- everyone must also point their ntfy app at the new server.</div>' +
    '</div>';
}

async function savePushServer() {
    const el = document.getElementById('ntfy-url');
    const r = await apiJson('PUT', '/way/api/settings', { ntfyUrl: el ? el.value : '' });
    setMsg('ntfy-url-msg', r.ok ? 'Saved.' : (r.data && r.data.message ? r.data.message : 'Failed.'));
    if (r.ok) loadAdminUsers();
}

async function clearPushServer() {
    const el = document.getElementById('ntfy-url');
    if (el) el.value = '';
    const r = await apiJson('PUT', '/way/api/settings', { ntfyUrl: '' });
    setMsg('ntfy-url-msg', r.ok ? 'Reverted to default.' : 'Failed.');
    if (r.ok) loadAdminUsers();
}

function renderAdminUsers() {
    if (!adminUsers) return '<div class="settings-hint">Loading…</div>';
    const ln = notifDebug && notifDebug.lastNotify;
    // Prefer the DO's resolved server (it knows whether an admin setting, the
    // wrangler var, or the default is in force); fall back to the API view.
    const server = (notifDebug && notifDebug.server) ? String(notifDebug.server)
        : ((serverSettings && serverSettings.effectiveNtfyUrl) || 'https://ntfy.sh');
    const serverRoot = server.replace(/\/+$/, '');
    let status = ln
        ? ('Last push: <b>' + escapeHtml(String(ln.outcome)) + '</b> &mdash; ' +
           escapeHtml(String(ln.source)) + ' / ' + escapeHtml(String(ln.type)))
        : 'No push attempts yet.';
    status += ' <span style="opacity:0.6;">via ' + escapeHtml(serverRoot) + '</span>';
    let html = '<div class="settings-hint" style="margin-bottom:4px;">' + status + '</div>';

    // Event types nobody subscribes to can never fire. Saying so explicitly
    // is what turns "the notification didn't trigger" into a one-glance
    // answer instead of a debugging session.
    const counts = (notifDebug && notifDebug.subscribedEventTypes) || [];
    const orphaned = counts.filter(function(c) { return c.recipients === 0; });
    if (orphaned.length) {
        html += '<div class="settings-hint" style="color:#fbbf24;">' +
            '⚠️ Nobody receives: ' + orphaned.map(function(c) {
                return escapeHtml(NOTIF_LABELS[c.eventType] || c.eventType);
            }).join(', ') +
            '. Tick the boxes in <b>Notifications</b> (each person controls what THEY receive).</div>';
    }

    html += serverCard();

    html += adminUsers.map(function(u) {
        const topic = u.ntfyTopic || '';
        const link = topic ? (serverRoot + '/' + topic) : '';
        return '<div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:8px;margin-top:6px;">' +
            '<div class="settings-row"><span style="flex:1;">' + (u.emoji || '📍') + ' ' + escapeHtml(u.username) + '</span>' +
                '<button class="toggle-pill" onclick="regenTopic(' + u.id + ')">Generate</button></div>' +
            '<div class="mono" style="font-size:10px;color:#38bdf8;word-break:break-all;margin:4px 0;">' + escapeHtml(topic || '(no topic)') + '</div>' +
            '<div style="display:flex;gap:6px;">' +
                '<button class="toggle-pill" onclick="copyText(\'' + escapeHtml(topic) + '\', this)">Copy topic</button>' +
                '<button class="toggle-pill" onclick="copyText(\'' + escapeHtml(link) + '\', this)">Copy link</button>' +
            '</div>' +
        '</div>';
    }).join('');
    return html;
}

function copyText(text, btn) {
    if (!text) return;
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    if (btn) {
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(function() { btn.textContent = old; }, 1200);
    }
}

async function regenTopic(userId) {
    if (!confirm('Generate a NEW topic for this user?\n\nThe old topic stops working immediately and they must re-add the new one to their ntfy app.')) return;
    const r = await apiJson('POST', '/way/api/users/' + userId + '/topic');
    if (r.ok) { await loadAdminUsers(); }
    else alert(r.data && r.data.message ? r.data.message : 'Failed.');
}

async function logout() {
    try { await fetch('/way/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
    // Signed out everywhere — the super app owns the session.
    window.top.location.href = '/logout';
}

function setForcedMode(deviceId, mode) {
    sendWs({ type: 'setForcedMode', deviceId: deviceId, mode: mode });
}
function setRecordingPaused(deviceId, paused) {
    sendWs({ type: 'setRecordingPaused', deviceId: deviceId, paused: paused });
}

function sendWs(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function connectWebSocket() {
    // Close any previous socket first: the DO stamps the sender identity
    // from the session cookie AT CONNECT TIME, so a socket opened under an
    // old login must never survive a re-login. (Symptom when it did: the
    // dashboard showed the new user while sends still went out as the old
    // one.) Nulling the handlers stops the dying socket from firing
    // onclose's reconnect timer against the brand-new one below.
    if (ws) {
        try { ws.onclose = null; ws.onerror = null; ws.onmessage = null; ws.close(); } catch (e) {}
        ws = null;
    }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws'); // /ws is app-global (handled by the Home Worker, NOT under /way/)

    ws.onopen = function() { wsReconnectDelay = CONFIG.WS_RECONNECT_BASE_MS; };

    ws.onmessage = function(evt) {
        let data;
        try { data = JSON.parse(evt.data); } catch (e) { return; }

        // Chat frames ('chat' / 'chatReactions') also arrive on this socket;
        // the chat page (/chat/) handles them. WAY has no chat view left, so
        // they are ignored here.
        if (data.type === 'snapshot') handleSnapshot(data);
        else if (data.type === 'position') handleNewPing(data);
        else if (data.type === 'track') handleTrackPoint(data);
        else if (data.type === 'deviceControlState') {
            deviceControlState[data.deviceId] = { forcedMode: data.forcedMode, recordingPaused: data.recordingPaused };
            renderBadges();
            if (currentTab === 'settings') renderSettingsMenu();
        }
    };

    ws.onclose = function() {
        setTimeout(connectWebSocket, wsReconnectDelay);
        wsReconnectDelay = Math.min(wsReconnectDelay * 1.6, CONFIG.WS_RECONNECT_MAX_MS);
    };
    ws.onerror = function() { ws.close(); };
}

function handleSnapshot(data) {
    devicePings = {}; latestPing = {}; todayDist = {};
    DEVICES.forEach(function(d) { devicePings[d] = []; todayDist[d] = 0; });
    clearAllStationaryDots();

    for (const devId of DEVICES) {
        const status = toPing(devId, data.devices[devId]);
        if (status) latestPing[devId] = status;

        const rawPoints = data.tracks[devId] || [];
        const points = rawPoints.map(function(row) { return toPing(devId, row); })
            .sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });
        for (const p of points) {
            if (p.is_driving && p.distance_km) todayDist[devId] += p.distance_km;
            if (shouldDrawPoint(p)) devicePings[devId].push(p);
            maybeAddStationaryDot(devId, p);
        }
    }

    redrawAllTracks();
    for (const devId of DEVICES) if (latestPing[devId]) updateMarker(devId, latestPing[devId]);
    renderBadges();
    updateTogetherAndETA();
    if (!selectedDevice && DEVICES.length) selectSpeedoDevice(DEVICES[0]);
    else updateSpeedoHUD();

}

function handleNewPing(raw) {
    const devId = raw.deviceId;
    if (DEVICES.indexOf(devId) === -1) return;
    const ping = toPing(devId, raw);

    latestPing[devId] = ping;

    // Only driven distance is tracked -- walking is a live-status thing on
    // the dashboard, never part of history.
    if (ping.is_driving && ping.distance_km) {
        todayDist[devId] = (todayDist[devId] || 0) + ping.distance_km;
    }

    if (!devicePings[devId]) devicePings[devId] = [];
    // `guarding` pings (the 30s exit guard) are held server-side and delivered
    // later as `track` messages -- adding them here too would double them up.
    if (!raw.guarding && shouldDrawPoint(ping)) devicePings[devId].push(ping);
    maybeAddStationaryDot(devId, ping);

    updateMarker(devId, ping);
    redrawAllTracks();

    if (!selectedDevice) selectSpeedoDevice(devId);
    if (selectedDevice === devId) updateSpeedoHUD();
    updateTogetherAndETA();

    if (followDeviceId === devId) {
        const target = L.latLng(ping.latitude, ping.longitude);
        ignoreZoomEvent = true;
        if (!map) { ignoreZoomEvent = false; return; }
        if (map.getZoom() < userPrefs.followZoom) {
            map.flyTo(target, userPrefs.followZoom, { duration: CONFIG.FOLLOW_FLY_DURATION });
        } else {
            map.panTo(target, { animate: true, duration: CONFIG.FOLLOW_PAN_DURATION });
        }
        map.once('moveend', function() { ignoreZoomEvent = false; });
    }
    renderBadges();
}

/** A track point sent after the fact: the pings held during the exit guard,
 * plus the fence-edge crossing point. Deliberately does NOT touch the live dot
 * or latestPing -- these are OLDER than the current position, so moving the
 * marker backwards would be wrong. devicePings is re-sorted because they
 * arrive after newer points have already been appended. */
function handleTrackPoint(raw) {
    const devId = raw.deviceId;
    if (DEVICES.indexOf(devId) === -1) return;
    const p = toPing(devId, raw);
    if (!p || !shouldDrawPoint(p)) return;
    if (!devicePings[devId]) devicePings[devId] = [];
    devicePings[devId].push(p);
    devicePings[devId].sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });
    redrawAllTracks();
}

function shiftDay(delta) {
    const d = new Date(selectedDateStr);
    d.setDate(d.getDate() + delta);
    selectedDateStr = d.toISOString().split('T')[0];
    document.getElementById('trips-date-input').value = selectedDateStr;
    loadTripsForDate(selectedDateStr);
}
function setToday() {
    selectedDateStr = nairobiDateStr();
    document.getElementById('trips-date-input').value = selectedDateStr;
    loadTripsForDate(selectedDateStr);
}
function onDateChanged(val) {
    if (!val) return;
    selectedDateStr = val;
    loadTripsForDate(selectedDateStr);
}

/** Group a day's stored points into legs. "Leg" is a BACKEND concept: every
 * stored point carries leg_id (assigned by the state machine, bounded by
 * fence departures/arrivals and start/stop), so this just groups by it --
 * falling back to a time-gap split for rows written before legs existed. */
function computeLegsForDay(pings) {
    const sorted = pings.slice().sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });
    const legs = [];
    let current = null;
    let lastTs = null;

    for (const p of sorted) {
        if (!shouldDrawPoint(p)) { lastTs = null; continue; }
        const ts = new Date(p.timestamp).getTime();
        const legId = (p.leg_id !== undefined && p.leg_id !== null) ? p.leg_id : null;
        const gapSec = (lastTs === null) ? Infinity : (ts - lastTs) / 1000;
        const legChanged = current !== null &&
            ((legId !== null && current.legId !== null && legId !== current.legId) || gapSec > CONFIG.TRACK_GAP_SECONDS);

        if (current === null || legChanged) {
            if (current && current.points.length >= 2) legs.push(current);
            current = {
                legId: legId,
                startTime: p.timestamp, endTime: p.timestamp,
                startName: p.is_inside_geofence ? getDisplayName(p.geofence_name) : 'En route',
                points: [[p.latitude, p.longitude]],
                // distanceKm = the whole path; drivenKm / walkedKm split it by
                // classification. The day's totals use the split, so walking is
                // reported but never counted as driven distance. See
                // shouldPersistTrackPoint() in FleetDO.ts.
                distanceKm: 0, drivenKm: 0, walkedKm: 0, topSpeed: p.speed || 0, isDriving: !!p.is_driving
            };
        } else {
            const last = current.points[current.points.length - 1];
            current.points.push([p.latitude, p.longitude]);
            const segKm = distanceMeters(last[0], last[1], p.latitude, p.longitude) / 1000;
            current.distanceKm += segKm;
            if (p.is_driving) current.drivenKm += segKm;
            else current.walkedKm += segKm;
            current.endTime = p.timestamp;
            if ((p.speed || 0) > current.topSpeed) current.topSpeed = p.speed;
            if (p.is_driving) current.isDriving = true;
            if (current.legId === null && legId !== null) current.legId = legId;
        }
        lastTs = ts;
    }
    if (current && current.points.length >= 2) legs.push(current);
    return legs;
}

// ---- Whole-day review overlay -------------------------------------------
// The map's own track is always TODAY (live). Reviewing a past date draws
// that WHOLE day at once (every leg, broken at leg boundaries and gaps) --
// "leg" stays a backend concept and never limits what the map shows.
let reviewDayLayers = [];

function clearReviewDay() {
    if (!map) return;
    reviewDayLayers.forEach(function(l) { map.removeLayer(l); });
    reviewDayLayers = [];
}

function showDayOnMap(dateStr, perDevice) {
    clearReviewDay();
    // Today is already drawn as the live track -- don't double-draw it.
    if (dateStr === nairobiDateStr()) return;

    DEVICES.forEach(function(devId) {
        const pts = (perDevice[devId] || []).filter(shouldDrawPoint);
        if (pts.length < 2) return;
        const color = DEVICE_COLORS[devId] || CONFIG.DEFAULT_DEVICE_COLOR;
        let seg = [];
        let lastTs = null, lastLeg = null;
        const flush = function() {
            if (seg.length >= 2) {
                reviewDayLayers.push(L.polyline(seg, {
                    color: color, weight: CONFIG.TRACK_WEIGHT_DRIVING,
                    opacity: CONFIG.TRACK_OPACITY_DRIVING, smoothFactor: 1.5
                }).addTo(map));
            }
            seg = [];
        };
        for (const p of pts) {
            const ts = new Date(p.timestamp).getTime();
            const leg = (p.leg_id !== undefined && p.leg_id !== null) ? p.leg_id : null;
            const gapSec = (lastTs === null) ? Infinity : (ts - lastTs) / 1000;
            if (seg.length && ((leg !== null && lastLeg !== null && leg !== lastLeg) || gapSec > CONFIG.TRACK_GAP_SECONDS)) flush();
            seg.push([p.latitude, p.longitude]);
            lastTs = ts; lastLeg = leg;
        }
        flush();
    });

    if (reviewDayLayers.length) {
        map.fitBounds(L.featureGroup(reviewDayLayers).getBounds(), { padding: [40, 40] });
    }
}

async function fetchHistoryFor(devId, startIso, endIso) {
    try {
        const resp = await fetch('/way/api/history?device_id=' + encodeURIComponent(devId) + '&start=' + encodeURIComponent(startIso) + '&end=' + encodeURIComponent(endIso), { credentials: 'include' });
        if (!resp.ok) return [];
        const data = await resp.json();
        return (data.pings || []).map(function(row) { return toPing(devId, row); });
    } catch (e) { return []; }
}

async function loadMonthlyTotals() {
    const el = document.getElementById('monthly-totals');
    el.innerHTML = '<div style="opacity:0.5;">Loading monthly totals...</div>';
    try {
        const nMonth = nairobiDateStr().slice(0, 7);
        const firstOfMonth = nairobiDayRange(nMonth + '-01').start;
        const nowIso = new Date().toISOString();

        const totals = {};
        const walked = {};
        DEVICES.forEach(function(d) { totals[d] = 0; walked[d] = 0; });
        for (const devId of DEVICES) {
            const pings = await fetchHistoryFor(devId, firstOfMonth, nowIso);
            // Split by classification, same rule as the per-day summary: walked
            // distance is reported separately and never added to driven km.
            pings.forEach(function(p) {
                const km = p.distance_km || 0;
                if (!km) return;
                if (p.is_driving) totals[devId] += km;
                else if (!p.is_stationary && !p.is_inside_geofence) walked[devId] += km;
            });
        }

        const monthLabel = new Date(nMonth + '-01T12:00:00+03:00').toLocaleDateString([], { month: 'long' });
        el.innerHTML = DEVICES.map(function(devId) {
            const walkedNote = walked[devId] > 0.05 ? ' &middot; ' + walked[devId].toFixed(1) + ' km walked' : '';
            return '<div>' + (EMOJI_MAP[devId] || '📍') + ' <strong style="color:#38bdf8;">' + devId + '</strong> - ' + totals[devId].toFixed(1) + ' km driven in ' + monthLabel + walkedNote + ' (through yesterday)</div>';
        }).join('');
    } catch (e) {
        el.innerHTML = '<div style="color:#ef4444;">Could not load monthly totals.</div>';
    }
}

async function loadTripsForDate(dateStr) {
    const listEl = document.getElementById('trips-cards-list');
    listEl.innerHTML = '<div style="opacity:0.6; font-size:12px;">Loading...</div>';

    // A date/mode (re)load invalidates any leg currently highlighted on the map.
    if (reviewLegLayer) { map.removeLayer(reviewLegLayer); reviewLegLayer = null; }

    try {
        const range = nairobiDayRange(dateStr);
        const startIso = range.start, endIso = range.end;
        const isToday = dateStr === nairobiDateStr();

        const perDevice = {};
        for (const devId of DEVICES) {
            perDevice[devId] = isToday ? (devicePings[devId] || []) : await fetchHistoryFor(devId, startIso, endIso);
        }

        listEl.innerHTML = DEVICES.map(function(devId) {
            const pings = perDevice[devId];
            const legs = computeLegsForDay(pings);

            let drivenKm = 0, walkedKm = 0, topSpd = 0;
            legs.forEach(function(l) {
                // drivenKm and walkedKm, not distanceKm: the two are reported
                // separately so walking never inflates the driven total.
                drivenKm += l.drivenKm || 0;
                walkedKm += l.walkedKm || 0;
                if (l.topSpeed > topSpd) topSpd = l.topSpeed;
            });

            const legsHtml = legs.length === 0
                ? '<div style="font-size:11px; color:#6b7280; font-style:italic; padding:6px 0;">No trips recorded for this date.</div>'
                : legs.map(function(leg, idx) {
                    const startT = new Date(leg.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const endT = new Date(leg.endTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const icon = leg.isDriving ? '🚗' : '🚶';
                    // Show the figure that matches the totals: driven km for a
                    // leg containing driving (with any walked part called out
                    // separately), otherwise the walked distance.
                    const distLabel = leg.isDriving
                        ? (leg.drivenKm || 0).toFixed(1) + ' km' + ((leg.walkedKm || 0) > 0.05 ? ' + ' + leg.walkedKm.toFixed(1) + ' walked' : '')
                        : leg.distanceKm.toFixed(1) + ' km walked';
                    return '' +
                        '<div class="leg-item" onclick="zoomToLeg(' + idx + ', \'' + devId + '\')">' +
                            '<div class="leg-header">' +
                                '<span>' + icon + ' Leg ' + (idx + 1) + '</span>' +
                                '<span class="mono" style="font-size:10px; color:#9ca3af;">' + startT + ' - ' + endT + '</span>' +
                            '</div>' +
                            '<div class="leg-metrics">' +
                                '<span>' + distLabel + '</span>' +
                                '<span>Max ' + Math.round(leg.topSpeed) + ' km/h</span>' +
                            '</div>' +
                        '</div>';
                }).join('');

            return '' +
                '<div class="stat-card">' +
                    '<div style="display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px;">' +
                        '<span>' + (EMOJI_MAP[devId] || '📍') + '</span><span>' + devId + '</span>' +
                        '<span class="mono" style="font-size:10px; color:#9ca3af; margin-left:auto;">' + dateStr + '</span>' +
                    '</div>' +
                    '<div class="stats-grid">' +
                        '<div class="stat-box"><div class="stat-val">' + drivenKm.toFixed(1) + '</div><div class="stat-lbl">Driven km</div></div>' +
                        '<div class="stat-box"><div class="stat-val">' + walkedKm.toFixed(1) + '</div><div class="stat-lbl">Walked km</div></div>' +
                        '<div class="stat-box"><div class="stat-val">' + Math.round(topSpd) + '</div><div class="stat-lbl">Top km/h</div></div>' +
                    '</div>' +
                    '<div class="legs-list">' + legsHtml + '</div>' +
                '</div>';
        }).join('');

        window._currentDayLegsCache = {};
        window._currentDayPingsCache = perDevice;
        DEVICES.forEach(function(devId) {
            // Cache the SAME list that was rendered, so leg indices line up
            // with what the user clicked.
            window._currentDayLegsCache[devId] = computeLegsForDay(perDevice[devId]);
        });

        // Draw the WHOLE day on the map (all legs together) -- not one leg.
        showDayOnMap(dateStr, perDevice);
    } catch (e) {
        listEl.innerHTML = '<div style="color:#ef4444; font-size:12px;">Failed to load trips: ' + (e.message || e) + '</div>';
    }
}

function zoomToLeg(idx, devId) {
    const legs = (window._currentDayLegsCache || {})[devId];
    if (!legs || !legs[idx]) return;
    const leg = legs[idx];

    // Draw the leg on the map as a review overlay -- the map itself only
    // ever shows TODAY's track, so a historical leg must be drawn here.
    if (reviewLegLayer) { map.removeLayer(reviewLegLayer); reviewLegLayer = null; }
    reviewLegLayer = L.polyline(leg.points, {
        color: DEVICE_COLORS[devId] || CONFIG.DEFAULT_DEVICE_COLOR,
        weight: leg.isDriving ? CONFIG.TRACK_WEIGHT_DRIVING : CONFIG.TRACK_WEIGHT_WALKING,
        opacity: leg.isDriving ? CONFIG.TRACK_OPACITY_DRIVING : CONFIG.TRACK_OPACITY_WALKING,
        dashArray: leg.isDriving ? null : CONFIG.WALK_TRACK_DASH_ARRAY,
        smoothFactor: 1.5
    }).addTo(map);

    switchView('map');
    map.fitBounds(reviewLegLayer.getBounds(), { padding: [40, 40] });
}

function exportCurrentDay(format) {
    if (format === 'kml' || format === 'csv') {
        const devId = selectedDevice || DEVICES[0];
        if (!devId) return;
        const url = '/way/api/export/' + format + '?device_id=' + encodeURIComponent(devId) + '&start=' + encodeURIComponent(selectedDateStr + 'T00:00:00Z') + '&end=' + encodeURIComponent(selectedDateStr + 'T23:59:59Z');
        window.open(url, '_blank');
        return;
    }

    const cache = window._currentDayPingsCache || {};
    let gpx = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="WAY">\n';
    let any = false;
    DEVICES.forEach(function(devId) {
        const devPings = (cache[devId] || []).filter(function(p) { return p.is_driving; }).sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });
        if (devPings.length < 2) return;
        any = true;
        gpx += '  <trk><name>' + devId + ' - ' + selectedDateStr + '</name><trkseg>\n';
        devPings.forEach(function(p) {
            gpx += '    <trkpt lat="' + p.latitude + '" lon="' + p.longitude + '"><time>' + p.timestamp + '</time></trkpt>\n';
        });
        gpx += '  </trkseg></trk>\n';
    });
    gpx += '</gpx>';
    if (!any) { alert('No driving data to export for this date.'); return; }

    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'way-' + selectedDateStr + '.gpx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

async function loadCurrentUser() {
    try {
        const resp = await fetch('/way/api/users/me', { credentials: 'include' });
        if (!resp.ok) return;
        const me = await resp.json();
        currentUser = { id: me.id, username: me.username, emoji: me.emoji, color: me.color, role: me.role };
        userPrefs.followZoom = (typeof me.followZoom === 'number') ? me.followZoom : CONFIG.FOLLOW_ZOOM_LEVEL;
        userPrefs.homeFence = me.homeFence || null;
    } catch (e) {}
}

function goHome() {
    if (!map) return;
    const f = userPrefs.homeFence ? GEOFENCES.find(function(g) { return g.name === userPrefs.homeFence; }) : null;
    const center = f ? [f.lat, f.lng] : CONFIG.MAP_DEFAULT_CENTER;
    ignoreZoomEvent = true;
    map.flyTo(center, CONFIG.MAP_DEFAULT_ZOOM, { duration: CONFIG.FOLLOW_FLY_DURATION });
    map.once('moveend', function() { ignoreZoomEvent = false; });
}

function applyHomeView() {
    if (!map || !userPrefs.homeFence) return;
    const f = GEOFENCES.find(function(g) { return g.name === userPrefs.homeFence; });
    if (f) {
        ignoreZoomEvent = true;
        map.setView([f.lat, f.lng], CONFIG.MAP_DEFAULT_ZOOM);
        ignoreZoomEvent = false;
    }
}

function resetToday() {
    DEVICES.forEach(function(devId) {
        devicePings[devId] = [];
        todayDist[devId] = 0;
    });
    clearTracks();
    clearAllStationaryDots();
    renderBadges();
    if (selectedDevice) updateSpeedoHUD();
}

function scheduleMidnightReset() {
    const nowMs = Date.now();
    const dayMs = 24 * 60 * 60 * 1000;
    const tzMs = (CONFIG.TZ_OFFSET_HOURS || 3) * 60 * 60 * 1000;
    const nairobiDayStart = Math.floor((nowMs + tzMs) / dayMs) * dayMs - tzMs;
    const msUntil = (nairobiDayStart + dayMs) - nowMs + 1000; // +1s past midnight
    setTimeout(function() {
        resetToday();
        scheduleMidnightReset();
    }, msUntil);
}

async function boot() {
    const ok = await loadDevicesAndGeofences();
    if (!ok) return;

    // Load the current user (profile + role + prefs) -- needed on a page
    // reload too, where currentUser is otherwise only set by submit.
    await loadCurrentUser();

    drawGeofenceCircles();
    document.getElementById('trips-date-input').value = selectedDateStr;

    connectWebSocket();
    applyHomeView();
    scheduleMidnightReset();

}

boot();

// Register the service worker so the app becomes installable (PWA/TWA-ready).
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/way/sw.js').catch(function() {});
    });
}
</script>
