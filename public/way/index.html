 * always fits inside it. On a portrait phone the shorter side is the width, so
 * this is exactly a diameter of 70% of the screen width; on a wide desktop map
 * it is the height, which is the side that would otherwise push the device off
 * the screen. */
/**
 * The camera, as a cycle rather than a chase. It never TRAILS the device:
 *
 *   DRIFT  the map is still. The device walks away from the middle of the
 *          screen, in any direction, until it leaves the roaming circle.
 *   PUSH   it keeps going for one push beat while the map still holds, so the
 *          edge registers as something it shoves through instead of a place it
 *          gets pinned to.
 *   PULL   the camera carries it from the edge it crossed to the OPPOSITE edge
 *          of the circle, overshooting its landing by a few percent.
 *
 * The cycle itself -- the phases, the circle it roams, WHERE a sweep lands
 * (opposite the crossing, a hair inside, never the mirrored exit offset), how
 * LONG it takes (a ratio off the drift just watched, not a fixed number of
 * seconds, floored for a device that was PLACED out there rather than drifting)
 * and the per-frame `panBy` that drives it -- lives in HomePlayback, SHARED
 * with the public live share, whose camera must behave identically. This page
 * keeps only what is its own: the follow-zoom preference and the flight that
 * enforces it, which the share has no equivalent of.
 */
function updateFollowCamera() {
    if (!map) return;
    if (!followDeviceId) return;
    const pos = markerPositions[followDeviceId];
    if (!pos) return;

    const nowMs = Date.now();
    if (map.getZoom() < userPrefs.followZoom && nowMs - followCam.lastZoomFix > CONFIG.FOLLOW_ZOOM_FIX_INTERVAL_MS) {
        followCam.lastZoomFix = nowMs;
        followDriver.holdUntil(nowMs + CONFIG.FOLLOW_FLY_DURATION * 1000);
        followDriver.notifyPlaced(nowMs);   // the flight re-centres on its own
        ignoreMapEvents();
        map.flyTo([pos.lat, pos.lng], userPrefs.followZoom, { duration: CONFIG.FOLLOW_FLY_DURATION });
        return;
    }
    if (followDriver.isHeld(nowMs)) return;

    followDriver.update(nowMs, pos);
}


/** Rebuild every device's drawn trail from its first point. This is the old
 * redrawAllTracks() behaviour -- and it used to run on EVERY ping, which is
 * precisely why the map could only ever jump. Now it is the rare path: a fresh
 * snapshot, the track eye switched back on, or a late `track` point that slots
 * in BEFORE the cursor, where a commit index stops meaning anything. The next
 * frame draws the identical geometry, plus whatever arrived. */
function resetTrail(devId) {
    clearDeviceTrack(devId);
    const st = trailFor(devId);
    st.drawnIdx = 0; st.runDriving = null; st.walkPts = null; st.walkLayer = null;
    st.tail = null; st.tailColor = null; st.tailAt = null; st.lastTs = null; st.lastPoint = null;
    delete markerPositions[devId];
}

function redrawAllTracks() {
    if (!map) return;
    for (const devId of DEVICES) resetTrail(devId);
    startPlaybackLoop();   // "redraw" now means "let the next frame draw it"
}

/** (Re)build a device's marker + tip dot. Placement itself belongs to the
 * playback loop, so this only has to run when the ICON changes (a profile save)
 * or when a device needs a marker for the first time. */
function updateMarker(devId, ping) {
    if (!map) return;
    if (!markerPositions[devId] && ping) markerPositions[devId] = { lat: ping.latitude, lng: ping.longitude };
    if (!buildMarker(devId)) return;
    const placed = markerPositions[devId];
    placeTip(devId, placed.lat, placed.lng, tipClass(ping || latestPing[devId]));
}

function updateTip(devId, ping) {
    const placed = markerPositions[devId];
    if (!map || !placed) return;
    placeTip(devId, placed.lat, placed.lng, tipClass(ping));
}

function selectSpeedoDevice(devId) {
    selectedDevice = devId;
    // The share row follows the map again: an explicit pick made while looking at
    // someone else must not outlive the view that produced it.
    sharePick = null;
    updateSpeedoHUD();
    // The gauge's subject is the selected device, so it has to be redrawn when
    // the camera moves -- a ping will not arrive on its own to do it.
    renderMeetStrip();
}

function followDevice(devId) {
    selectSpeedoDevice(devId);
    followDeviceId = devId;
    localStorage.setItem('follow_device', devId);
    renderBadges();
    // Fly to where the marker is DRAWN, not to the newest ping: the map is on
    // the playback clock, so centring on the live position would leave the
    // marker half a screen behind and make the camera chase it straight away.
    const drawn = markerPositions[devId];
    const p = latestPing[devId];
    const target = drawn || (p ? { lat: p.latitude, lng: p.longitude } : null);
    startPlaybackLoop();
    if (target && map) {
        // Following STARTS on the centre of the screen: that is the position
        // the cycle assumes at its start, and it is where you want the device
        // when you ask to follow it. The circle is measured from the middle of
        // the screen every time, so centring the view IS the target; the flight
        // just has to finish before the cycle may touch the camera.
        followDriver.holdUntil(Date.now() + CONFIG.FOLLOW_FLY_DURATION * 1000);
        followDriver.notifyPlaced(Date.now());   // the first drift is timed from here
        ignoreMapEvents();
        map.flyTo([target.lat, target.lng], userPrefs.followZoom, { duration: CONFIG.FOLLOW_FLY_DURATION });
    }
    renderBadges();
}

function updateSpeedoHUD() {
    const p = selectedDevice ? latestPing[selectedDevice] : null;
    const core = document.getElementById('hud-core');
    const meta = document.getElementById('hud-meta');
    const cad = document.getElementById('hud-cadence');
    const fresh = document.getElementById('hud-freshness');
    const isFollowingSelected = followDeviceId === selectedDevice && !!selectedDevice;
    const followStatusEl = document.getElementById('hud-follow-status');
    followStatusEl.style.display = isFollowingSelected ? 'inline-block' : 'none';
    if (isFollowingSelected) {
        followStatusEl.textContent = (EMOJI_MAP[followDeviceId] || CONFIG.DEFAULT_DEVICE_EMOJI) + ' Following';
    }

    const distEl = document.getElementById('hud-today-dist');
    if (selectedDevice) {
        const km = todayDist[selectedDevice] || 0;
        distEl.textContent = km.toFixed(1) + ' km today';
    } else {
        distEl.textContent = '-- km today';
    }

    if (!p) {
        core.innerHTML = '<div class="spd-num mono" style="color:#9ca3af; font-size:26px;">--</div><div class="spd-unit">Waiting</div>';
        fresh.className = 'badge-idle'; fresh.textContent = 'Waiting...';
        meta.textContent = '--';
        meta.title = '';
        cad.textContent = '-- ago';
        return;
    }

    // Health slot: battery when the tracker reports it, otherwise GPS accuracy
    // (see accuracyLabel). "n/a" was neither - it was a permanent reminder that
    // the field is empty, in a slot that could be saying something true.
    const acc = accuracyLabel(p.accuracy);
    if (p.battery !== null && p.battery !== undefined) {
        meta.textContent = p.battery + '%';
        meta.title = 'Battery';
    } else if (acc) {
        meta.textContent = acc;
        meta.title = 'GPS accuracy — µlogger does not report battery';
    } else {
        meta.textContent = '—';
        meta.title = 'No battery or accuracy reported';
    }

    // Clock skew: a phone a second ahead of the viewer yields a NEGATIVE age,
    // which printed as "-1s ago". Clamp, and call the first second "now".
    const diffSec = Math.max(0, (Date.now() - new Date(p.timestamp).getTime()) / 1000);
    if (diffSec < 120) { fresh.className = 'badge-live'; fresh.textContent = 'Live'; }
    else {
        const mins = Math.floor(diffSec / 60);
        fresh.className = 'badge-idle';
        fresh.textContent = mins > 60 ? (Math.floor(mins/60) + 'h ago') : (mins + 'm ago');
    }
    cad.textContent = diffSec < 60 ? (diffSec < 1 ? 'now' : Math.round(diffSec) + 's ago') : (Math.round(diffSec/60) + 'm ago');

    if (p.is_inside_geofence || p.is_stationary) {
        core.innerHTML = '<div class="spd-emoji">@</div><div class="spd-unit">' + (p.is_inside_geofence ? getDisplayName(p.geofence_name) : 'Stationary') + '</div>';
        return;
    }

    const spd = (p.speed === null || p.speed === undefined || p.speed < 0) ? null : Math.round(p.speed);
    if (spd === null) {
        core.innerHTML = '<div class="spd-num mono" style="color:#9ca3af; font-size:29px;">--</div><div class="spd-unit">No signal</div>';
    } else {
        const colorClass = speedColor(spd);
        core.innerHTML = '<div class="spd-num mono" style="color:' + colorClass + ';">' + spd + '</div><div class="spd-unit">km/h</div>';
    }
}

// ── The meeting ETA (VISUAL ONLY) ───────────────────────────────
// The pill above answers "how far to the place". This answers the question the
// map could not answer at all: "when will the two of you cross".
//
// Every rule in here was priced in scripts/one-off/2026-09-24-meet-eta-lab
// against a fixture whose geometry is known by construction -- the lab's README
// and check-maths.mjs say which gate each line below buys. The three that are
// not obvious, all three measured rather than assumed:
//
//   * Each side's velocity is derived from that device's OWN last two fixes,
//     never from the speed column it reports. A phone whose speed is wrong would
//     otherwise be believed twice: once for how fast it is going, and once for
//     which way it is pointed.
//   * `settled` (MEET_ETA_SETTLED_M): at two kilometres out, ±6 m of fix noise
//     swings the predicted miss distance by hundreds of metres, so the estimate
//     is fiction at range and true up close. The pill stays dark until they are
//     closer than this -- the lab's first false positive was a pair 2.1 km apart
//     that was going to "miss by 39 m" and actually passed 464 m wide.
//   * The fence rule counts a peer inside a fence as HOME only if it is also not
//     moving. The stricter reading ("neither peer inside any fence") silenced
//     fifteen seconds in the MIDDLE of a real meet, because every driver is
//     inside their own home fence for the first minute of a trip.
//
// A parked subject is not representable here on purpose: the map only keeps
// moving fixes (shouldDrawPoint), so a phone that is not going anywhere has no
// velocity to derive. Same reason the fence pill needs a moving device.

/** Compass bearing (0 = north, clockwise) of a local-frame velocity vector. */
function bearingOfVector(x, y) {
    return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
}

/** Velocity of one device in metres per second (x east, y north), from its OWN
 *  last two fixes. Null when those two cannot give a velocity at all: no history,
 *  a gap, or a jump no vehicle could have made. Reported speed is never used --
 *  the ping carries a speed column and it is wrong often enough that believing it
 *  here would be believing one bad number twice. */
function meetVelocity(pts) {
    if (!pts || pts.length < 2) return null;
    const prev = pts[pts.length - 2], cur = pts[pts.length - 1];
    const dt = (new Date(cur.timestamp).getTime() - new Date(prev.timestamp).getTime()) / 1000;
    if (!(dt > 0) || dt > CONFIG.MEET_ETA_MAX_GAP_S) return null; // a gap is not a velocity
    const ky = 110540, kx = 111320 * Math.cos(cur.latitude * Math.PI / 180);
    const x = (cur.longitude - prev.longitude) * kx / dt;
    const y = (cur.latitude - prev.latitude) * ky / dt;
    const kmh = Math.sqrt(x * x + y * y) * 3.6;
    if (kmh > CONFIG.MEET_ETA_TELEPORT_KMH) return null; // a bad fix is not motion
    return { x: x, y: y, kmh: kmh, fix: cur };
}

/** THE verdict: are these two about to cross, already together, or neither? The
 *  pill and the gauge below both ask this and nothing else, so the two can never
 *  disagree about the same pair -- which is the whole reason it is one function
 *  rather than two copies of the gates. Returns the numbers either way (a silent
 *  pair still has a range and a closing rate), with `verdict` null when the pair
 *  is not one to show. */
/** The rate the range between two fixes is changing, in km/h, POSITIVE while it
 *  shrinks. ONE formula for the whole feature: the verdict below gates on it ("not
 *  closing is not a meeting") and the bar's trend arrow is the same number pointed
 *  at -- if the two ever disagreed, the bar would say "closing" for a pair the pill
 *  had just called off. `vb` is {x:0,y:0} for anything with no velocity of its own
 *  (a fence), which is how "am I getting closer to this place" is asked. */
function rangeRateKmh(aFix, bFix, va, vb) {
    const kx = 111320 * Math.cos(aFix.latitude * Math.PI / 180), ky = 110540;
    const rx = (bFix.longitude - aFix.longitude) * kx, ry = (bFix.latitude - aFix.latitude) * ky;
    const range = Math.sqrt(rx * rx + ry * ry);
    if (range < 0.5) return 0;
    return -(((rx * (vb.x - va.x)) + (ry * (vb.y - va.y))) / range) * 3.6;
}

/** A device's own velocity for the meeting maths, or null when it is not a
 *  participant at all: not driving by the map's own record (is_driving, the state
 *  machine's answer), or no velocity that can be derived from its fixes. The pill
 *  and the bar's crossing tick both start here, so the two cannot disagree about
 *  who is in a meeting. */
function meetParticipantVelocity(deviceId) {
    const p = latestPing[deviceId];
    if (!p || !p.is_driving) return null;
    const v = meetVelocity(devicePings[deviceId]);
    return (v && v.kmh >= CONFIG.ETA_MIN_SPEED_KMH) ? v : null;
}

function meetDecision(mine, theirs) {
    if (!mine || !theirs) return null;
    const now = Date.now();
    // The badge's staleness rule: a five minute old fix is a memory of where
    // somebody was, and a promise about the next few seconds is not built on one.
    const fresh = function(v) { return now - new Date(v.fix.timestamp).getTime() <= CONFIG.MEET_ETA_FRESH_S * 1000; };
    if (!fresh(mine) || !fresh(theirs)) return null;
    // HOME, not merely "inside a fence": a peer parked in a fence is not about
    // to meet anybody, while a peer driving through one is.
    if (theirs.fix.is_inside_geofence && theirs.kmh < CONFIG.ETA_MIN_SPEED_KMH) return null;

    const kx = 111320 * Math.cos(mine.fix.latitude * Math.PI / 180), ky = 110540;
    const r = {
        x: (theirs.fix.longitude - mine.fix.longitude) * kx,
        y: (theirs.fix.latitude - mine.fix.latitude) * ky
    };
    const range = Math.sqrt(r.x * r.x + r.y * r.y);
    // Inside the together radius the peer pill owns the moment; the two pills
    // saying the same thing to the same pair is what this prevents.
    if (range <= CONFIG.TOGETHER_DISTANCE_M) {
        return { verdict: 'together', range: range, closing: 0, tcaS: 0, dcpa: range };
    }

    const v = { x: theirs.x - mine.x, y: theirs.y - mine.y };
    const vv = v.x * v.x + v.y * v.y;
    const rv = r.x * v.x + r.y * v.y;
    const tcaS = vv > 0.01 ? Math.max(0, -rv / vv) : 0;
    const closing = rangeRateKmh(mine.fix, theirs.fix, mine, theirs); // km/h, positive while they close
    // Closest point of approach: how near they WILL get, not how near they are.
    // That one number is what separates a meeting from two people on parallel
    // roads 473 m apart, both pointed straight at each other.
    const dcpa = Math.sqrt(Math.pow(r.x + v.x * tcaS, 2) + Math.pow(r.y + v.y * tcaS, 2));
    const out = { verdict: null, range: range, closing: closing, tcaS: tcaS, dcpa: dcpa };

    // The gates, each one a defect the lab measured rather than a precaution.
    if (range > CONFIG.MEET_ETA_SETTLED_M) return out;
    if (tcaS > CONFIG.MEET_ETA_MAX_MIN * 60) return out;
    if (closing < CONFIG.MEET_ETA_CLOSING_MIN_KMH) return out;
    if (dcpa > CONFIG.MEET_ETA_DCPA_MAX_M) return out;
    // Every side that is MOVING has to be pointed at the other. Not a formality
    // in either direction: without it an overtake closes at 15 km/h with only one
    // of them pointed at the other, and with it alone a parallel-road pair passes.
    const myToThem = bearingDegrees(mine.fix.latitude, mine.fix.longitude, theirs.fix.latitude, theirs.fix.longitude);
    if (angularDiff(bearingOfVector(mine.x, mine.y), myToThem) > CONFIG.ETA_MAX_BEARING_DIFF_DEG) return out;
    if (theirs.kmh >= CONFIG.ETA_MIN_SPEED_KMH &&
        angularDiff(bearingOfVector(theirs.x, theirs.y), (myToThem + 180) % 360) > CONFIG.ETA_MAX_BEARING_DIFF_DEG) return out;
    out.verdict = 'meet';
    return out;
}

/** The best meeting the SELECTED device is heading into, or null. Only that
 *  device is ever the subject: the pill says what is about to happen to the
 *  person you are watching. Of the pairs that pass, it reports the soonest
 *  crossing -- an upcoming one is what a countdown is for. */
function meetEtaFor(deviceId) {
    const mine = meetParticipantVelocity(deviceId);
    if (!mine) return null;
    let best = null;

    for (let i = 0; i < DEVICES.length; i++) {
        const otherId = DEVICES[i];
        if (otherId === deviceId) continue;
        const d = meetDecision(mine, meetVelocity(devicePings[otherId]));
        // Of the pairs that pass, the SOONEST crossing: an upcoming one is what a
        // countdown is for, and two peers converging both matter.
        if (d && d.verdict === 'meet' && (!best || d.tcaS < best.tcaS)) {
            best = { peerId: otherId, tcaS: d.tcaS, dcpa: d.dcpa, range: d.range, closing: d.closing };
        }
    }
    return best;
}

/** Draws the meeting pill: the person, when, and the two numbers behind it.
 *  Named "Meeting" and worn in green rather than the fence pill's sky, because
 *  the title has to say which of the two subjects the pill is about. */
function showMeetPill(eta) {
    const etaEl = document.getElementById('eta-pill');
    const when = eta.tcaS <= 60 ? 'in &lt;1 min' : 'in ~' + Math.round(eta.tcaS / 60) + ' min';
    const gap = eta.range >= 1000 ? (eta.range / 1000).toFixed(1) + ' km' : Math.round(eta.range) + ' m';
    etaEl.className = 'meet';
    etaEl.innerHTML =
        '<span>Meeting</span>' +
        '<span class="eta-dest">' + eta.peerId + ' ' + when + '</span>' +
        '<span class="eta-sub">' + gap + ' · passing ' + Math.round(eta.dcpa) + ' m away</span>';
    etaEl.style.display = 'flex';
}

// ── The distance gauge under the map (VISUAL ONLY) ───────────────
// Three zones, left to right: WHAT it measures to, the bar, and the numbers (the
// scale the bar represents, then the exact distance).
//
// Which way the bar runs is a decision, not an accident: the FAR end of the
// current scale is on the left and the watched device is on the right, so the fill
// GROWS as the two of them close and DRAINS as they part. One glance then answers
// the only question a distance gauge is asked -- approaching or separating --
// before any number is read. It was drawn the other way round first, filling with
// the distance, which made a widening gap look like the bar filling up.
//
// Why this instead of the timeline it replaces: a crossing is only ever the last
// 60-90 s of a trip (that is what `settled` buys), so a timeline was empty at
// every other moment -- which is most of them -- while the question people
// actually ask ("how far is he?") had no answer on screen at all. A gauge answers
// it at every range, including the ranges where the pill is deliberately dark.
//
// What it measures TO is the user's: the name on the bar opens a list of every
// person and place, NEAREST FIRST from the device being watched, and one of them
// can be picked and left picked (persisted). Until something is picked -- or after
// it is cleared -- the fallback is the switch in Settings -> Map: the nearest
// PERSON, or the nearest PLACE in the list. Place mode deliberately drops the HUD
// pill's direction test -- "Heading toward X" is about which way you are pointed,
// and a ruler that hid what is behind you would not be a ruler -- and it measures
// to the fence centre, the same thing that pill counts down.
//
// Two more deliberate differences from the pill, both about honesty:
//   * A STALE peer still draws. The pill goes silent on an old fix because it is
//     a promise about the next few seconds; "he was 3 km away, four minutes ago"
//     is still a reading, so the gauge draws it and says the age beside it.
//   * The scale GROWS at once and shrinks reluctantly (MEET_STRIP_SHRINK_AT).
//     Without the second half, a distance sitting on a rung boundary rescales the
//     whole bar on every fix -- ±6 m of GPS noise crosses 1,000 m repeatedly.
//
// A PICKED reference is the point of the whole thing: the bar stops following
// whoever is nearest and answers about one person or place, so the distance can
// grow as well as shrink while you drive -- and the trend arrow beside the reading
// says which way it is going, which position alone (always near the end of the
// scale) cannot. The bar's own crossing (green name, red tick) is asked about ITS
// two ends, which while something is picked may be a pair the pill is not talking
// about; bar and pill both go through meetDecision, so they cannot disagree about
// a pair they share.
let meetStripScaleIdx = 0;    // remembered between renders; the ladder walk needs it
let meetStripScaleKey = null; // ...and WHICH subject that rung was chosen for

/** Every rung of the ladder, bottom-up, from the bands in CONFIG. "Snap to a
 *  multiple of 1 km" is why a 1.1 km distance reads on a 2 km bar: a rung is the
 *  smallest one that still CONTAINS the distance. */
function meetStripLadder() {
    const out = [];
    let top = 0;
    for (const band of CONFIG.MEET_STRIP_BANDS_M) {
        for (let v = Math.ceil((top + 1) / band[1]) * band[1]; v <= band[0]; v += band[1]) out.push(v);
        top = Math.max(top, band[0]);
    }
    return out;
}
const MEET_STRIP_LADDER = meetStripLadder();

/** The rung this distance sits on, with hysteresis: up at once, down only once
 *  the distance is comfortably inside the rung below. The memory is per SUBJECT
 *  (`subjectKey`), not global -- see the reset inside. */
function meetStripScale(dist, subjectKey) {
    // A DIFFERENT subject starts fresh. The hysteresis below is about ONE distance
    // wobbling on a boundary; carried across a change of reference it drew a 100 m
    // pick as 1% of a 10 km bar and then walked down one rung per fix.
    if (subjectKey !== meetStripScaleKey) { meetStripScaleKey = subjectKey; meetStripScaleIdx = 0; }
    const L = MEET_STRIP_LADDER;
    let i = Math.max(0, Math.min(meetStripScaleIdx, L.length - 1));
    while (i < L.length - 1 && dist > L[i]) i++;                        // grows at once
    while (i > 0 && dist < L[i - 1] * CONFIG.MEET_STRIP_SHRINK_AT) i--;  // shrinks only well inside
    meetStripScaleIdx = i;
    return L[i];
}

/** The fill: what fraction of the CURRENT SCALE is closed. 0 when the distance is
 *  at the top of the bar's scale -- nothing gained yet -- and 1 when it is zero.
 *  Its complement is how far along the bar the flashed reference sits, which is
 *  why the dot rides the fill's head: the number beside the bar, the head and the
 *  shaded part are then one reading of the same fact ("3.1 km of a 4 km bar" is a
 *  quarter full), not three.
 *
 *  Rescaling is what the fill pays for the scale's own hysteresis: the rung grows
 *  the instant the distance outgrows it and shrinks at 0.75x the one below, so a
 *  rescale steps the fill (down to a quarter when closing, up to a half when
 *  parting, on the fine rungs) at the same moment the scale label changes. That
 *  step is the price of a bar that always means "of the scale shown", and it is
 *  why the exact distance is printed rather than implied. */
function meetStripFillFraction(dist, scale) {
    return Math.max(0, Math.min(1, 1 - dist / Math.max(1, scale)));
}

/** How far INTO ITS RUNG a distance sits: 0 when the distance is as small as this
 *  rung's step allows, 1 when it is at the top of the rung. This one drives the
 *  COLOUR, not the fill (meetStripFillFraction does that): read off the whole
 *  scale instead and the colour barely moves -- hysteresis keeps the distance in
 *  the top half of the bar's scale at every real range, so a scale-wide ramp is
 *  amber at 500 m and amber at 50 km and says nothing. Rung-relative it sweeps
 *  green to amber on every rung instead, and since it is driven by the same
 *  distance it still moves WITH the fill (green as the bar grows, amber as it
 *  drains) even though the two fractions are not the same number. */
function meetStripCloseness(dist, i) {
    const L = MEET_STRIP_LADDER;
    const prev = i > 0 ? L[i - 1] : 0;
    return Math.max(0, Math.min(1, (dist - prev) / Math.max(1, L[i] - prev)));
}

/** Closeness -> colour, as "r,g,b": green at 0, amber at 1. */
function meetStripTint(t) {
    const green = [46, 204, 113], amber = [245, 196, 81];
    const mix = function(k) { return Math.round(green[k] + (amber[k] - green[k]) * t); };
    return mix(0) + ',' + mix(1) + ',' + mix(2);
}

/** The scale as it is written on the bar. */
function meetStripScaleLabel(m) {
    if (m < 1000) return m + ' m';
    return (m % 1000 === 0 ? (m / 1000) : (m / 1000).toFixed(1)) + ' km';
}

/** The bar's own reading of a distance, in ONE place: the leaf beside the bar and
 *  the picker's rows must not round the same number two different ways. */
function meetStripDistanceLabel(m) {
    if (m === null || m === undefined || !isFinite(m)) return '--';
    return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';
}

/** The bar's far end when the user has PICKED one thing to measure to, or null for
 *  Auto. A pick that cannot be resolved right now -- a peer that has not reported
 *  since the reload, a place that left the list -- still comes back, with dist
 *  null, rather than quietly falling through to the nearest: a bar that silently
 *  measured somebody else would make the picker look broken, and the bar is the
 *  only place a pick can be cleared from. */
function stripRefTarget(deviceId) {
    if (!stripRef) return null;
    const mine = latestPing[deviceId];
    if (!mine) return null;
    const gap = function(lat, lng) { return distanceMeters(mine.latitude, mine.longitude, lat, lng); };
    if (stripRef.kind === 'fence') {
        const f = GEOFENCES.filter(function(g) { return g.name === stripRef.id; })[0];
        if (!f) return { kind: 'fence', id: stripRef.id, name: stripRef.id, dist: null, lat: null, lng: null };
        return { kind: 'fence', id: f.name, name: getDisplayName(f.name), dist: gap(f.lat, f.lng), lat: f.lat, lng: f.lng };
    }
    const theirs = latestPing[stripRef.id];
    if (!theirs) return { kind: 'user', id: stripRef.id, name: stripRef.id, dist: null, at: null, lat: null, lng: null };
    return {
        kind: 'user', id: stripRef.id, name: stripRef.id, at: theirs.timestamp,
        lat: theirs.latitude, lng: theirs.longitude,
        dist: gap(theirs.latitude, theirs.longitude)
    };
}

/** The crossing between the bar's OWN two ends, or null. The pill asks the same
 *  verdict (meetDecision) about the pair IT is about; this is the bar asking about
 *  its own pair, which is a different one the moment a reference is pinned -- and a
 *  tick borrowed from the pill's pair would mark a bar whose dot is somebody else.
 *  Both start from the same participant test, so they cannot disagree about who is
 *  in a meeting at all. */
function meetStripCrossPair(deviceId, pairId) {
    const mine = meetParticipantVelocity(deviceId);
    if (!mine) return null;
    const d = meetDecision(mine, meetVelocity(devicePings[pairId]));
    return (d && d.verdict === 'meet') ? d : null;
}

/** Which way the gap is MOVING: 'closing' while the range shrinks, 'opening' while
 *  it grows, 'flat' when the change is under MEET_STRIP_TREND_KMH, and null when
 *  there is no honest velocity to read. Deliberately the same range rate the verdict
 *  gates on (rangeRateKmh), so a bar saying "closing" cannot be showing a pair the
 *  pill has just refused for not closing. A place has no velocity of its own, so its
 *  rate is my own motion along the line to it -- which is what "getting closer to
 *  Anjohy" means. */
function meetStripTrend(deviceId, target) {
    if (!target || target.dist === null || target.lat === null) return null;
    const mine = meetVelocity(devicePings[deviceId]);
    // A rate from five minutes ago is not a rate. The bar draws a stale DISTANCE and
    // prints its age, but it will not draw a stale DIRECTION as if it were current.
    if (!mine || Date.now() - new Date(mine.fix.timestamp).getTime() > CONFIG.MEET_ETA_FRESH_S * 1000) return null;
    let theirs = { x: 0, y: 0 };
    if (target.kind === 'user') {
        theirs = meetVelocity(devicePings[target.id]);
        if (!theirs) return null;
    }
    const rate = rangeRateKmh(mine.fix, { latitude: target.lat, longitude: target.lng }, mine, theirs);
    if (Math.abs(rate) < CONFIG.MEET_STRIP_TREND_KMH) return 'flat';
    return rate > 0 ? 'closing' : 'opening';
}

/** The picker's rows, as DATA: Auto first, then every other person, then every
 *  place, nearest first in each group and anything with no fix at the end of its
 *  group. It sorts from the position of the device being WATCHED -- "everything
 *  from where you are now" can only mean one of the two -- and it is pure on
 *  purpose, so the DOM half below is thin enough to read and this half can be run.
 *  A tie keeps the list order (sort is stable), so the list does not shuffle under
 *  a finger between two fixes. */
function stripPickerRows(deviceId) {
    const mine = latestPing[deviceId];
    const from = mine ? function(lat, lng) { return distanceMeters(mine.latitude, mine.longitude, lat, lng); } : null;
    const row = function(kind, id, name, dist, at, active) {
        return { kind: kind, id: id, name: name, dist: dist, at: at || null, active: !!active };
    };
    const pinnedUser = stripRef && stripRef.kind === 'user' ? stripRef.id : null;
    const pinnedFence = stripRef && stripRef.kind === 'fence' ? stripRef.id : null;
    const people = [];
    for (let i = 0; i < DEVICES.length; i++) {
        const id = DEVICES[i];
        if (id === deviceId) continue;
        const theirs = latestPing[id];
        people.push(row('user', id, id, (theirs && from) ? from(theirs.latitude, theirs.longitude) : null, theirs ? theirs.timestamp : null, pinnedUser === id));
    }
    const places = [];
    for (const f of GEOFENCES) {
        places.push(row('fence', f.name, getDisplayName(f.name), from ? from(f.lat, f.lng) : null, null, pinnedFence === f.name));
    }
    // Nothing to measure to goes last.
    const byNearest = function(a, b) {
        if (a.dist === null && b.dist === null) return 0;
        if (a.dist === null) return 1;
        if (b.dist === null) return -1;
        return a.dist - b.dist;
    };
    people.sort(byNearest);
    places.sort(byNearest);
    const autoList = stripSourceMode === 'fence' ? places : people;
    return {
        autoLabel: stripSourceMode === 'fence' ? 'nearest place' : 'nearest person',
        auto: autoList.length ? autoList[0] : null,
        people: people,
        places: places
    };
}

/** The panel itself: Auto, then the two groups, each row a button. Rebuilt on each
 *  ping while it is open, so the distances in it are the ones on the bar. */
function renderStripPicker() {
    const el = document.getElementById('strip-picker');
    if (!el) return;
    const rows = stripPickerRows(selectedDevice);
    const meta = function(r) {
        if (r.dist === null) return 'no fix';
        let out = meetStripDistanceLabel(r.dist);
        // A menu is not a promise: an old fix is still worth listing, but its age
        // goes with it -- the same rule the bar itself follows.
        const ageS = r.at ? Math.max(0, Math.round((Date.now() - new Date(r.at).getTime()) / 1000)) : 0;
        if (ageS > CONFIG.MEET_ETA_FRESH_S) out += ' · ' + (ageS >= 90 ? Math.round(ageS / 60) + 'm' : ageS + 's');
        return out;
    };
    const rowHtml = function(kind, id, label, r) {
        return '<button class="pick-row' + (r.active ? ' active' : '') + '" data-kind="' + escapeHtml(kind) +
            '" data-id="' + escapeHtml(id) + '" title="' +
            escapeHtml((r.active ? 'Stop measuring to ' : 'Measure the bar to ') + label) + '">' +
            '<span class="pick-name">' + escapeHtml(label) + '</span>' +
            '<span class="pick-meta">' + escapeHtml(meta(r)) + '</span>' +
            (r.active ? '<span class="pick-x">✕</span>' : '') + '</button>';
    };
    let html = '<div class="pick-title">Bar measures to</div>';
    html += rowHtml('auto', '', 'Auto · ' + rows.autoLabel, {
        dist: rows.auto ? rows.auto.dist : null, at: rows.auto ? rows.auto.at : null, active: !stripRef
    });
    if (rows.people.length) {
        html += '<div class="pick-title">People</div>';
        for (const r of rows.people) html += rowHtml('user', r.id, (EMOJI_MAP[r.id] || '📍') + ' ' + r.name, r);
    }
    if (rows.places.length) {
        html += '<div class="pick-title">Places</div>';
        for (const r of rows.places) html += rowHtml('fence', r.id, '🏠 ' + r.name, r);
    }
    el.innerHTML = html;
}

/** Opening and closing is the bar's own business: a pick or a deactivation closes
 *  it, a tap anywhere else closes it, and so does Escape. */
function toggleStripPicker() {
    const el = document.getElementById('strip-picker');
    if (!el) return;
    if (el.classList.contains('open')) { closeStripPicker(); return; }
    renderStripPicker();   // fresh distances on every open
    el.classList.add('open');
    const who = document.getElementById('meet-strip-who');
    if (who) who.setAttribute('aria-expanded', 'true');
}

function closeStripPicker() {
    const el = document.getElementById('strip-picker');
    if (el) el.classList.remove('open');
    const who = document.getElementById('meet-strip-who');
    if (who) who.setAttribute('aria-expanded', 'false');
}

/** One listener for every row, DELEGATED: the list is rebuilt on each ping while
 *  it is open, so a listener bound to a row would be bound to a node that no longer
 *  exists by the time the finger lifts. Tapping the row that is ALREADY the
 *  reference clears it -- the same thing the ✕ and the Auto row do, because a finger
 *  looking for "off" tries the lit-up one first. */
function stripPickerClick(ev) {
    const row = ev.target && ev.target.closest ? ev.target.closest('.pick-row') : null;
    if (!row) return;
    const kind = row.getAttribute('data-kind');
    if (kind === 'auto' || row.classList.contains('active')) { deactivateStripRef(); return; }
    pickStripRef(kind, row.getAttribute('data-id'));
}

/** Any click that is not on the bar or its panel closes the panel. */
function stripPickerAway(ev) {
    const el = document.getElementById('strip-picker');
    if (!el || !el.classList.contains('open')) return;
    const strip = document.getElementById('meet-strip');
    if (strip && ev.target && strip.contains(ev.target)) return;
    closeStripPicker();
}

/** Point the bar at one person or place. Persisted, because it is a decision about
 *  WHICH question the map answers rather than a one-off. */
function pickStripRef(kind, id) {
    if (!id || (kind !== 'user' && kind !== 'fence')) return;
    stripRef = { kind: kind, id: String(id) };
    persistStripRef();
    closeStripPicker();
    renderMeetStrip();
}

/** Back to Auto: the nearest person or place, per the switch in Settings -> Map. */
function deactivateStripRef() {
    stripRef = null;
    persistStripRef();
    closeStripPicker();
    renderMeetStrip();
}

function persistStripRef() {
    try {
        if (stripRef) localStorage.setItem('map_strip_ref', JSON.stringify(stripRef));
        else localStorage.removeItem('map_strip_ref');
    } catch (e) {}
}

/** What the far end of the bar is, in order: the reference the user PICKED (if
 *  any), then the pill's own peer while the pill is up (so the ticking crossing and
 *  the dot agree), then the nearest one on the current source. Null when there is
 *  nothing to measure to. */
function meetStripTarget(deviceId, preferId) {
    const mine = latestPing[deviceId];
    if (!mine) return null;
    const from = function(lat, lng) { return distanceMeters(mine.latitude, mine.longitude, lat, lng); };

    // 1. The pick wins over everything, including the pill's peer: it is the thing
    //    the user actually chose, and a bar that abandoned it the moment somebody
    //    else converged would answer a question nobody asked.
    const pinned = stripRefTarget(deviceId);
    if (pinned) return pinned;

    // 2. Auto, per the switch: the nearest place...
    if (stripSourceMode === 'fence') {
        let best = null;
        for (const f of GEOFENCES) {
            const dist = from(f.lat, f.lng);
            if (!best || dist < best.dist) best = { kind: 'fence', id: f.name, name: getDisplayName(f.name), dist: dist, lat: f.lat, lng: f.lng };
        }
        return best;
    }

    const at = function(id) {
        const theirs = latestPing[id];
        if (!theirs) return null;
        return {
            kind: 'user', id: id, name: id, at: theirs.timestamp,
            lat: theirs.latitude, lng: theirs.longitude,
            dist: from(theirs.latitude, theirs.longitude)
        };
    };
    // ...or the pill's own peer while the pill is up, so the tick and the dot agree.
    if (preferId) { const p = at(preferId); if (p) return p; }
    let best = null;
    for (let i = 0; i < DEVICES.length; i++) {
        if (DEVICES[i] === deviceId) continue;
        const p = at(DEVICES[i]);
        if (p && (!best || p.dist < best.dist)) best = p;
    }
    return best;
}

// ── The bar's direction half ────────────────────────────────────
// The bar answers "how far is Home / Niri"; this answers "which way", which is
// the other half of the same question and the only place on the screen it can be
// answered from. It is drawn TWICE from ONE bearing:
//
//   * a chip on the bar -- an arrow rotated to the true angle, plus the compass
//     point spelled out, tinted with the bar's own closeness colour, so the
//     direction arrives in the same colour language as the fill and the dot;
//   * an arrow on the map, from the DEVICE's drawn position, dashed, with a head
//     at the tip.
//
// THREE THINGS ABOUT IT ARE DELIBERATE, and each one is a way of lying that this
// refuses:
//
//   * The line starts at `markerPositions` -- the playback cursor the dot rides
//     -- and not at the raw live ping, because an arrow that starts somewhere
//     other than the dot reads as two devices. The bearing is therefore a
//     heading from where the device is DRAWN, which on Live pace is the same
//     thing and on Smooth is the honest reading of the same dot.
//   * The bearing is a straight line of CONSTANT bearing (pointAhead), not a
//     route: nothing here knows about roads, and an arrow that bent would be
//     promising one.
//   * Under CONFIG.DIRECTION_MIN_M the chip and the arrow both stand down (see
//     the constant). The bar keeps measuring; only the direction is withheld.

function clearDirection() {
    if (!map) return;
    directionLayers.forEach(function(l) { map.removeLayer(l); });
    directionLayers = [];
}

/** Set BOTH halves of the direction from one bearing, or clear them both when
 *  there is nothing honest to point at (no subject, no fix for it, or the two of
 *  them closer than CONFIG.DIRECTION_MIN_M). `tint` is the bar's own closeness
 *  colour, already computed by the caller, so the chip, the map arrow, the dot
 *  and the fill are one colour family for one reading. */
function renderDirection(deviceId, target, tint) {
    const chip = document.getElementById('meet-strip-bearing');
    const mine = markerPositions[deviceId] ||
        (latestPing[deviceId] ? { lat: latestPing[deviceId].latitude, lng: latestPing[deviceId].longitude } : null);
    const hasPoint = !!target && typeof target.lat === 'number' && typeof target.lng === 'number';
    const usable = !!mine && hasPoint && typeof target.dist === 'number' &&
        target.dist >= CONFIG.DIRECTION_MIN_M;
    if (!usable) {
        if (chip) chip.style.display = 'none';
        clearDirection();
        return;
    }

    const brg = bearingDegrees(mine.lat, mine.lng, target.lat, target.lng);
    const point = compassPoint(brg);
    const paint = 'rgb(' + (tint || '56,189,248') + ')';

    if (chip) {
        // The arrow is rotated about its own centre, so 0deg is north and the
        // glyph is never mirrored; the letters beside it are what makes the
        // bearing readable without turning the phone.
        chip.style.display = 'flex';
        chip.style.color = paint;
        document.getElementById('meet-strip-bearing-arrow').style.transform = 'rotate(' + brg.toFixed(1) + 'deg)';
        document.getElementById('meet-strip-bearing-text').textContent = point;
        chip.title = target.name + ' is ' + Math.round(brg) + '\u00b0 (' + point + ') from ' + deviceId +
            ' \u00b7 the arrow on the map starts at ' + deviceId + '\'s dot';
    }

    if (!map) return;
    clearDirection();
    const tip = pointAhead(mine.lat, mine.lng, brg, Math.min(target.dist, CONFIG.DIRECTION_MAX_M));
    directionLayers = [
        L.polyline([[mine.lat, mine.lng], [tip.lat, tip.lng]], {
            color: paint, weight: 2, opacity: 0.8, dashArray: '2, 8', interactive: false
        }).addTo(map),
        // The head is a MARKER, not a polyline decoration: Leaflet polylines have
        // no arrowhead, and the tip is also the one thing that has to stay
        // readable when the line's far end is off screen.
        L.marker([tip.lat, tip.lng], {
            icon: L.divIcon({
                className: '',
                html: '<div class="direction-head" style="color:' + paint + ';transform: rotate(' +
                    (brg - 90).toFixed(1) + 'deg)">\u27a4</div>',
                iconSize: [18, 18], iconAnchor: [9, 9]
            }),
            interactive: false, keyboard: false
        }).addTo(map)
    ];
}

function renderMeetStrip(eta) {
    const el = document.getElementById('meet-strip');
    if (!el) return;
    // The pill's own answer comes first: while it is up, the bar runs to ITS peer.
    // The caller hands `eta` in so the two are the SAME object on the same tick;
    // this default is for the callers that have no pill to draw (a device switch).
    if (eta === undefined) eta = selectedDevice ? meetEtaFor(selectedDevice) : null;
    const target = selectedDevice ? meetStripTarget(selectedDevice, eta ? eta.peerId : null) : null;

    // The bar is where the PICKER lives, so it does not disappear just because the
    // nearest thing on the current source has no fix: with nobody reporting, the
    // list still holds every place, and hiding the bar would hide the only way to
    // point it at one. It stands down only when the watched device itself has no
    // fix (nothing to measure FROM) or the list is empty.
    const anyTarget = DEVICES.length > 1 || GEOFENCES.length > 0;
    const show = !!target || (!!latestPing[selectedDevice] && anyTarget);
    if (show !== (el.style.display === 'flex')) {
        el.style.display = show ? 'flex' : 'none';
        // The strip is a flex child, so showing it changes the map's height, and
        // Leaflet only learns that from an explicit call (otherwise the tiles keep
        // the old size and the map shows grey bands until the next resize).
        document.getElementById('app').classList.toggle('has-meet-strip', show);
        if (map) setTimeout(function() { map.invalidateSize(); }, 0);
    }
    if (!show) {
        // Nothing to point at: the chip goes and the map arrow goes with it. The
        // strip is a sibling of the map, so a hidden bar must not leave a line
        // drawn on it.
        renderDirection(selectedDevice, null, null);
        return;
    }

    // Nothing to measure to at all: the bar says so and stays, because this is the
    // only way into the list of people and places.
    if (!target) {
        document.getElementById('meet-strip-who-name').textContent = 'Auto';
        document.getElementById('meet-strip-scale').textContent = '';
        document.getElementById('meet-strip-trend').textContent = '';
        document.getElementById('meet-strip-when').textContent = 'nothing to measure to yet';
        document.getElementById('meet-strip-peer').style.display = 'none';
        document.getElementById('meet-strip-cross').style.display = 'none';
        document.getElementById('meet-strip-fill').style.width = '0%';
        el.classList.remove('live');
        el.title = 'Nothing has a position to measure to yet — tap the name to pick a person or place';
        renderDirection(selectedDevice, null, null);
        return;
    }

    // What the bar measures to, named once for every path below (a return before
    // this point must not leave the PREVIOUS subject's name on the bar, which is
    // what the unresolved-pick branch did the first time it was looked at).
    document.getElementById('meet-strip-who-name').textContent = target.name;

    // The bar's OWN crossing. While a reference is pinned the bar may be looking at
    // a pair the pill is not, so it asks the verdict about its two ends rather than
    // borrowing the pill's (`eta`): the green label and the red tick then always
    // belong to the pair drawn on the bar, and a place -- which has no velocity of
    // its own -- is never one of them.
    const pairId = (target.kind === 'user' && target.dist !== null) ? target.id : null;
    const cross = pairId ? meetStripCrossPair(selectedDevice, pairId) : null;
    const live = !!cross;
    el.classList.toggle('live', live);

    // While the panel is open its rows carry distances, which are the same kind of
    // live reading the bar is: refresh them on the same tick as the bar.
    const picker = document.getElementById('strip-picker');
    if (picker && picker.classList.contains('open')) renderStripPicker();

    // A pick that cannot be resolved YET (that peer has not reported since the
    // reload) still draws, with no dot and the reason printed: this bar is the only
    // place the pick can be cleared from, so it must not hide itself.
    if (target.dist === null) {
        document.getElementById('meet-strip-scale').textContent = '—';
        document.getElementById('meet-strip-trend').textContent = '';
        document.getElementById('meet-strip-when').textContent = 'no fix yet';
        document.getElementById('meet-strip-peer').style.display = 'none';
        document.getElementById('meet-strip-cross').style.display = 'none';
        document.getElementById('meet-strip-fill').style.width = '0%';
        el.title = selectedDevice + ' → ' + target.name + ' · nothing to measure to: that ' +
            (target.kind === 'fence' ? 'place is not in your list' : 'device has not reported since you picked it');
        renderDirection(selectedDevice, null, null);
        return;
    }

    const scale = meetStripScale(target.dist, target.kind + ':' + target.id);
    // Every mark on the track is placed by this one mapping, so the fill, the dot
    // and the crossing stay in one coordinate system: a distance, expressed as how
    // much of the bar's scale is still LEFT.
    const pct = function(m) { return meetStripFillFraction(m, scale) * 100; };
    // The fill's head IS the reading -- the dot sits on it -- so the shaded part
    // and the mark cannot drift apart and say two different things.
    const headPct = pct(target.dist);
    const tint = meetStripTint(meetStripCloseness(target.dist, meetStripScaleIdx));
    // The direction half of the SAME reading: one bearing, from this device to
    // this subject, drawn on the bar and on the map together -- and in the tint
    // the fill and the dot are already wearing.
    renderDirection(selectedDevice, target, tint);

    document.getElementById('meet-strip-scale').textContent = meetStripScaleLabel(scale);
    const dot = document.getElementById('meet-strip-peer');
    dot.style.display = 'block';   // …restored from the unresolved pick above
    dot.style.left = headPct.toFixed(2) + '%';
    dot.style.background = 'rgb(' + tint + ')';
    const fill = document.getElementById('meet-strip-fill');
    fill.style.width = headPct.toFixed(2) + '%';
    fill.style.background = 'rgba(' + tint + ',0.35)';

    // Where the two of them would actually cross: my own speed straight down my
    // own track for the time to closest approach, on the same axis as the rest --
    // so it lands to the RIGHT of the dot whenever the crossing is nearer to me
    // than the peer is now, which for a pair actually closing it is. Drawn only
    // while the pill is up -- a red mark on a pair with no crossing would be a
    // promise the pill is not making.
    const crossEl = document.getElementById('meet-strip-cross');
    const mv = live ? meetVelocity(devicePings[selectedDevice]) : null;
    if (live && mv) {
        crossEl.style.display = 'block';
        crossEl.style.left = pct(mv.kmh / 3.6 * cross.tcaS).toFixed(2) + '%';
    } else {
        crossEl.style.display = 'none';
    }

    // The reading, always as a number: past the top of the ladder the bar bottoms
    // out -- empty, dot at the left edge -- and an empty bar is what "far" looks
    // like at every range, so the bar must never be the only thing that says how
    // far it is.
    const ageS = target.at ? Math.max(0, Math.round((Date.now() - new Date(target.at).getTime()) / 1000)) : 0;
    const stale = !!target.at && ageS > CONFIG.MEET_ETA_FRESH_S;
    const gap = meetStripDistanceLabel(target.dist);
    // The trend arrow: WHICH WAY the gap is moving. The fill carries how much of
    // the scale is closed (tinted green when near, amber when far), and a rescale
    // can step that -- so a filled bar is not by itself proof of closing, and this
    // is the one thing on the bar that reacts to a DIRECTION rather than to a
    // distance.
    const trend = meetStripTrend(selectedDevice, target);
    const trendEl = document.getElementById('meet-strip-trend');
    trendEl.textContent = trend === 'closing' ? '▼' : trend === 'opening' ? '▲' : trend === 'flat' ? '▬' : '';
    trendEl.style.color = trend === 'closing' ? '#2ecc71' : trend === 'opening' ? '#f1c40f' : '#6b7280';
    document.getElementById('meet-strip-when').textContent =
        gap + (stale ? ' · ' + (ageS >= 90 ? Math.round(ageS / 60) + 'm old' : ageS + 's old') : '');
    el.title = selectedDevice + ' → ' + target.name + ' · ' + Math.round(target.dist) + ' m' +
        (stripSourceMode === 'fence' ? ' to the fence centre' : ' apart') +
        ' · the bar is ' + meetStripScaleLabel(scale) +
        (live ? ' · crossing in ' + Math.round(eta.tcaS) + ' s, passing ' + Math.round(eta.dcpa) + ' m away' : '') +
        (stale ? " · " + target.name + '\'s last fix is ' + ageS + ' s old' : '') +
        (trend === 'closing' ? ' · the gap is closing' : trend === 'opening' ? ' · the gap is opening' : '');
}

function updateTogetherAndETA() {
    const ids = Object.keys(latestPing);
    let together = false;
    for (let i = 0; i < ids.length && !together; i++) {
        for (let j = i + 1; j < ids.length; j++) {
            const a = latestPing[ids[i]], b = latestPing[ids[j]];
            if (a && b && distanceMeters(a.latitude, a.longitude, b.latitude, b.longitude) <= CONFIG.TOGETHER_DISTANCE_M) {
                together = true; break;
            }
        }
    }
    document.getElementById('peer-pill').style.display = together ? 'flex' : 'none';

    const etaEl = document.getElementById('eta-pill');
    const p = selectedDevice ? latestPing[selectedDevice] : null;
    const pts = selectedDevice ? (devicePings[selectedDevice] || []) : [];

    // The meeting verdict is computed ONCE per ping and handed to BOTH the gauge
    // and the pill, so the bar cannot be green for a moment the pill is dark on.
    // Both start from the same precondition: a device that is DRIVING right now,
    // by the map's own record of it (is_driving, the state machine's answer)
    // rather than a speed this code derived.
    const meet = (p && p.is_driving) ? meetEtaFor(selectedDevice) : null;
    renderMeetStrip(meet);

    // The meeting ETA goes first. When both it and the fence countdown are true,
    // the one about a person and a moment is the more urgent thing this slot can
    // say. Whether the fence countdown should survive at all is the question the
    // lab left open (its pill would replace this one outright, on the argument
    // that the badge's approach pulse already covers "you are nearly home");
    // keeping it as the fallback means this change cannot make the pill say LESS
    // than it did before.
    if (meet) { showMeetPill(meet); return; }

    if (!p || p.is_inside_geofence || !p.is_driving || (p.speed || 0) < CONFIG.ETA_MIN_SPEED_KMH || pts.length < 2 || GEOFENCES.length === 0) {
        etaEl.className = '';
        etaEl.style.display = 'none';
        return;
    }
    const prev = pts[pts.length - 2], cur = pts[pts.length - 1];
    const heading = bearingDegrees(prev.latitude, prev.longitude, cur.latitude, cur.longitude);

    let best = null, bestDist = Infinity;
    for (const f of GEOFENCES) {
        const brg = bearingDegrees(cur.latitude, cur.longitude, f.lat, f.lng);
        if (angularDiff(heading, brg) > CONFIG.ETA_MAX_BEARING_DIFF_DEG) continue;
        const d = distanceMeters(cur.latitude, cur.longitude, f.lat, f.lng);
        if (d < bestDist) { bestDist = d; best = f; }
    }
    if (!best) { etaEl.style.display = 'none'; return; }

    const speedMs = (p.speed || 0) / 3.6;
    const etaMin = speedMs > 0 ? Math.max(1, Math.round((bestDist / speedMs) / 60)) : null;
    etaEl.className = '';
    etaEl.innerHTML = '<span>Heading toward</span><span class="eta-dest">' + getDisplayName(best.name) + ' - ~' + (etaMin !== null ? etaMin : '--') + 'm</span>';
    etaEl.style.display = 'flex';
}

// ── The approach pulse (VISUAL ONLY) ────────────────────────────
// The DO arms it from the very code path that sends the "60s / 30s from
// <place>" push, so the badge can never claim an approach the notification
// missed (or stay dark for one it sent). Everything about the SHAPE of it is
// decided here: yellow at the 60s threshold, red at 30s, gone when the window
// closes.

/** One server pulse -> this client's copy of it. `ageMs` (snapshots only) is
 * how long ago the threshold fired BY THE SERVER'S OWN CLOCK -- the two clocks
 * are never subtracted, because a phone can be minutes off and that would
 * silently eat the whole window. */
function approachPulseFrom(serverPulse) {
    if (!serverPulse || typeof serverPulse.threshold !== 'number') return null;
    const age = typeof serverPulse.ageMs === 'number' ? Math.max(0, serverPulse.ageMs) : 0;
    const left = CONFIG.APPROACH_PULSE_LINGER_MS - age;
    if (left <= 0) return null;
    return {
        level: serverPulse.threshold <= 30 ? 'red' : 'yellow',
        place: serverPulse.place || serverPulse.fence || 'Home',
        threshold: serverPulse.threshold,
        until: Date.now() + left
    };
}

/** Drops pulses whose window has closed, and returns how many went. It never
 * re-renders on its own: renderBadges() calls it, so it must not call back. */
function dropExpiredPulses() {
    const now = Date.now();
    let dropped = 0;
    for (const devId of Object.keys(approachPulses)) {
        if (approachPulses[devId].until <= now) { delete approachPulses[devId]; dropped++; }
    }
    return dropped;
}

/** An `approach` frame from the DO: a crossed threshold, or a clear (arrived,
 * turned away, too far out). */
function handleApproach(data) {
    const devId = data.deviceId;
    if (!devId || DEVICES.indexOf(devId) === -1) return;
    if (data.cleared) {
        if (approachPulses[devId]) { delete approachPulses[devId]; renderBadges(); }
        return;
    }
    const pulse = approachPulseFrom(data);
    if (!pulse) return;
    approachPulses[devId] = pulse;
    renderBadges();
    // The window closes on WALL TIME, not on the next ping: a device that stops
    // reporting mid-approach (tunnel, flat battery) has to stop pulsing exactly
    // like one that drove past, and no ping may arrive to make that happen.
    setTimeout(function() { if (dropExpiredPulses() > 0) renderBadges(); }, CONFIG.APPROACH_PULSE_LINGER_MS + 300);
}

/** One radar, anchored on the pulsing device's badge. The rings are identical
 * circles; the CSS spaces them out and scales them, so nothing here decides
 * timing — only WHICH card the sweep belongs to. */
function buildApproachRadar(level) {
    const el = document.createElement('div');
    el.className = 'approach-radar' + (level === 'red' ? ' red' : '');
    el.setAttribute('data-level', level);
    el.innerHTML = '<span class="halo"></span>' +
        '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<circle cx="50" cy="50" r="20"></circle>' +
            '<circle cx="50" cy="50" r="20"></circle>' +
            '<circle cx="50" cy="50" r="20"></circle>' +
        '</svg>';
    return el;
}

/** Put a radar on its badge's centre. Fixed positioning off the card's own
 * rect: the layer is a sibling of the map, so no offset maths and no stale
 * coordinates when the strip scrolls or the window resizes. */
function positionApproachRadar(el, devId) {
    const badge = document.querySelector('#badge-strip .user-badge[data-device="' + devId + '"]');
    if (!badge) return;
    const r = badge.getBoundingClientRect();
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top + r.height / 2) + 'px';
}

/** Sync the radar layer with approachPulses: one radar per pulsing device, on
 * that device's badge, yellow or red. Called from renderBadges() so a ping
 * landing mid-approach cannot leave the sweep anchored to a stale card, and
 * from resize/scroll for the same reason. */
function renderApproachRadar() {
    const layer = document.getElementById('approach-radar-layer');
    if (!layer) return;
    const live = Object.keys(approachPulses);
    Array.prototype.slice.call(layer.querySelectorAll('.approach-radar')).forEach(function(el) {
        const devId = el.getAttribute('data-device');
        if (live.indexOf(devId) === -1) { layer.removeChild(el); return; }
        positionApproachRadar(el, devId);
        const level = approachPulses[devId].level;
        // Only on a real change: re-assigning the same class restarts the
        // animation, and renderBadges runs on every ping.
        if (el.getAttribute('data-level') !== level) {
            el.setAttribute('data-level', level);
            el.className = 'approach-radar' + (level === 'red' ? ' red' : '');
        }
    });
    live.forEach(function(devId) {
        if (layer.querySelector('.approach-radar[data-device="' + devId + '"]')) return;
        const el = buildApproachRadar(approachPulses[devId].level);
        el.setAttribute('data-device', devId);
        layer.appendChild(el);
        positionApproachRadar(el, devId);
    });
}

function renderBadges() {
    const strip = document.getElementById('badge-strip');
    dropExpiredPulses();
    strip.innerHTML = '';

    for (const devId of DEVICES) {
        const last = latestPing[devId];
        const badge = document.createElement('div');
        badge.className = 'user-badge' + (followDeviceId === devId ? ' following' : '');
        // The radar anchors on this card, so it must be findable by device.
        badge.setAttribute('data-device', devId);
        badge.addEventListener('click', function() { followDevice(devId); });

        const control = deviceControlState[devId] || {};
        const controlPills = [];
        if (control.forcedMode) controlPills.push('<span class="badge-control-pill">Locked: ' + control.forcedMode + '</span>');
        if (control.recordingPaused) controlPills.push('<span class="badge-control-pill">Paused</span>');
        const controlHtml = controlPills.length ? ('<div class="badge-control-row">' + controlPills.join('') + '</div>') : '';
        const distHtml = '<div style="font-size:9px;color:#9ca3af;margin-top:1px;">🚗 ' + ((todayDist[devId] || 0)).toFixed(1) + ' km today</div>';
        // The pulse is re-applied on every rebuild (like the address), so a
        // ping landing mid-approach cannot wipe the thing that is telling you
        // to open the gate. It does not add a line of its own -- it REPLACES
        // the status row below (see statusRow): the card has one 9px row for
        // "how fresh / where", and a second row only for a countdown would be
        // a temporary line in a very small card.
        const pulse = approachPulses[devId] || null;

        if (!last) {
            badge.innerHTML =
                '<div class="badge-left">' +
                    '<div class="badge-device"><span class="emoji">' + (EMOJI_MAP[devId] || '📍') + '</span> ' + devId + '</div>' +
                    '<div class="badge-status-row"><span class="badge-status-offline">Offline</span></div>' +
                    '<div class="badge-activity-fallback">No data</div>' +
                    distHtml +
                    controlHtml +
                '</div>' +
                '<div class="badge-right"><span class="addr-loading">—</span></div>';
            strip.appendChild(badge);
            continue;
        }

        const now = new Date();
        const pingTime = new Date(last.timestamp);
        const diffMin = (now - pingTime) / 60000;

        let statusText, statusClass;
        if (diffMin < 2) { statusText = 'Live'; statusClass = 'badge-status-live'; }
        else if (diffMin < 60) { statusText = Math.round(diffMin) + ' Min Ago'; statusClass = 'badge-status-yellow'; }
        else { statusText = pingTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); statusClass = 'badge-status-offline'; }

        // While an approach pulse is on, the status line IS the approach line:
        // it answers the same question ("what is happening right now?") in the
        // same place, so the card gains no line and the countdown cannot be
        // missed among other readouts. Freshness comes back the moment it ends.
        const statusRow = pulse
            ? '<div class="badge-status-row"><span class="badge-approach-note">→ ' + escapeHtml(pulse.place) + ' · ~' + pulse.threshold + 's</span></div>'
            : '<div class="badge-status-row"><span class="' + statusClass + '">' + statusText + '</span></div>';

        let activityText, activityClass;
        if (last.is_inside_geofence && last.geofence_name) {
            const display = getDisplayName(last.geofence_name);
            const cat = getCategory(last.geofence_name);
            activityText = 'At ' + display;
            activityClass = cat === 'Office' ? 'badge-activity-office' : 'badge-activity-home';
        } else if (last.is_stationary) {
            activityText = 'Stationary'; activityClass = 'badge-activity-fallback';
        } else if (last.is_driving) {
            // A driving ping with NO speed is not a parked device. The report
            // was discarded (μlogger's m/s x 3.6 lands above the jitter limit)
            // or never carried, and `|| 0` turned that into "0 km/h" -- the one
            // number in this row that says "parked", on a device it just told
            // you is driving. The HUD prints "-- / No signal" for the same
            // ping, so the badge says "-- km/h" instead of contradicting it.
            const kmh = (last.speed === null || last.speed === undefined) ? '--' : Math.round(last.speed);
            activityText = kmh + ' km/h'; activityClass = 'badge-activity-fallback';
        } else {
            activityText = 'Walking'; activityClass = 'badge-activity-fallback';
        }

        // Battery when the tracker reports one; otherwise GPS accuracy, which
        // every µlogger ping carries. (The battery strip had no CSS either, so
        // it was dead in both senses.)
        const batt = last.battery;
        const acc = accuracyLabel(last.accuracy);
        let metaHtml = '';
        if (batt !== null && batt !== undefined) {
            metaHtml = '<div class="badge-meta"><div class="badge-meta-bar" style="width:' + Math.min(batt, 100) + '%;background:' + getBatteryColor(batt) + '"></div><span>' + batt + '%</span></div>';
        } else if (acc) {
            metaHtml = '<div class="badge-meta">' + acc + '</div>';
        }

        // The address is RE-APPLIED from the cache on every rebuild, so it
        // survives renderBadges() being called on the next ping (see
        // cachedAddressLines). "—" means nothing is known yet, not "loading".
        const addr = cachedAddressLines(devId, last);
        const rightHtml =
            '<div class="badge-right">' +
                '<span id="primary-' + devId + '"' + (addr ? '' : ' class="addr-loading"') + '>' + (addr ? escapeHtml(addr.primary) : '—') + '</span><br>' +
                '<span id="secondary-' + devId + '">' + (addr ? escapeHtml(addr.secondary) : '') + '</span><br>' +
                '<span id="tertiary-' + devId + '">' + (addr ? escapeHtml(addr.tertiary) : '') + '</span>' +
            '</div>';

        badge.innerHTML =
            '<div class="badge-left">' +
                '<div class="badge-device">' +
                    '<span class="emoji">' + (EMOJI_MAP[devId] || '📍') + '</span> ' + devId +
                    '<span class="track-eye' + (trackVisible[devId] === false ? ' hidden' : '') + '" title="Show/hide track">👁</span>' +
                    (followDeviceId === devId ? '<span class="follow-icon">*</span>' : '') +
                '</div>' +
                statusRow +
                '<div class="' + activityClass + '">' + activityText + '</div>' +
                distHtml +
                controlHtml +
                metaHtml +
            '</div>' +
            rightHtml;
        if (pulse) badge.classList.add('approach-' + pulse.level);
        strip.appendChild(badge);

        const eyeEl = badge.querySelector('.track-eye');
        if (eyeEl) {
            eyeEl.addEventListener('click', function(e) {
                e.stopPropagation();
                const newVisible = !(trackVisible[devId] !== false);
                trackVisible[devId] = newVisible;
                localStorage.setItem('track_hidden_' + devId, newVisible ? 'false' : 'true');
                resetTrail(devId);   // hidden: layers gone; shown again: re-committed from the start
                startPlaybackLoop();
                renderBadges();
            });
        }

        if (!last.is_inside_geofence) {
            // Reverse-geocoding is THROTTLED. Nominatim asks for <=1 req/s and
            // renderBadges runs on every live ping (~5s), so re-fetch only when
            // the device actually moved >150m or the cached text is >5 min old,
            // and never more than once per 20s. Inside a fence we never ask:
            // the fence already says where the device is.
            const prevAddr = addressCache[devId];
            const nowMs = Date.now();
            const movedM = prevAddr ? distanceMeters(prevAddr.lat, prevAddr.lon, last.latitude, last.longitude) : Infinity;
            const stale = !prevAddr || (nowMs - prevAddr.at) > 5 * 60 * 1000;
            const coolEnough = !prevAddr || (nowMs - prevAddr.at) >= 20 * 1000;
            // Parked where we already resolved = nothing new to ask. The old gate
            // refused ANY fetch while stationary, so a device switched on
            // somewhere new stayed on a dash until it moved again.
            const parkedHere = !!last.is_stationary && movedM < 150;
            if (coolEnough && !parkedHere && (movedM > 150 || stale)) {
                // The point is recorded BEFORE the fetch resolves, which is what
                // throttles; the text lands here when Nominatim answers.
                addressCache[devId] = { lat: last.latitude, lon: last.longitude, at: nowMs, text: prevAddr ? prevAddr.text : null };
                saveAddressCache();
                (function(devId, last) {
                    fetch('https://nominatim.openstreetmap.org/reverse?lat=' + last.latitude + '&lon=' + last.longitude + '&format=jsonv2&zoom=18&addressdetails=1')
                    .then(function(resp) { return resp.ok ? resp.json() : null; })
                    .then(function(data) {
                        if (!data || !data.address) return;
                        const lines = describeAddress(data.address);
                        const entry = addressCache[devId];
                        if (!entry) return;
                        entry.text = lines;              // survives the next renderBadges()
                        saveAddressCache();
                        applyAddressLines(devId, lines); // no-op if the badge was rebuilt meanwhile
                    }).catch(function() {});
                })(devId, last);
            }
        }
    }

    // The sweep is drawn OUTSIDE the strip (see #approach-radar-layer): the
    // badge carries the identity, the radar carries the distance.
    renderApproachRadar();
}

async function apiJson(method, path, body) {
    const opts = { method: method, credentials: 'include' };
    if (body !== undefined) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
    }
    // A fetch that never reaches the server REJECTS instead of answering, and
    // an unhandled rejection here is a silent no-op: tapping Save appears to
    // do nothing at all (a phone whose radio was asleep, a dropped Wi-Fi
    // handover). Answer in the same shape as every other failure so the
    // callers' existing alert branch runs and the save cannot fail invisibly.
    let resp;
    try {
        resp = await fetch(path, opts);
    } catch (e) {
        return { ok: false, status: 0, data: { message: 'Could not reach the server — check your connection and try again.' } };
    }
    let data = null;
    try { data = await resp.json(); } catch (e) {}
    return { ok: resp.ok, status: resp.status, data: data };
}

async function flushNow() {

function renderGeofenceList() {
    if (GEOFENCES.length === 0) return '<div style="font-size:10px;opacity:0.5;">No geofences.</div>';
    return GEOFENCES.map(function(f) {
        return '<div class="settings-row" style="justify-content:flex-start;gap:8px;">' +
            '<span style="flex:1;">' + escapeHtml(f.displayName || f.name) + ' <span style="opacity:0.5;">(' + escapeHtml(f.category || 'none') + ')</span></span>' +
            '<button class="toggle-pill" onclick="editGeofenceForm(\'' + f.name + '\')">Edit</button>' +
            '<button class="toggle-pill" onclick="deleteGeofence(\'' + f.name + '\')">Delete</button>' +
        '</div>';
    }).join('');
}

function editGeofenceForm(name) {
    const f = GEOFENCES.find(function(g) { return g.name === name; });
    if (!f) return;
    editingGeofence = name;
    document.getElementById('gf-name').value = f.name;
    document.getElementById('gf-name').readOnly = true;
    document.getElementById('gf-display').value = f.displayName || '';
    document.getElementById('gf-category').value = f.category || '';
    document.getElementById('gf-lat').value = f.lat;
    document.getElementById('gf-lon').value = f.lng;
    document.getElementById('gf-radius').value = (f.radiusM != null) ? f.radiusM : 50;
    document.getElementById('gf-exit').value = (f.exitRadiusM != null) ? f.exitRadiusM : '';
    document.getElementById('gf-submit').textContent = 'Save geofence';
}

function resetGeofenceForm() {
    editingGeofence = null;
    const n = document.getElementById('gf-name'); if (n) { n.value = ''; n.readOnly = false; }
    ['gf-display', 'gf-lat', 'gf-lon', 'gf-exit'].forEach(function(id) { const el = document.getElementById(id); if (el) el.value = ''; });
    const r = document.getElementById('gf-radius'); if (r) r.value = '50';
    const c = document.getElementById('gf-category'); if (c) c.value = 'Home';
    const s = document.getElementById('gf-submit'); if (s) s.textContent = 'Add geofence';
}

async function submitGeofence() {
    const name = document.getElementById('gf-name').value.trim();
    const display = document.getElementById('gf-display').value.trim();
    const category = document.getElementById('gf-category').value || null;
    const lat = parseFloat(document.getElementById('gf-lat').value);
    const lon = parseFloat(document.getElementById('gf-lon').value);
    // Blank means "the default" (50 / entry+40), a NUMBER means what it says,
    // and anything else is refused out loud. The old parseFloat-or-fallback
    // silently turned a typo ("100m", "1,5") into the default — for the exit
    // field that meant silently CLEARING a radius the household had set.
    const radiusRaw = document.getElementById('gf-radius').value.trim();
    let radius = 50;
    if (radiusRaw) {
        const n = parseFloat(radiusRaw);
        if (!Number.isFinite(n) || n <= 0) { alert('Entry radius must be a positive number of metres.'); return; }
        radius = n;
    }
    const exitRaw = document.getElementById('gf-exit').value.trim();
    let exit = null;
    if (exitRaw) {
        const n = parseFloat(exitRaw);
        if (!Number.isFinite(n) || n <= 0) { alert('Exit radius must be a positive number of metres, or leave it blank for entry+40.'); return; }
        exit = n;
    }
    if (!name || !display || isNaN(lat) || isNaN(lon)) { alert('Name, display name, lat, and lon are required.'); return; }

    const body = { displayName: display, category: category, lat: lat, lon: lon, radiusM: radius, exitRadiusM: exit };
    const r = editingGeofence
        ? await apiJson('PUT', '/way/api/geofences/' + encodeURIComponent(editingGeofence), body)
        : await apiJson('POST', '/way/api/geofences', Object.assign({ name: name }, body));

    if (r.ok) {
        resetGeofenceForm();
        await loadDevicesAndGeofences();
        drawGeofenceCircles();
        renderSettingsMenu();
    } else {
        alert(r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function deleteGeofence(name) {
    if (!confirm('Delete geofence "' + name + '"?')) return;
    const r = await apiJson('DELETE', '/way/api/geofences/' + encodeURIComponent(name));
    if (r.ok) {
        resetGeofenceForm();
        await loadDevicesAndGeofences();
        drawGeofenceCircles();
        renderSettingsMenu();
    } else {
        alert(r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function generateInviteCode() {
    const r = await apiJson('POST', '/way/api/invite-codes');
    if (r.ok && r.data && r.data.code) {
        loadInviteCodes();

        alert(r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function loadInviteCodes() {
    const el = document.getElementById('invite-codes-list');
    if (!el) return;
    const r = await apiJson('GET', '/way/api/invite-codes');
    if (!r.ok) { el.textContent = 'Could not load.'; return; }
    const codes = (r.data && r.data.codes) || [];
    if (codes.length === 0) { el.innerHTML = '<div style="opacity:0.5;margin-top:6px;">No codes generated yet.</div>'; return; }
    el.innerHTML = codes.map(function(c) {
        const used = c.usedAt ? 'used' : 'active';
        return '<div style="margin-top:4px;">' + escapeHtml(c.code) + ' <span style="opacity:0.5;">(' + used + ', expires ' + formatTime(c.expiresAt) + ')</span></div>';
    }).join('');
}

async function deleteHistory() {
    const months = parseInt(document.getElementById('del-months').value, 10);
    const deleteTracks = document.getElementById('del-tracks').checked;
    const deleteMessages = document.getElementById('del-messages').checked;
    if (!deleteTracks && !deleteMessages) { alert('Select at least one item to delete.'); return; }
    const label = (deleteTracks ? 'tracks' : '') + (deleteTracks && deleteMessages ? ' and ' : '') + (deleteMessages ? 'messages' : '');
    if (!confirm('Delete ' + label + ' older than ' + months + ' month(s)? This cannot be undone.')) return;
    const r = await apiJson('POST', '/way/api/history/delete', { months: months, deleteTracks: deleteTracks, deleteMessages: deleteMessages });
    if (r.ok) {
        setMsg('delete-msg', 'Deleted ' + (r.data.deletedPings || 0) + ' track points and ' + (r.data.deletedMessages || 0) + ' messages.');
    } else {
        setMsg('delete-msg', r.data && r.data.message ? r.data.message : 'Failed.');
    }
}

async function saveProfile() {
    const emoji = document.getElementById('set-emoji').value.trim();
    const color = document.getElementById('set-color').value.trim();
    const r = await apiJson('PUT', '/way/api/users/me', { emoji: emoji || null, color: color || null });
    if (r.ok) {

async function changePassword() {
    const current = document.getElementById('pw-current').value;
    const nw = document.getElementById('pw-new').value;
    const confirmPw = document.getElementById('pw-confirm').value;
    if (!current || !nw) { setMsg('profile-msg', 'Enter current and new password.'); return; }
    if (nw !== confirmPw) { setMsg('profile-msg', 'New passwords do not match.'); return; }
    const r = await apiJson('POST', '/way/api/auth/password', { currentPassword: current, newPassword: nw });
    if (r.ok) {

        document.getElementById('pw-current').value = '';

    }
