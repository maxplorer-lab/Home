<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<title>Laoka</title>
<link rel="manifest" href="/laoka/manifest.webmanifest">
<link rel="icon" href="/laoka/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/laoka/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laoka">
<link rel="stylesheet" href="/laoka/styles.css">
<!-- Typed, not nudged: no spinner buttons on a number box, and a wheel over a
     focused one (the qty and unit-price boxes in the to-buy list, the count
     modals) scrolls this list instead of stepping the value. -->
<script src="/shared/number-entry.js"></script>
<script>
  // Applied before first paint so a dark-mode reload never flashes white.
  try {
    var saved = localStorage.getItem('laoka-theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch (e) {}

  // ── Home embed mode ────────────────────────────────────────────
  // Running as a tab inside the Home super app (iframe = embed): drop this
  // app's own chrome — the shell provides the header and the tab bar — and
  // keep the week pills reachable on every screen size. Standalone visits
  // (window.self === window.top) keep the complete original UI.
  if (window.self !== window.top) {
    document.documentElement.classList.add('home-embed');
    document.write('<style>' +
      /* The shell owns the brand and dark-mode, so the topbar keeps only
         the week selector. The bottom nav is replaced by the Home tab bar. */
      '.topbar .brand, .topbar .top-actions, #bottomnav { display: none !important; }' +
      /* Sticky, like the standalone bar: the shell owns the bottom nav, so this
         row is the ONLY way to move between Laoka's six tabs — it must not scroll
         out of reach on a long shopping list. It pins to the 46px header above it. */
      '#topnav { display: block !important; top: 46px; }' +

      /* Six nav buttons on a phone-width frame do not fit on one line, and the
         standalone version leans on the bar being wide enough at md+ (the shell
         embeds this app at ANY width, so the bar has to cope with 360px).
         Wrapping is what keeps History and Settings reachable -- clipping them
         (the overflow-x hack that used to live here) left both tabs unusable. */
      '#topnav .inner { flex-wrap: wrap; }' +

      /* NO overflow rule on html/body here, deliberately. `overflow-x: hidden`
         on the root element (a) hides the bottom tabs behind the nav instead of
         wrapping them and (b) is a documented way to kill WHEEL SCROLLING of the
         document, because the root element stops being the viewport scroller.
         Losing the mouse wheel on a long shopping list is far worse than a
         clipped button row, so horizontal overflow is fixed at its source
         instead: the nav wraps, and nothing in this app is wider than a phone. */

      /* The bottom nav is gone in here, so the fixed totals ribbon moves down to
         the frame's edge (it used to float one nav-height above it) and the
         toast moves with it. */
      '.totals { bottom: 0 !important; }' +
      '.toast { bottom: calc(74px + env(safe-area-inset-bottom, 0px)) !important; }' +

      /* Room for the ribbon, and NOTHING else: the shell's tab bar lives in the
         host document, so this app no longer reserves space for a bottom nav it
         does not draw. The `body.with-totals` rule has to be repeated at this
         specificity or the reserved 16px wins and the last rows of the
         shopping list sit permanently under the export ribbon. */
      '#view { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important; }' +
      'body.with-totals #view { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; }' +
    '<\/style>');
  }
</script>
</head>
<body>

<div id="nav-progress"><i></i></div>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">🍲 Laoka</span>
    <div id="weekbar" class="weekbar"></div>
    <div class="top-actions">
      <button class="iconbtn" id="themeBtn" title="Toggle dark mode" onclick="window.__laokaTheme()">🌙</button>
      <span class="who" id="userbar"></span>
    </div>
  </div>
</header>

<nav id="topnav" class="topnav"></nav>

<main id="view" class="view"></main>

<nav id="bottomnav" class="bottomnav"></nav>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="/laoka/app.js" type="module"></script>
</body>
</html>
