<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Chat · Home</title>
<style>
/* ============================================================================
   Home — the family chat.

   This is WAY's chat, MOVED OUT of WAY's dashboard rather than copied: the
   message bubble, reply, reaction and system-message rendering below is the
   same code that shipped inside WAY, just with the map/HUD/dashboard removed
   from around it. It talks to the same global /ws socket and the same
   FleetDO, so history, replies and reactions are one stream with no second
   implementation to keep in sync.

   Data flow (identical to WAY's, only the transport envelope is filtered):
     snapshot frame  -> data.chat[]  -> the initial history
     'chat' frames   -> live messages from anyone
     'chatReactions' -> reaction counts changed for one message
   Sending goes out over the same socket: {type:'chat'} / {type:'chat-react'}.
   ============================================================================ */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: #0a0a0c; color: #fff; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
}
.chat-shell { max-width: 640px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 10px 12px 0 12px; }

/* Only ever visible when the socket is down -- the rest of the time the
   message list is the whole view. */
#chat-conn {
    display: none; align-self: center; margin-bottom: 6px; padding: 3px 10px;
    border-radius: 9999px; font-size: 10px; letter-spacing: 0.02em;
    background: rgba(148,163,184,0.15); border: 1px solid rgba(148,163,184,0.3); color: #cbd5e1;
}
#chat-conn.show { display: block; }

.chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 4px 16px 4px; }
.chat-msg { max-width: 82%; padding: 6px 12px; border-radius: 14px; font-size: 13px; line-height: 1.4; word-break: break-word; background: rgba(60,60,80,0.95); box-shadow: 0 2px 8px rgba(0,0,0,0.4); color: #eee; align-self: flex-start; border-bottom-left-radius: 4px; }
.chat-msg.mine { align-self: flex-end; border-bottom-left-radius: 14px; border-bottom-right-radius: 4px; }
.chat-msg .sender { font-size: 10px; font-weight: 700; opacity: 0.8; margin-bottom: 2px; display: block; }
.chat-msg .time { font-size: 9px; opacity: 0.6; margin-top: 2px; display: block; text-align: right; }

/* Bubbles are position:relative so the reply button can sit in the corner. */
.chat-msg { position: relative; }
.chat-reply-btn {
    position: absolute; top: 1px; right: 4px; background: none; border: none;
    color: inherit; opacity: 0; cursor: pointer; font-size: 12px; line-height: 1;
    padding: 3px 4px; border-radius: 6px; transition: opacity 0.12s;
}
.chat-msg:hover .chat-reply-btn { opacity: 0.75; }
.chat-reply-btn:active { opacity: 1; transform: scale(1.15); }
/* Touch devices never hover, so the affordance has to be visible by default. */
@media (hover: none) { .chat-reply-btn { opacity: 0.5; } }
/* The quoted original, shown at the top of a reply bubble. */
.chat-quote {
    display: block; border-left: 3px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.2);
    border-radius: 3px; padding: 3px 8px; margin: 0 0 5px 0; font-size: 11px;
    cursor: pointer; overflow: hidden;
}
.chat-quote .q-sender { font-weight: 700; opacity: 0.9; }
.chat-quote .q-text { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }
.chat-msg.mine .chat-quote { border-left-color: rgba(255,255,255,0.75); }
/* Brief highlight when jumping to a quoted message. */
.chat-msg.flash { animation: wayFlash 1.2s ease-out; }
@keyframes wayFlash {
    0% { box-shadow: 0 0 0 3px rgba(56,189,248,0.95); }
    100% { box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
}
/* Second corner button (the reply button owns right:4px), same hover
   behaviour. Hidden until hover; half-visible on touch devices. */
.chat-react-btn {
    position: absolute; top: 1px; right: 24px; background: none; border: none;
    color: inherit; opacity: 0; cursor: pointer; font-size: 12px; line-height: 1;
    padding: 3px 4px; border-radius: 6px; transition: opacity 0.12s;
}
.chat-msg:hover .chat-react-btn { opacity: 0.75; }
.chat-react-btn:active { opacity: 1; transform: scale(1.15); }
@media (hover: none) { .chat-react-btn { opacity: 0.5; } }
/* The three-emoji strip. display:none keeps it closed until the ☺+ button
   adds .open -- without this rule it renders permanently inline in the
   bubble, which is exactly the bug that shipped first. */
.chat-react-picker {
    position: absolute; top: 20px; right: 4px; display: none; gap: 2px;
    background: rgba(30,30,45,0.97); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 9999px; padding: 3px 5px; z-index: 5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
}
/* Received bubbles sit at the container's LEFT edge and are often narrow:
   a right-anchored picker would extend leftward past the window and clip
   its first emoji. Anchor it to the bubble's left instead, growing into
   the open space. Own (right-aligned) bubbles keep the right anchor. */
.chat-msg:not(.mine) .chat-react-picker { right: auto; left: 4px; }
.chat-react-picker.open { display: flex; }
.chat-react-picker button {
    background: none; border: none; font-size: 15px; line-height: 1;
    cursor: pointer; padding: 3px 4px; border-radius: 9999px;
}
.chat-react-picker button:hover { background: rgba(255,255,255,0.12); }
.chat-react-picker button:active { transform: scale(1.2); }
/* Pill row under a bubble: a SIBLING element appended right after the
   bubble, so the bubble's own layout never shifts. One pill per emoji;
   the user's own reaction gets the highlighted ring. */
.chat-react-row {
    display: flex; flex-wrap: wrap; gap: 4px; margin: -4px 0 0 8px;
    justify-content: flex-start; align-self: flex-start;
    position: relative; z-index: 1; max-width: 100%;
}
.chat-msg.mine + .chat-react-row { justify-content: flex-end; align-self: flex-end; margin: -4px 8px 0 0; }
.chat-react-pill {
    display: inline-flex; align-items: center; gap: 3px;
    background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.35);
    color: #e2e8f0; border-radius: 9999px; padding: 1px 7px; font-size: 11px; cursor: pointer;
}
.chat-react-pill.mine { background: rgba(56,189,248,0.25); border-color: rgba(56,189,248,0.8); box-shadow: 0 0 0 1px rgba(56,189,248,0.45); }
.chat-react-pill:active { transform: scale(0.92); }
/* "Replying to ..." strip above the composer; hidden unless replying. */
.chat-reply-bar {
    display: none; align-items: center; gap: 8px; padding: 6px 10px; margin-top: 6px;
    border-left: 3px solid #38bdf8; background: rgba(56,189,248,0.12); border-radius: 6px; font-size: 11px;
}
.chat-reply-bar.open { display: flex; }
.chat-reply-bar .rb-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.9; }
.chat-reply-bar .rb-cancel { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1; }
.system-msg { align-self: center; text-align: center; margin: 4px 0; font-size: 11px; }
.system-msg .timestamp { font-size: 9px; color: #9ca3af; margin-bottom: 2px; }
.system-msg .message-row { display: flex; align-items: center; gap: 6px; }
.system-msg .line { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
.system-msg.entry .text { color: #34d399; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); padding: 4px 10px; border-radius: 9999px; }
.system-msg.exit .text { color: #93a4b8; background: rgba(148,163,184,0.1); border: 1px solid rgba(148,163,184,0.22); padding: 4px 10px; border-radius: 9999px; }
/* Money IN and money OUT must not look alike: expense follows Sompitra's red
   for spending, income its green for money received. Kiné keeps its own violet
   so a care/service event is not mistaken for a budget entry. */
.system-msg.expense .text { color: #fb7185; background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.28); padding: 4px 10px; border-radius: 9999px; }
.system-msg.income .text { color: #4ade80; background: rgba(34,197,94,0.13); border: 1px solid rgba(34,197,94,0.3); padding: 4px 10px; border-radius: 9999px; }
.system-msg.kine .text { color: #c084fc; background: rgba(168,85,247,0.13); border: 1px solid rgba(168,85,247,0.27); padding: 4px 10px; border-radius: 9999px; }
/* WAY's "~30s from Home1" entry timer, in the same amber the map pulses with,
   so the row in the chat and the card on the map read as one event. It is an
   arrival IN PROGRESS, not an arrival: entry (green) is the row that means the
   gate should already be open. */
.system-msg.approach .text { color: #fbbf24; background: rgba(245,158,11,0.13); border: 1px solid rgba(245,158,11,0.3); padding: 4px 10px; border-radius: 9999px; }

.chat-input-bar { display: flex; gap: 8px; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)) 0; border-top: 1px solid rgba(255,255,255,0.1); }
.chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 9px 12px; font-size: 12px; color: #fff; outline: none; font-family: inherit; }
.chat-input:focus { border-color: #38bdf8; background: rgba(255,255,255,0.09); }
.chat-send-btn { background: #0284c7; border: none; color: #fff; padding: 0 16px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="chat-shell">
    <div id="chat-conn">Connecting…</div>
    <div class="chat-msgs" id="chat-messages"></div>
    <div class="chat-reply-bar" id="chat-reply-bar">
        <span class="rb-text" id="chat-reply-text"></span>
        <button type="button" class="rb-cancel" onclick="cancelReply()" title="Cancel reply">✕</button>
    </div>
    <form class="chat-input-bar" onsubmit="event.preventDefault(); sendChatMessage();">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." maxlength="200" enterkeyhint="send" autocomplete="off">
        <button type="submit" class="chat-send-btn">Send</button>
    </form>
</div>

<script>
// ---- Config (the subset the chat needs) ------------------------------------
const CONFIG = {
    ENTRY_ICON: '📍',
    EXIT_ICON: '🚪',
    WS_RECONNECT_BASE_MS: 1500,
    WS_RECONNECT_MAX_MS: 20000,
    // Used for any auto event type this page does not know about yet, so a new
    // system message from any module still renders as a system row.
    AUTO_FALLBACK: { cls: 'exit', icon: '🔔' }
};

// How each system (auto) event type looks. WAY owns arrived/left (geofence
// transitions); Sompitra owns expense/income/kine (money activity, posted
// through the DO's /system-chat). The event type is set server-side and never
// by this page.
const AUTO_STYLE = {
    arrived: { cls: 'entry',   icon: CONFIG.ENTRY_ICON },   // 📍 green
    left:    { cls: 'exit',    icon: CONFIG.EXIT_ICON },    // 🚪 grey
    // The entry timer (60s / 30s out from a category="home" fence). Amber
    // hourglass: on the way, not there — see the CSS note above.
    approach: { cls: 'approach', icon: '⏳' },
    expense: { cls: 'expense', icon: '💸' },                // red   — money out
    income:  { cls: 'income',  icon: '💰' },                // green — money in
    kine:    { cls: 'kine',    icon: '🩺' },                // violet
    // Legacy alias: rows written before income/expense were split used one
    // "budget" type. They are already in scrollback forever, so keep rendering
    // them (as an expense) rather than dropping them to the fallback.
    budget:  { cls: 'expense', icon: '💸' }
};
const REACTIONS = ['👍', '🤣', '💖'];

// ---- State -----------------------------------------------------------------
let ws = null;
let wsReconnectDelay = CONFIG.WS_RECONNECT_BASE_MS;
let currentUser = null;
let renderedMessageIds = new Set();
let replyTarget = null; // { id, sender, snippet }

// ---- Small helpers (same implementations as WAY's) --------------------------
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
function formatTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function sendWs(obj) {
    // Returns whether it actually left the machine. A caller that clears its
    // own UI before checking this is how a message vanishes: the socket is
    // closed while the phone sleeps, the box empties, nothing is sent, and the
    // user is told nothing (setConn's "Reconnecting…" is easy to miss).
    if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(obj)); return true; }
    return false;
}

function toChat(raw) {
    // Reaction columns are JSON TEXT in the DO/D1 rows (snapshot) but real
    // objects on live broadcast frames -- normalize both to objects here so
    // renderers never see a string where a map belongs.
    function parseMaybeJson(v) {
        if (!v) return null;
        if (typeof v === 'object') return v;
        try { return JSON.parse(v); } catch (e) { return null; }
    }
    return {
        id: String(raw.id),
        sender: raw.sender,
        message: raw.message,
        is_auto: !!(raw.is_auto !== undefined ? raw.is_auto : raw.isAuto),
        event_type: (raw.event_type !== undefined ? raw.event_type : raw.eventType) || null,
        gps_timestamp: raw.gps_timestamp || null,
        created_at: raw.created_at || raw.createdAt,
        // Reply linkage. History rows (D1) are snake_case, live broadcasts
        // (DO) are camelCase -- accept both, as with everything else here.
        reply_to_id: (raw.reply_to_id !== undefined ? raw.reply_to_id : raw.replyToId) || null,
        reply_to_sender: (raw.reply_to_sender !== undefined ? raw.reply_to_sender : raw.replyToSender) || null,
        reply_to_snippet: (raw.reply_to_snippet !== undefined ? raw.reply_to_snippet : raw.replyToSnippet) || null,
        // Chat reactions (👍🤣💖). Snapshot rows (D1/DO rows) are snake_case,
        // live frames camelCase; accept both. Null/absent = no reactions.
        // Counts are the display truth; reaction_users only tells THIS user
        // whether they already reacted ("mine" styling + toggle target).
        reactions: parseMaybeJson(raw.reactions),
        reaction_users: parseMaybeJson(raw.reaction_users !== undefined ? raw.reaction_users : raw.reactionUsers),
        reaction_updated_at: raw.reaction_updated_at || raw.reactionUpdatedAt || null
    };
}

// ---- Connection ------------------------------------------------------------
function setConn(text) {
    const el = document.getElementById('chat-conn');
    if (!text) { el.classList.remove('show'); return; }
    el.textContent = text;
    el.classList.add('show');
}

function connectWebSocket() {
    // Close any previous socket first: the DO stamps the sender identity
    // from the session cookie AT CONNECT TIME, so a socket opened under an
    // old login must never survive a re-login.
    if (ws) {
        try { ws.onclose = null; ws.onerror = null; ws.onmessage = null; ws.close(); } catch (e) {}
        ws = null;
    }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = function() {
        wsReconnectDelay = CONFIG.WS_RECONNECT_BASE_MS;
        setConn(null);
    };
    ws.onmessage = function(evt) {
        let data;
        try { data = JSON.parse(evt.data); } catch (e) { return; }

        // The socket carries the whole fleet (positions, tracks, device
        // control). The chat only cares about these three frames -- and the
        // snapshot, which is where the initial history arrives.
        if (data.type === 'chat') handleNewMessage(toChat(data), true);
        else if (data.type === 'chatReactions') handleChatReactions(data);
        else if (data.type === 'snapshot') {
            renderedMessageIds.clear();
            document.getElementById('chat-messages').innerHTML = '';
            (data.chat || []).forEach(function(m) { handleNewMessage(toChat(m), false); });
        }
    };
    ws.onclose = function() {
        setConn('Reconnecting…');
        setTimeout(connectWebSocket, wsReconnectDelay);
        wsReconnectDelay = Math.min(wsReconnectDelay * 1.6, CONFIG.WS_RECONNECT_MAX_MS);
    };
    ws.onerror = function() { ws.close(); };
}

// ---- Rendering -------------------------------------------------------------
function handleNewMessage(msg, isLive) {
    if (renderedMessageIds.has(msg.id)) return;
    const container = document.getElementById('chat-messages');
    let div;
    // Reaction pill row (human messages only) -- created in the branch below
    // but appended to the container AFTER the bubble, because the bubble is
    // still detached when the branch runs.
    let reactRow = null;

    // EVERY is_auto message renders as a centred system row -- not just WAY's
    // arrivals/departures. Sompitra's budget and kine events arrive here too
    // (via the DO's /system-chat), and the chat is the app's one activity feed.
    // Unknown event types fall back to the neutral style with a bell, because a
    // system message must never degrade into a sender-less chat bubble.
    if (msg.is_auto) {
        const style = AUTO_STYLE[msg.event_type] || CONFIG.AUTO_FALLBACK;
        div = document.createElement('div');
        div.className = 'system-msg ' + style.cls;
        div.dataset.id = msg.id;
        const icon = style.icon;
        div.innerHTML =
            '<div class="timestamp">' + formatTime(msg.gps_timestamp || msg.created_at) + '</div>' +
            '<div class="message-row"><span class="line"></span><span class="text">' + icon + ' ' + escapeHtml(msg.message) + '</span><span class="line"></span></div>';
    } else {
        div = document.createElement('div');
        const isMine = currentUser && msg.sender === currentUser.username;
        div.className = 'chat-msg' + (isMine ? ' mine' : '');
        if (isMine && currentUser.color) {
            div.style.background = currentUser.color;
            div.style.boxShadow = '0 2px 8px ' + currentUser.color + '4d';
        }
        div.dataset.id = msg.id;
        div.innerHTML = '<span class="sender">' + escapeHtml(msg.sender || 'System') + '</span>' + escapeHtml(msg.message) + '<span class="time">' + formatTime(msg.gps_timestamp || msg.created_at) + '</span>';

        // Reply support, human messages only (replying to "arrived at Home"
        // would be odd, and system bubbles are centred rows, not bubbles).
        if (msg.reply_to_id) {
            const q = document.createElement('span');
            q.className = 'chat-quote';
            q.innerHTML = '<span class="q-sender">' + escapeHtml(msg.reply_to_sender || 'System') + '</span>' +
                '<span class="q-text">' + escapeHtml(msg.reply_to_snippet || '') + '</span>';
            // Only offer the jump when the original is actually on screen.
            const already = document.querySelector('#chat-messages [data-id="' + msg.reply_to_id + '"]');
            if (already) {
                q.title = 'Go to the quoted message';
                q.style.cursor = 'pointer';
                q.onclick = function() { scrollToMessage(msg.reply_to_id); };
            } else {
                q.style.cursor = 'default';
            }
            div.insertBefore(q, div.firstChild);
        }
        const replyBtn = document.createElement('button');
        replyBtn.type = 'button';
        replyBtn.className = 'chat-reply-btn';
        replyBtn.textContent = '↩';
        replyBtn.title = 'Reply';
        // Assigned as a property, not an inline onclick: message text can
        // contain quotes and would break out of an HTML attribute.
        replyBtn.onclick = function() { startReply(msg); };
        div.appendChild(replyBtn);

        const reactBtn = document.createElement('button');
        reactBtn.type = 'button';
        reactBtn.className = 'chat-react-btn';
        reactBtn.textContent = '☺+';
        reactBtn.title = 'React';
        reactBtn.onclick = function(e) { e.stopPropagation(); togglePicker(picker); };
        div.appendChild(reactBtn);
        const picker = document.createElement('div');
        picker.className = 'chat-react-picker';
        REACTIONS.forEach(function(em) {
            const eb = document.createElement('button');
            eb.type = 'button';
            eb.textContent = em;
            eb.onclick = function(e) {
                e.stopPropagation();
                closeAllPickers();
                // Only the message id and the emoji travel; identity and
                // counts are stamped server-side, exactly like chat text.
                if (!sendWs({ type: 'chat-react', id: msg.id, emoji: em })) {
                    setConn('Not connected — try again in a moment');
                }
            };
            picker.appendChild(eb);
        });
        div.appendChild(picker);

        reactRow = document.createElement('div');
        reactRow.className = 'chat-react-row';
        reactRow.dataset.reactFor = msg.id;
        renderReactionRow(reactRow, msg.reactions, msg.reaction_users);
    }

    container.appendChild(div);
    // Immediately after the bubble in the DOM, so .chat-msg.mine +
    // .chat-react-row right-aligns it for own messages.
    if (reactRow) container.appendChild(reactRow);
    renderedMessageIds.add(msg.id);
    container.scrollTop = container.scrollHeight;
}

// ---- Replies ---------------------------------------------------------------
// Only the target's ID is sent to the server; the quoted sender/snippet shown
// in the bubble come back from the DO, which resolves them from its own
// scrollback. So a reply's quote can never be forged from the browser.
function startReply(msg) {
    replyTarget = { id: msg.id, sender: msg.sender || 'System', snippet: msg.message || '' };
    const bar = document.getElementById('chat-reply-bar');
    const text = document.getElementById('chat-reply-text');
    if (text) {
        text.innerHTML = 'Replying to <b>' + escapeHtml(replyTarget.sender) + '</b>: ' + escapeHtml(replyTarget.snippet);
    }
    if (bar) bar.classList.add('open');
    const input = document.getElementById('chat-input');
    if (input) input.focus();
}

function cancelReply() {
    replyTarget = null;
    const bar = document.getElementById('chat-reply-bar');
    if (bar) bar.classList.remove('open');
}

/** Jump to a quoted message and flash it. Silently does nothing when the
 * original is no longer rendered (e.g. it aged out of the DO's scrollback,
 * or the quote was carried in from a different day's history). */
function scrollToMessage(id) {
    if (!id) return;
    const container = document.getElementById('chat-messages');
    const target = container ? container.querySelector('[data-id="' + id + '"]') : null;
    if (!target) return;
    target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    target.classList.remove('flash');
    // Force a reflow so re-clicking the same quote replays the animation.
    void target.offsetWidth;
    target.classList.add('flash');
    setTimeout(function() { target.classList.remove('flash'); }, 1300);
}

// ---- Reactions (👍🤣💖) -----------------------------------------------------
// Same trust model as replies: the browser sends only the message id and the
// emoji; who reacted and the counts come back stamped by the DO, so nothing
// here can be forged. State lives server-side -- the client just re-renders
// the pill row from each 'chatReactions' broadcast.

/** Open/close one picker; only one is ever open. */
function togglePicker(picker) {
    const wasOpen = picker.classList.contains('open');
    closeAllPickers();
    if (!wasOpen) picker.classList.add('open');
}
function closeAllPickers() {
    document.querySelectorAll('.chat-react-picker.open').forEach(function(p) { p.classList.remove('open'); });
}
// Any click outside a picker closes it (pickers stopPropagation on their own
// buttons, so this only fires for clicks elsewhere in the document).
document.addEventListener('click', function() { closeAllPickers(); });

/** Render (or re-render) one message's pill row from maps of
 *  emoji -> count and username -> emoji. */
function renderReactionRow(row, reactions, reactionUsers) {
    row.innerHTML = '';
    if (!reactions) return;
    const myName = currentUser ? currentUser.username : null;
    Object.keys(reactions).forEach(function(em) {
        const count = reactions[em];
        if (!count) return;
        const mine = !!(reactionUsers && myName && reactionUsers[myName] === em);
        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'chat-react-pill' + (mine ? ' mine' : '');
        pill.textContent = em + ' ' + count;
        pill.title = mine ? 'Tap to remove your reaction' : 'Tap to react ' + em;
        // A pill tap is the same toggle as picking from the picker.
        pill.onclick = function(e) {
            e.stopPropagation();
            if (!sendWs({ type: 'chat-react', id: row.dataset.reactFor, emoji: em })) {
                setConn('Not connected — try again in a moment');
            }
        };
        row.appendChild(pill);
    });
}

/** A reaction toggle landed (from this client or anyone else's): update the
 *  pill row in place. No bubble re-render -- the message content never
 *  changes, only the row under it. */
function handleChatReactions(data) {
    const row = document.querySelector('[data-react-for="' + data.id + '"]');
    if (!row) return;
    renderReactionRow(row, data.reactions, data.reactionUsers);
}

function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    const payload = { type: 'chat', message: text };
    if (replyTarget) payload.replyToId = replyTarget.id;
    // Send FIRST; only an accepted send may clear the composer. On a dead
    // socket the text stays in the box (and the reply target stays armed) and
    // the banner says why -- the message must never disappear silently.
    if (!sendWs(payload)) {
        setConn('Not connected — your message is still here, send again in a moment');
        input.focus();
        return;
    }
    input.value = '';
    cancelReply();
}

// ---- Boot ------------------------------------------------------------------
/** Who am I? Needed for the "mine" bubble styling (and its colour).
 *  NOTE: /way/api/users/me answers with the payload itself (not a
 *  {success, data} envelope) — read the fields directly, as WAY does. */
async function loadCurrentUser() {
    try {
        const resp = await fetch('/way/api/users/me', { credentials: 'include' });
        if (!resp.ok) return;
        const me = await resp.json();
        currentUser = { id: me.id, username: me.username, emoji: me.emoji, color: me.color, role: me.role };
    } catch (e) {}
}

async function boot() {
    await loadCurrentUser();
    connectWebSocket();
    document.getElementById('chat-input').focus();
}

boot();
</script>
